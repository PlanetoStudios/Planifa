function crestShapeClip(shape){
  switch(shape){
    case 'doubleRing':  return '<circle cx="50" cy="55" r="48"/>';
    case 'circle':      return '<ellipse cx="50" cy="55" rx="47" ry="52"/>';
    case 'hex':         return '<polygon points="50,2 95,27 95,83 50,108 5,83 5,27"/>';
    case 'pentagon':    return '<polygon points="50,2 97,40 79,105 21,105 3,40"/>';
    case 'banner':      return '<polygon points="4,4 96,4 96,92 75,102 50,92 25,102 4,92"/>';
    case 'diamond':     return '<polygon points="50,2 97,55 50,108 3,55"/>';
    case 'oval':        return '<ellipse cx="50" cy="55" rx="36" ry="53"/>';
    case 'roundSquare': return '<path d="M18,4 H82 Q96,4 96,18 V92 Q96,106 82,106 H18 Q4,106 4,92 V18 Q4,4 18,4 Z"/>';
    case 'arch':        return '<path d="M4,42 C4,8 96,8 96,42 V68 C96,90 76,99 50,109 C24,99 4,90 4,68 Z"/>';
    case 'star':        return '<polygon points="50,8 61,40 95,40 68,61 78,93 50,74 22,93 32,61 5,40 39,40"/>';
    case 'shield':
    default:            return '<path d="M4,4 H96 V62 C96,86 76,96 50,109 C24,96 4,86 4,62 Z"/>';
  }
}
function defaultCrestFor(t){
  return {shape:'shield', patterns:['solid'], base:t.color, accent:shade(t.color,-42), color3:t.color, color4:shade(t.color,-42),
    symbol:'none', text:crestLetters(t.name), stars:0, textPos:'bottom'};
}
/* Gera o preenchimento de UM estilo (sem recortar pra coluna nenhuma ainda — isso é feito por fora). */
function buildPatternFill(pattern, base, accent, idSeed){
  let defs = '';
  let fill = `<rect width="100" height="110" fill="${base}"/>`;
  if(pattern==='split'){
    fill = `<rect width="100" height="110" fill="${base}"/><polygon points="0,110 100,0 100,110" fill="${accent}"/>`;
  } else if(pattern==='gradient'){
    defs += `<linearGradient id="gr${idSeed}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${base}"/><stop offset="1" stop-color="${accent}"/></linearGradient>`;
    fill = `<rect width="100" height="110" fill="url(#gr${idSeed})"/>`;
  } else if(pattern==='stripes'){
    let st=''; const n=5, w=100/n;
    for(let i=0;i<n;i++) st += `<rect x="${i*w}" y="0" width="${w}" height="110" fill="${i%2 ? accent : base}"/>`;
    fill = st;
  } else if(pattern==='quarters'){
    fill = `<rect x="0" y="0" width="50" height="55" fill="${base}"/><rect x="50" y="0" width="50" height="55" fill="${accent}"/>`+
           `<rect x="0" y="55" width="50" height="55" fill="${accent}"/><rect x="50" y="55" width="50" height="55" fill="${base}"/>`;
  } else if(pattern==='cross'){
    fill = `<rect width="100" height="110" fill="${base}"/><rect x="40" y="0" width="20" height="110" fill="${accent}"/><rect x="0" y="45" width="100" height="20" fill="${accent}"/>`;
  } else if(pattern==='dots'){
    defs += `<pattern id="dp${idSeed}" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="${base}"/><circle cx="11" cy="11" r="5.5" fill="${accent}"/></pattern>`;
    fill = `<rect width="100" height="110" fill="url(#dp${idSeed})"/>`;
  } else if(pattern==='chevron'){
    fill = `<rect width="100" height="110" fill="${base}"/><polygon points="0,0 50,52 100,0 100,22 50,74 0,22" fill="${accent}"/>`;
  }
  return {fill, defs};
}
/* Monta o SVG do escudo a partir da configuração (usado tanto na prévia do editor quanto nas telas do jogo).
   Aceita até 3 estilos de uma vez (cfg.patterns) — cada um vira uma faixa vertical do escudo, com a
   própria cor principal (1ª, 3ª e 4ª cor) e a cor secundária (2ª cor) compartilhada entre todas as faixas. */
function crestSVGFromConfig(cfg, size, idSeed){
  size = size || 48;
  if(cfg.image) return crestImageHTML(cfg, size);
  if(cfg.shape==='doubleRing') return crestSVGDoubleRing(cfg, size, idSeed);
  const shape = cfg.shape || 'shield';
  const patterns = (Array.isArray(cfg.patterns) && cfg.patterns.length) ? cfg.patterns.slice(0,3) : [cfg.pattern || 'solid'];
  const base = cfg.base || '#29d398';
  const accent = cfg.accent || shade(base,-42);
  const colors = [base, accent, cfg.color3 || base, cfg.color4 || accent];
  const clip = crestShapeClip(shape);
  const isDR = shape==='doubleRing';
  const fillClip = isDR ? '<circle cx="50" cy="55" r="35"/>' : clip;   // anel duplo: estilos só no círculo interno
  let defsExtra = '';
  let fill = '';
  const n = patterns.length;
  patterns.forEach((pat,i)=>{
    const primary = i===0 ? colors[0] : (colors[i+1] || colors[0]);
    const {fill:bandFill, defs:bandDefs} = buildPatternFill(pat, primary, colors[1], idSeed+'_b'+i);
    defsExtra += bandDefs;
    if(n===1){
      fill += bandFill;
    } else {
      const w = 100/n, x0 = w*i;
      defsExtra += `<clipPath id="col${idSeed}_${i}"><rect x="${x0}" y="0" width="${w}" height="110"/></clipPath>`;
      fill += `<g clip-path="url(#col${idSeed}_${i})">${bandFill}</g>`;
    }
  });
  const symbolMeta = CREST_SYMBOLS.find(sy=>sy.key===cfg.symbol) || CREST_SYMBOLS[0];
  const hasSymbol = symbolMeta.key!=='none';
  const hasText = !!(cfg.text && String(cfg.text).trim());
  const textOnTop = cfg.textPos==='top';
  let symbolY, textY;
  if(hasSymbol && hasText){ symbolY = textOnTop ? 80 : 50; textY = textOnTop ? 28 : 90; if(isDR){ symbolY = textOnTop ? 68 : 45; textY = textOnTop ? 38 : 76; } }
  else { symbolY = 58; textY = 58; }
  let symbolEl = hasSymbol ? `<text x="50" y="${symbolY}" font-size="${isDR?30:38}" text-anchor="middle" dominant-baseline="central">${symbolMeta.emoji}</text>` : '';
  const textColor = contrastText(base);
  let textEl = hasText ? `<text x="50" y="${textY}" font-family="'Big Shoulders Display',sans-serif" font-weight="800" font-size="${isDR?(hasSymbol?13:20):(hasSymbol?17:27)}" letter-spacing="1" fill="${textColor}" text-anchor="middle" dominant-baseline="central">${escHtml(String(cfg.text).trim().toUpperCase().slice(0,crestTextMax(cfg)))}</text>` : '';
  let innerEl = '';
  { const r = crestInnerParts(cfg, {hasSymbol, hasText, symbolMeta, base, accent}); if(r){ innerEl=r.innerEl; symbolEl=r.symbolEl; textEl=r.textEl; } }
  const borderEl = patterns.includes('border') ? `<g fill="none" stroke="${accent}" stroke-width="7">${fillClip}</g>` : '';
  const starsEl = crestStarsHTML(cfg, 62);
  return `<svg viewBox="0 -16 100 126" width="${size}" height="${Math.round(size*1.26)}" style="display:block;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));">
    <defs><clipPath id="cc${idSeed}">${fillClip}</clipPath>${defsExtra}</defs>
    ${starsEl}
    ${isDR ? `<g><circle cx="50" cy="55" r="48" fill="${accent}"/><circle cx="50" cy="55" r="42" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.6"/></g>` : ''}
    <g clip-path="url(#cc${idSeed})">
      ${fill}
      <rect width="100" height="55" fill="rgba(255,255,255,.16)"/>
      <rect y="55" width="100" height="55" fill="rgba(0,0,0,.1)"/>
    </g>
    ${borderEl}
    ${isDR ? `<g fill="none" stroke="rgba(0,0,0,.4)" stroke-width="2.5">${fillClip}</g>` : ''}
    <g fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.5">${clip}</g>
    ${innerEl}${symbolEl}
    ${textEl}
    ${crestCrownHTML(cfg)}
  </svg>`;
}

let draftCrest = null;
function openCrestEditor(teamId){
  const t = findTeam(teamId);
  if(!t) return;
  if(!t.crest) t.crest = defaultCrestFor(t);
  draftCrest = Object.assign({}, t.crest);
  normalizeDraftCrest();
  setView('editCrest', {currentTeamId: teamId});
}
/* Compatibilidade com escudos salvos antes de existir múltiplos estilos/cores
   (eles só tinham "pattern" no singular e nenhuma 3ª/4ª cor). */
function normalizeDraftCrest(){
  if(!draftCrest) return;
  if(!Array.isArray(draftCrest.patterns) || !draftCrest.patterns.length) draftCrest.patterns = [draftCrest.pattern || 'solid'];
  if(!draftCrest.color3) draftCrest.color3 = draftCrest.base || '#29d398';
  if(!draftCrest.color4) draftCrest.color4 = draftCrest.accent || '#1b7a52';
}
function setCrestField(key, value){
  if(!draftCrest) return;
  draftCrest[key] = value;
  render();
}
/* Liga/desliga um estilo (até 3 de uma vez). Desligar o último não é permitido —
   sempre sobra pelo menos 1 estilo escolhido. */
function toggleCrestPattern(key){
  if(!draftCrest) return;
  normalizeDraftCrest();
  const idx = draftCrest.patterns.indexOf(key);
  if(idx>-1){
    if(draftCrest.patterns.length>1) draftCrest.patterns.splice(idx,1);
  } else {
    if(draftCrest.patterns.length>=3){ showAlert('Você pode combinar até 3 estilos no mesmo escudo.'); return; }
    draftCrest.patterns.push(key);
  }
  render();
}
function updateCrestText(val){
  if(!draftCrest) return;
  draftCrest.text = val;
  const el = document.getElementById('crest-preview');
  if(el) el.innerHTML = crestSVGFromConfig(draftCrest, 160, 'draft');
}

}
/* inclinação 3D + brilho que acompanha o mouse nas cartas */
function initCardTilt(){
  if(!document.addEventListener) return;
  document.addEventListener('mousemove', e=>{
    const w = e.target && e.target.closest ? e.target.closest('.card-wrap') : null;
    if(!w) return;
    const r = w.getBoundingClientRect();
    const px = (e.clientX-r.left)/r.width, py = (e.clientY-r.top)/r.height;
    w.style.setProperty('--ry', ((px-.5)*16)+'deg');
    w.style.setProperty('--rx', ((.5-py)*16)+'deg');
    w.style.setProperty('--mx', (px*100)+'%');
    w.style.setProperty('--my', (py*100)+'%');
  });
  document.addEventListener('mouseout', e=>{
    const w = e.target && e.target.closest ? e.target.closest('.card-wrap') : null;
    if(w && !w.contains(e.relatedTarget)){ w.style.setProperty('--rx','0deg'); w.style.setProperty('--ry','0deg'); }
  });
}

/* ============================= MÚSICA DE FUNDO ============================= */
/* Trilha instrumental gerada na hora com Web Audio (nenhum arquivo de áudio): pad suave, baixo,
   arpejo e uma melodia curta em loop (Lá menor). O navegador só deixa tocar áudio depois de um
   clique do jogador, então ela começa quando o botão "Jogar" é apertado (ou ao ligar nas Configurações). */
const MUSIC_VOLUMES = {low:0.07, medium:0.15, high:0.28};
const Music = {
  ctx:null, master:null, timer:null, step:0, nextTime:0, playing:false, volume:'medium',
  BPM:100,
  chords:[
    {root:110.00, tones:[220.00,261.63,329.63]},   // Am
    {root:87.31,  tones:[174.61,220.00,261.63]},   // F
    {root:130.81, tones:[261.63,329.63,392.00]},   // C
    {root:98.00,  tones:[196.00,246.94,293.66]},   // G
  ],
  melody:[
    659.25,0,523.25,0,440.00,0,523.25,0,
    523.25,0,440.00,0,523.25,0,698.46,0,
    659.25,0,783.99,0,659.25,0,523.25,0,
    587.33,0,493.88,0,587.33,0,783.99,0,
  ],
  ensure(){
    if(this.ctx) return true;
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return false;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = MUSIC_VOLUMES[this.volume] || 0.15;
      this.master.connect(this.ctx.destination);
      return true;
    }catch(e){ return false; }
  },
  note(freq, time, dur, type, peak){
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(peak, time+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, time+dur);
    o.connect(g); g.connect(this.master);
    o.start(time); o.stop(time+dur+0.05);
  },
  playStep(step, t){
    const barStep = step % 8, chord = this.chords[Math.floor(step/8) % 4];
    const eighth = 60/this.BPM/2;
    if(barStep===0){
      chord.tones.forEach(f=>this.note(f, t, eighth*8, 'sine', 0.05));
    }
    if(barStep===0 || barStep===4) this.note(chord.root, t, eighth*3.5, 'triangle', 0.18);
    const arp = [0,1,2,1,0,1,2,1][barStep];
    this.note(chord.tones[arp]*2, t, eighth*0.9, 'triangle', 0.05);
    const m = this.melody[step % 32];
    if(m) this.note(m, t, eighth*1.8, 'sine', 0.09);
  },
  schedule(){
    const eighth = 60/this.BPM/2;
    while(this.nextTime < this.ctx.currentTime + 0.6){
      this.playStep(this.step, this.nextTime);
      this.nextTime += eighth;
      this.step++;
    }
  },
  start(){
    if(!this.ensure()) return;
    try{ if(this.ctx.state==='suspended') this.ctx.resume(); }catch(e){}
    if(this.playing) return;
    this.playing = true;
    this.nextTime = this.ctx.currentTime + 0.1;
    this.step = 0;
    this.timer = setInterval(()=>this.schedule(), 100);
  },
  stop(){
    this.playing = false;
    if(this.timer){ clearInterval(this.timer); this.timer = null; }
  },
  setVolume(level){
    this.volume = MUSIC_VOLUMES[level] ? level : 'medium';
    if(this.master && this.ctx){
      try{ this.master.gain.setTargetAtTime(MUSIC_VOLUMES[this.volume], this.ctx.currentTime, 0.05); }catch(e){}
    }
  },
};
let musicAllowed = false;
function applyMusic(){
  const st = state.settings || defaultSettings();
  Music.setVolume(st.musicVolume);
  if(st.music && musicAllowed) Music.start(); else Music.stop();
}
if(typeof document!=='undefined' && document.addEventListener){
  document.addEventListener('visibilitychange', ()=>{
    if(!Music.ctx) return;
    try{
      if(document.hidden) Music.ctx.suspend();
      else if(Music.playing) Music.ctx.resume();
    }catch(e){}
  });
}

function startGame(){
  musicAllowed = true;
  applyMusic();
  state.view = 'loading';
  render();
  const MIN_MS = 700;
  const begin = Date.now();
  const go = ()=>{
    state.view = bootTargetView || (state.device ? 'home' : 'devicePick');
    render();
  };
  const tryFinish = ()=>{
    if(!bootReady){ setTimeout(tryFinish, 50); return; }
    const wait = Math.max(0, MIN_MS - (Date.now()-begin));
    setTimeout(go, wait);
  };
  tryFinish();
}

function bulkDeleteTeams(){

function defaultCoachFor(){
  const nat = pick(NATIONALITIES);
  return {name: randomNameForNationality(nat.name), nationality: nat.name, ovr: rnd(40,75)};
}
function coachTrainChance(coachOvr){ return Math.min(0.85, 0.15 + (coachOvr/100)*0.55); }
function coachTrainAmountMax(coachOvr){ return 2 + Math.floor(coachOvr/20); }
function coachPanelHTML(t){
  const coach = t.coach;
  const flag = coach ? flagEmoji(nationalityCode(coach.nationality)) : '';
  const chancePct = Math.round(coachTrainChance(coach ? coach.ovr : 20)*100);
  return `<div class="panel" style="margin-bottom:16px;">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <div>
        <h4 class="settings-panel-title" style="margin-bottom:4px;">👔 Técnico</h4>
        ${coach
          ? `<div style="font-size:14px;">${flag} <b style="color:var(--text);">${escHtml(coach.name)}</b> <span class="hint">· OVR ${coach.ovr}</span></div>`
          : `<p class="hint" style="margin:0;">Nenhum técnico contratado — o treino rende bem menos sem um.</p>`}
      </div>
      <div class="btn-row" style="margin:0;">
        <button class="btn secondary" onclick="openCoachModal('${t.id}')">${coach?'Trocar técnico':'Contratar técnico'}</button>
        <button class="btn gold" onclick="trainTeam('${t.id}')">🏋️ Treinar time</button>
      </div>
    </div>
    <p class="hint" style="margin:10px 0 0;">Chance de cada jogador evoluir no treino agora: <b style="color:var(--text);">${chancePct}%</b>. Quanto maior o OVR do técnico, maior a chance e maior o ganho de OVR de cada jogador que evoluir.</p>
  </div>`;
}
function trainingResultsHTML(t){
  if(!t.lastTraining) return '';
  const up = t.lastTraining.results.filter(r=>r.success);
  const flat = t.lastTraining.results.filter(r=>!r.success);
  return `<div class="panel" style="margin-bottom:16px;">
    <h4 class="settings-panel-title">📋 Resultado do último treino</h4>
    ${up.map(r=>`<div class="scorer-line">⬆️ <b>${escHtml(r.name)}</b> +${r.gain} OVR</div>`).join('')}
    ${flat.map(r=>`<div class="scorer-line" style="opacity:.55;">${escHtml(r.name)} — sem evolução</div>`).join('')}
    ${!up.length && !flat.length ? '<p class="hint" style="margin:0;">Ninguém evoluiu dessa vez.</p>' : ''}
  </div>`;
}
function trainTeam(teamId){
  const t = findTeam(teamId);
  if(!t) return;
  const roster = t.players.filter(Boolean);
  if(!roster.length){ showAlert('Esse time não tem jogadores escalados pra treinar.'); return; }
  const coachOvr = t.coach ? t.coach.ovr : 20;
  const chance = coachTrainChance(coachOvr);
  const amountMax = coachTrainAmountMax(coachOvr);
  const results = [];
  roster.forEach(p=>{
    if(Math.random() < chance){
      const gain = rnd(1, amountMax);
      const before = p.ovr;
      p.ovr = Math.min(MAX_OVR, p.ovr + gain);
      p.value = computePlayerValue(p.ovr);
      results.push({name:p.name, gain: p.ovr-before, success:true});
    } else {
      results.push({name:p.name, gain:0, success:false});
    }
  });
  t.lastTraining = {ts:Date.now(), results};
  saveState();
  render();
}
function openCoachModal(teamId){
  const t = findTeam(teamId);
  if(!t) return;
  const draft = t.coach ? {...t.coach} : defaultCoachFor();
  state.modal = {type:'coach', teamId, draft};
  render();
}
function updateCoachOvr(raw){
  if(!state.modal || state.modal.type!=='coach') return;
  let n = parseInt(raw,10); if(isNaN(n)) n = 1;
  n = Math.max(1, Math.min(99, n));
  state.modal.draft.ovr = n;
  const lab = document.getElementById('coach-ovr-label');
  if(lab) lab.textContent = n;
}

function changeFormation(teamId, newKey){
  const t = findTeam(teamId);
  const current = teamFilled(t);
  t.formation = newKey;
  const total = buildFormationSlots(newKey).length;
  t.players = Array(total).fill(null);
  current.slice(0,total).forEach((p,i)=>{ t.players[i]=p; });
  if(current.length>total) state.freeAgents.push(...current.slice(total));
  saveState();
  render();
}

let pendingConfirmAction = null;
function showConfirm(message, onYes){
  pendingConfirmAction = onYes;

function confirmYes(){
  const action = pendingConfirmAction;

  const t = findTeam(teamId);
  const ai = state.freeAgents.findIndex(p=>p.id===playerId);
  if(ai<0) return;
  const removed = t.players[idx];
  t.players[idx] = state.freeAgents[ai];
  state.freeAgents.splice(ai,1);
  logTransfer('signing', t.players[idx], FREE_LABEL, t.name);
  if(removed){ state.freeAgents.push(removed); logTransfer('release', removed, t.name, FREE_LABEL); }
  saveState();
  closeModal();

function saveEditPlayer(){
  const m = state.modal;
  if(!m.draft.name.trim()){ showAlert('Dê um nome ao jogador.'); return; }
  let p;
  if(m.source==='team'){ p = findTeam(m.a).players[m.b]; } else { p = state.freeAgents.find(x=>x.id===m.a); }
  const oldValue = p.value;
  p.name = m.draft.name.trim(); p.pos = m.draft.pos; p.ovr = Math.max(0,Math.min(MAX_OVR, m.draft.ovr));
  p.value = Math.max(0, Math.round(m.draft.value)||0);
  p.nationality = m.draft.nationality;
  if(oldValue!==p.value){
    const where = m.source==='team' ? findTeam(m.a).name : FREE_LABEL;
    logTransfer('valuechange', p, where, where, {oldValue});
  }
  saveState();
  closeModal();
}

  const m = state.modal;

    else { dp=state.freeAgents.find(x=>x.id===m.a); from=FREE_LABEL; state.freeAgents=state.freeAgents.filter(x=>x.id!==m.a); }
    if(dp) logTransfer('retire', dp, from, 'Aposentado');
    saveState();
  });
}

function roundName(numMatches){
  if(numMatches===1) return 'Final';
  if(numMatches===2) return 'Semifinal';
  if(numMatches===4) return 'Quartas de Final';
  if(numMatches===8) return 'Oitavas de Final';

  return numMatches*2+'ª de Final';
}

function sanitizeWCOptions(){
  const wc = state.worldCup;
  if(!wc) return;
  if(!wc.size || wc.size<4) wc.groupStage = false;
  const knockoutSize = wc.groupStage ? (wc.size?wc.size/2:0) : (wc.size||0);
  if(knockoutSize<4) wc.thirdPlace = false;

function startWorldCup(){
  const wc = state.worldCup;
  const size = wc.size;
  if(!size) return;
  let ids = [...wc.selected];
  if(ids.length !== size){
    showAlert(`Selecione exatamente ${size} time(s) para iniciar esta copa (você tem ${ids.length}).`);
    return;
  }
  for(let i=ids.length-1;i>0;i--){ const j=rnd(0,i); [ids[i],ids[j]]=[ids[j],ids[i]]; }

  const groupStage = !!wc.groupStage;
  const thirdPlace = !!wc.thirdPlace;

  if(groupStage){
    const groups = [];
    for(let i=0;i<ids.length;i+=4){
      const teamIds = ids.slice(i,i+4);
      groups.push({ id:'g'+groups.length, teamIds, matches: generateGroupMatches(teamIds) });
    }
    state.worldCup = { selected:ids, size, groupStage, thirdPlace, phase:'groups', groups, rounds:null, thirdPlaceMatch:null, champion:null };
  } else {
    const rounds = buildKnockoutRounds(ids);
    state.worldCup = { selected:ids, size, groupStage, thirdPlace, phase:'knockout', groups:null, rounds, thirdPlaceMatch:null, champion:null };
  }
  saveState();
  setView('worldcup');
}
function buildKnockoutRounds(flatIds){
  const rounds = [];
  let count = flatIds.length;
  let current = flatIds;
  while(count>=2){
    const matches = [];
    for(let i=0;i<count;i+=2){
      matches.push({
        a: current ? current[i] : null,
        b: current ? current[i+1] : null,
        scoreA:null, scoreB:null, played:false, winner:null
      });
    }
    rounds.push(matches);
    count = count/2;
    current = null;
  }
  return rounds;
}
function generateGroupMatches(teamIds){
  const matches = [];
  for(let i=0;i<teamIds.length;i++){
    for(let j=i+1;j<teamIds.length;j++){
      matches.push({ id:uid(), a:teamIds[i], b:teamIds[j], scoreA:null, scoreB:null, played:false });
    }
  }
  return matches;
}
function computeGroupStandings(group){
  const stats = {};
  group.teamIds.forEach(id=>{ stats[id] = {id, played:0, wins:0, draws:0, losses:0, gf:0, ga:0, pts:0}; });
  group.matches.forEach(m=>{
    if(!m.played) return;
    const sa=stats[m.a], sb=stats[m.b];
    sa.played++; sb.played++;
    sa.gf+=m.scoreA; sa.ga+=m.scoreB;
    sb.gf+=m.scoreB; sb.ga+=m.scoreA;
    if(m.scoreA>m.scoreB){ sa.wins++; sa.pts+=3; sb.losses++; }
    else if(m.scoreA<m.scoreB){ sb.wins++; sb.pts+=3; sa.losses++; }
    else { sa.draws++; sb.draws++; sa.pts++; sb.pts++; }
  });
  return Object.values(stats).sort((x,y)=> y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf);
}

function renderBracketTree(rounds, openFnName){
  openFnName = openFnName || 'openMatch';
  // No celular, colunas mais estreitas e caixas um pouco mais altas (toque mais fácil);
  // no tablet/PC, colunas mais largas aproveitando o espaço da tela.
  const isMobile = state.device==='mobile';
  const BASE_UNIT = isMobile?84:96, MATCH_H = isMobile?70:64, COL_W = isMobile?168:210, COL_GAP = isMobile?32:44;
  const positions = [];
  const n0 = rounds[0].length;
  positions[0] = rounds[0].map((_,i)=> i*BASE_UNIT + BASE_UNIT/2);
  for(let r=1;r<rounds.length;r++){
    positions[r] = rounds[r].map((_,i)=>{
      const c1 = positions[r-1][2*i], c2 = positions[r-1][2*i+1];
      return (c1+c2)/2;
    });
  }
  const totalHeight = n0*BASE_UNIT;
  const totalWidth = rounds.length*COL_W + (rounds.length-1)*COL_GAP;

  let labels='', boxes='', connectors='';
  rounds.forEach((round,ri)=>{
    const left = ri*(COL_W+COL_GAP);
    labels += `<div class="bracket-roundlabel" style="left:${left}px;width:${COL_W}px;">${roundName(round.length)}</div>`;
    round.forEach((m,mi)=>{
      boxes += matchBoxHTML(m, ri, mi, left, positions[ri][mi], COL_W, MATCH_H, openFnName);
    });
  });
  for(let r=0;r<rounds.length-1;r++){
    const colRight = r*(COL_W+COL_GAP)+COL_W;
    const midX = colRight + COL_GAP/2;
    const pairs = rounds[r].length/2;
    for(let p=0;p<pairs;p++){
      const y1 = positions[r][2*p], y2 = positions[r][2*p+1];
      const yTop = Math.min(y1,y2), yBot = Math.max(y1,y2);
      connectors += `<div class="conn-h" style="left:${colRight}px; top:${y1}px; width:${COL_GAP/2}px;"></div>`;
      connectors += `<div class="conn-h" style="left:${colRight}px; top:${y2}px; width:${COL_GAP/2}px;"></div>`;
      connectors += `<div class="conn-v" style="left:${midX}px; top:${yTop}px; height:${yBot-yTop}px;"></div>`;
      connectors += `<div class="conn-h" style="left:${midX}px; top:${(y1+y2)/2}px; width:${COL_GAP/2}px;"></div>`;
    }
  }
  return `<div class="bracket-scroll"><div class="bracket-canvas" style="width:${totalWidth}px;height:${totalHeight+20}px;">
    ${connectors}${boxes}${labels}
  </div></div>`;
}
function matchBoxHTML(m, ri, mi, left, y, colW, matchH, openFnName){
  const ta = m.a ? findTeam(m.a) : null;
  const tb = m.b ? findTeam(m.b) : null;
  const canPlay = ta && tb && !m.played;
  const rowTeam = (t, score, isWinner)=>{
    if(!t) return `<div class="row-team tbd">A definir</div>`;
    return `<div class="row-team ${isWinner?'winner':''}">
      <div class="crest-tiny" style="background:${t.color};">${crestLetters(t.name)}</div>
      <span class="rt-name">${t.name}</span>
      ${score!==null ? `<span class="sc">${score}</span>` : ''}
    </div>`;
  };
  const winnerA = m.played && m.winner===m.a;
  const winnerB = m.played && m.winner===m.b;
  return `<div class="bracket-match ${canPlay?'playable':''}" style="left:${left}px; top:${y}px; width:${colW}px; height:${matchH}px;" ${canPlay?`onclick="${openFnName}(${ri},${mi})"`:''}>
    ${rowTeam(ta, m.played?m.scoreA:null, winnerA)}
    ${rowTeam(tb, m.played?m.scoreB:null, winnerB)}
    ${canPlay?`<div class="play-hint">▶ Simular</div>`:''}
  </div>`;
}

/* ============================= MODO CARREIRA ============================= */
/* Cada jogador de carreira começa aos 17 e se aposenta aos 40. A cada temporada ele joga a liga do
   clube, pode ser convocado pra Copa do Mundo (a cada 4 temporadas), evolui (ou declina) com a idade,
   recebe propostas de transferência e disputa a Bola de Ouro. A temporada é resolvida na hora, em
   forma de resumo — não é partida a partida como nas competições normais do jogo. */
const MAX_CAREERS = 5;
const CAREER_RETIRE_AGE = 40;
function shuffleArr(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j=rnd(0,i); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function createCareerPlayer(name, nationality, pos, clubId, potential){
  const pot = Math.max(60, Math.min(MAX_OVR, Math.round(potential || rnd(65,99))));
  const ovr = Math.min(rnd(48,62), pot-5);
  return {
    id: uid(), name, nationality, pos, age:17, ovr,
    potential: pot,
    value: computePlayerValue(ovr), clubId, season:1, retired:false, trainingUsesLeft:2,
    stats:{goals:0, apps:0, ballonDor:0, leagueTitles:0, worldCups:0, trophies:[]},
    history:[], pendingOffer:null, lastSeasonSummary:null,
  };
}
function goalChancePerGame(cp){
  const posFactor = {ATA:0.55, PON:0.4, MEI:0.22, VOL:0.1, LAT:0.08, ZAG:0.04, GOL:0.01}[cp.pos] || 0.2;
  const ovrFactor = Math.max(0.3, Math.min(1.6, cp.ovr/80));
  return Math.min(0.85, posFactor*ovrFactor);
}
function simulateCareerLeagueSeason(cp, club){
  if(!club) return {text:`Temporada ${cp.season}: sem clube, nenhuma partida disputada.`, goals:0, apps:0, champion:false};
  const rivals = shuffleArr(state.teams.filter(t=>t.id!==club.id)).slice(0,7);
  const participants = [club, ...rivals];
  const ranked = participants.map(t=>{
    const strength = t.id===club.id ? teamStrength(t)*0.7 + cp.ovr*0.3 : teamStrength(t);
    return {t, score: strength + rnd(-8,8)};
  }).sort((a,b)=>b.score-a.score);
  const position = ranked.findIndex(r=>r.t.id===club.id) + 1;
  const champion = position===1;
  if(champion){ cp.stats.leagueTitles++; cp.stats.trophies.push(`Campeão da Liga (Temporada ${cp.season})`); }
  const matches = (participants.length-1)*2;
  const apps = Math.max(0, matches - rnd(0,3));
  const chance = goalChancePerGame(cp);
  let goals = 0;
  for(let i=0;i<apps;i++){ if(Math.random()<chance) goals += (Math.random()<0.15 ? 2 : 1); }
  cp.stats.goals += goals; cp.stats.apps += apps;
  return {
    text:`⚽ Temporada ${cp.season} pelo ${club.name}: ${position}º lugar na liga, ${apps} jogos e ${goals} gol(s).${champion?' 🏆 Campeão!':''}`,
    goals, apps, champion
  };
}
function simulateCareerWorldCup(cp){
  const winChance = Math.max(0.03, Math.min(0.4, (cp.ovr-70)/100));
  const champion = Math.random() < winChance;
  const goals = Math.round(rnd(0,6) * (cp.ovr/100));
  cp.stats.goals += goals;
  return {
    text:`🌍 Copa do Mundo (Temporada ${cp.season}): ${cp.name} marcou ${goals} gol(s) pela seleção.${champion?' 🏆 CAMPEÃO DO MUNDO!':''}`,
    champion, goals
  };
}
function applyAgeProgression(cp){
  let delta;
  if(cp.age < 23) delta = rnd(2,5);
  else if(cp.age < 27) delta = rnd(1,3);
  else if(cp.age <= 31) delta = rnd(-1,2);
  else if(cp.age <= 35) delta = rnd(-4,-1);
  else delta = rnd(-8,-3);
  // quanto mais longe do potencial escolhido, mais rápido o jogador evolui enquanto é jovem
  const gap = Math.max(0, cp.potential - cp.ovr);
  if(cp.age < 27) delta += Math.floor(gap/15);
  else if(cp.age <= 30 && delta>0) delta += Math.floor(gap/25);
  let next = cp.ovr + delta;
  if(delta>0 && cp.age<31) next = Math.min(next, cp.potential);
  cp.ovr = Math.max(30, Math.min(MAX_OVR, Math.round(next)));
}
function ballonDorChance(cp, seasonGoals, wonLeague){
  const score = cp.ovr + seasonGoals*1.5 + (wonLeague?10:0);
  return Math.max(0, Math.min(0.35, (score-90)/120));
}
function maybeGenerateTransferOffer(cp){
  if(Math.random() > 0.3) return null;
  const candidates = state.teams.filter(t=>t.id!==cp.clubId && teamStrength(t) >= cp.ovr-15);
  if(!candidates.length) return null;
  return {fromClubId:cp.clubId, toClubId:pick(candidates).id};
}
function trainCareerPlayer(careerId){
  const cp = state.careers.find(c=>c.id===careerId);
  if(!cp || cp.retired) return;
  if(cp.trainingUsesLeft<=0){ showAlert('Você já treinou o máximo nesta temporada.'); return; }
  const gain = cp.age<24 ? rnd(1,3) : cp.age<30 ? rnd(0,2) : rnd(0,1);
  const ceiling = cp.age>=31 ? cp.potential+10 : cp.potential;
  cp.ovr = Math.min(MAX_OVR, Math.min(ceiling, cp.ovr + gain));
  cp.trainingUsesLeft--;
  cp.value = computePlayerValue(cp.ovr);
  saveState();
  render();
}
function advanceCareerSeason(careerId){
  const cp = state.careers.find(c=>c.id===careerId);
  if(!cp || cp.retired) return;
  const club = findTeam(cp.clubId);
  const summary = [];
  const league = simulateCareerLeagueSeason(cp, club);
  summary.push(league.text);
  if(cp.season % 4 === 0 && cp.ovr >= 78){
    const wc = simulateCareerWorldCup(cp);
    summary.push(wc.text);
    if(wc.champion){ cp.stats.worldCups++; cp.stats.trophies.push(`Campeão do Mundo (Temporada ${cp.season})`); }
  }
  const histEntry = {season:cp.season, age:cp.age, club:club?club.name:'Sem clube', ovr:cp.ovr, goals:league.goals, apps:league.apps};
  applyAgeProgression(cp);
  if(Math.random() < ballonDorChance(cp, league.goals, league.champion)){
    cp.stats.ballonDor++;
    cp.stats.trophies.push(`Bola de Ouro (Temporada ${cp.season})`);
    summary.push(`🏅 ${cp.name} venceu a Bola de Ouro da temporada!`);
  }
  cp.pendingOffer = maybeGenerateTransferOffer(cp);
  if(cp.pendingOffer){
    const to = findTeam(cp.pendingOffer.toClubId);
    if(to) summary.push(`📩 Proposta de transferência do ${to.name}!`);
  }
  cp.history.push(histEntry);
  cp.age++; cp.season++; cp.trainingUsesLeft = 2;
  cp.value = computePlayerValue(cp.ovr);
  if(cp.age >= CAREER_RETIRE_AGE){
    cp.retired = true; cp.pendingOffer = null;
    summary.push('🎉 Fim de carreira! Hora da aposentadoria aos 40 anos.');
  }
  cp.lastSeasonSummary = summary;
  saveState();
  render();
}
function acceptCareerTransfer(careerId){
  const cp = state.careers.find(c=>c.id===careerId);
  if(!cp || !cp.pendingOffer) return;
  const from = findTeam(cp.pendingOffer.fromClubId), to = findTeam(cp.pendingOffer.toClubId);
  if(to){
    cp.clubId = to.id;
    logTransfer('signing', {id:cp.id, name:cp.name, pos:cp.pos, ovr:cp.ovr, value:cp.value, nationality:cp.nationality}, from?from.name:FREE_LABEL, to.name);
  }
  cp.pendingOffer = null;
  saveState();
  render();
}
function declineCareerTransfer(careerId){
  const cp = state.careers.find(c=>c.id===careerId);
  if(cp) cp.pendingOffer = null;
  saveState();
  render();
}
function requestRetireCareerPlayer(careerId){
  showConfirm('Tem certeza que quer aposentar esse jogador agora? Essa ação não pode ser desfeita.', ()=>{
    const cp = state.careers.find(c=>c.id===careerId);
    if(cp){ cp.retired = true; cp.pendingOffer = null; }
    saveState();
  });
}
function requestDeleteCareerPlayer(careerId){
  showConfirm('Excluir esse jogador de carreira? Todo o histórico dele será perdido.', ()=>{
    state.careers = state.careers.filter(c=>c.id!==careerId);
    saveState();
    setView('career');
  });
}

/* ============================= MOTOR DE PARTIDA (v2) ============================= */
/* Motor puro (sem DOM): avança minuto a minuto e devolve eventos. A interface só "assiste".
   - posse de bola, finalizações, chutes no alvo, escanteios, faltas, cartões (amarelo/vermelho),
     pênaltis na partida, lesões com substituição, gols anulados pelo VAR, acréscimos e xG;
   - notas por jogador, assistências e craque do jogo (MVP);
   - disputa de pênaltis alternada, com cobradores de verdade e morte súbita.
   As OVRs vão até 750, então todas as comparações usam uma escala comprimida (log) para
   que um time lendário seja MUITO favorito, mas sem fazer 40 gols num jogo. */
const MatchEngine = (function(){
  const R = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
  const P = arr=>arr[R(0,arr.length-1)];
  const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
  const comp = x => x<=100 ? Math.max(x,8) : 100 + 60*Math.log2(x/100);   // escala comprimida
  const avg = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;

  const POS_ATT = {ATA:6, PON:4, MEI:2.2, VOL:0.7, LAT:0.8, ZAG:0.35, GOL:0.02};
  const POS_AST = {MEI:4, PON:4, ATA:3, LAT:2.2, VOL:2, ZAG:0.5, GOL:0.02};
  const POS_FOUL = {ZAG:4, VOL:4, LAT:3, MEI:2, PON:1, ATA:1, GOL:0.3};

  const TXT = {
    off:   ['{p} arrisca de longe, mas a bola passa por cima do gol','{p} finaliza cruzado e manda para fora','{p} chuta de primeira — pela linha de fundo','{p} bate forte, a bola explode na trave... e sai!','{p} cabeceia sem direção','{p} tenta o drible, pega mal e a bola vai para fora'],
    save:  ['{g} espalma o chute de {p}!','Defesaça de {g} no chute de {p}!','{g} se estica todo e salva o time!','{p} bate colocado, {g} manda para escanteio','{g} faz a defesa mais difícil do jogo','{g} fecha o ângulo e pega firme'],
    corner:['Escanteio para o {t}','{t} ganha tiro de canto','Bola desviada, escanteio para o {t}'],
    foul:  ['{p} derruba o adversário — falta','Falta dura de {p}, o árbitro apita','{p} chega atrasado e comete falta','Falta perigosa cometida por {p}'],
    yellow:['🟨 Cartão amarelo para {p} ({t})','🟨 {p} reclama demais e é advertido ({t})','🟨 Entrada forte: amarelo para {p} ({t})'],
    red:   ['🟥 EXPULSO! {p} ({t}) toma o vermelho direto','🟥 {p} ({t}) vê o segundo amarelo e está fora!','🟥 Cartão vermelho! {p} ({t}) deixa o time com um a menos'],
    inj:   ['🩹 {p} ({t}) sente a coxa e é substituído','🩹 Lesão: {p} ({t}) pede para sair','🩹 {p} ({t}) fica caído e deixa o campo'],
    goal:  ['{p} balança as redes!','{p} não perdoa e abre o placar... de novo!','Que golaço de {p}!','{p} finaliza com categoria — GOOOL!','{p} cabeceia firme: é gol!','{p} sozinho na cara do gol, só empurrou!','{p} bate de fora da área e acerta o ângulo!','{p} aproveita o rebote e marca!'],
    pen:   ['⚠️ PÊNALTI para o {t}! O árbitro aponta a marca','⚠️ Falta na área! Pênalti para o {t}'],
    penOK: ['{p} bate firme no canto — GOL!','{p} cobra com frieza e converte!'],
    penNO: ['{g} defende a cobrança de {p}!','{p} bate na trave! Desperdiçou!','{p} chuta por cima do gol!'],
    var:   ['🖥️ VAR revisa o lance de {p}... GOL ANULADO por impedimento!','🖥️ O VAR chama o árbitro. Gol de {p} anulado!'],
  };
  const fill = (s, o)=> s.replace(/\{(\w+)\}/g, (_,k)=> o[k]!=null ? o[k] : '');

  function mkPlayerStats(team, side){
    const out = {};
    team.players.forEach((p,i)=>{
      if(!p) return;
      out[p.id] = {id:p.id, idx:i, side, name:p.name, pos:p.pos, ovr:p.ovr, goals:0, assists:0, saves:0, shots:0, yellow:0, red:0, injured:false, rating:6};
    });
    return out;
  }
  function groupAvg(team, poses, fallback){
    const v = team.players.filter(p=>p && poses.includes(p.pos)).map(p=>comp(p.ovr));
    return v.length ? avg(v) : fallback;
  }
  function teamRatings(team){
    const filled = team.players.filter(Boolean);
    const all = filled.length ? avg(filled.map(p=>comp(p.ovr))) : 35;
    const gks = filled.filter(p=>p.pos==='GOL').map(p=>comp(p.ovr));
    const gkBest = gks.length ? Math.max(...gks) : all*0.55;
    return {
      all,
      att: groupAvg(team, ['ATA','PON'], all*0.8)*0.7 + groupAvg(team, ['MEI'], all*0.8)*0.3,
      mid: groupAvg(team, ['MEI','VOL'], all*0.8),
      def: groupAvg(team, ['ZAG','LAT'], all*0.8)*0.75 + gkBest*0.25,
      gk: gkBest,
      fullness: Math.max(0.4, filled.length/11),   // time incompleto joga pior
    };
  }
  function pickWeighted(team, weights, exceptId, canSelect){
    const bag = []; const cand = [];
    team.players.forEach((p,i)=>{
      if(!p || p.id===exceptId) return;
      if(canSelect && !canSelect(p)) return;
      const w = (weights[p.pos]!=null?weights[p.pos]:1) * (0.6 + Math.min(comp(p.ovr),200)/120);
      cand.push([p,i,w]);
    });
    if(!cand.length) return null;
    let tot = cand.reduce((a,c)=>a+c[2],0), r = Math.random()*tot;
    for(const c of cand){ r -= c[2]; if(r<=0) return {p:c[0], idx:c[1]}; }
    const l = cand[cand.length-1]; return {p:l[0], idx:l[1]};
  }

  function create(teamA, teamB){
    const base = {A:teamRatings(teamA), B:teamRatings(teamB)};
    const sim = {
      teams:{A:teamA, B:teamB}, base, minute:0, stoppage:R(1,5), htDone:false, phase:'play', // play | done
      score:{A:0,B:0},
      mod:{A:1,B:1},            // multiplicador de força (vermelhos, lesões)
      reds:{A:0,B:0}, subs:{A:0,B:0},
      possTicks:{A:0,B:0}, poss:{A:50,B:50},
      stats:{A:{shots:0,sot:0,corners:0,fouls:0,yellow:0,red:0,saves:0,xg:0,vard:0}, B:{shots:0,sot:0,corners:0,fouls:0,yellow:0,red:0,saves:0,xg:0,vard:0}},
      pstats:{A:mkPlayerStats(teamA,'A'), B:mkPlayerStats(teamB,'B')},
      scorers:{A:[], B:[]},
      events:[], lastGoalSide:null, maxLead:{A:0,B:0},
      momentum:0,               // -1 (B) .. +1 (A), só para a barra visual
      control:null, pending:null, tac:{A:'eq',B:'eq'},   // modo jogável
    };
    return sim;
  }
  const clockLabel = s => s.minute<=90 ? String(s.minute) : '90+'+(s.minute-90);
  function totalMinutes(s){ return 90 + s.stoppage; }
  function ev(s, o){ const e = Object.assign({min:s.minute, label:clockLabel(s)}, o); s.events.push(e); return e; }
  function playerStatsOf(s, side, p){ return s.pstats[side][p.id]; }

  function eff(s, side, key){
    const b = s.base[side];
    const t = s.tac ? s.tac[side] : 'eq';
    const tm = key==='att' ? (t==='of'?1.12:t==='de'?0.9:1) : key==='def' ? (t==='of'?0.9:t==='de'?1.12:1) : 1;
    return b[key]*s.mod[side]*tm*(0.55+0.45*b.fullness);
  }

  function goalScored(s, side, scorer, opts){
    opts = opts||{};
    const other = side==='A'?'B':'A';
    const team = s.teams[side];
    const ps = playerStatsOf(s, side, scorer.p);
    // VAR
    if(!opts.penalty && Math.random()<0.055){
      s.stats[side].vard++;
      return [ev(s,{kind:'var', side, text:fill(P(TXT.var),{p:scorer.p.name})})];
    }
    s.score[side]++;
    ps.goals++;
    const out = [];
    // assistência (não em pênalti)
    let assist = null;
    if(!opts.penalty && Math.random()<0.72){
      const a = pickWeighted(team, POS_AST, scorer.p.id, p=>!(playerStatsOf(s,side,p)||{}).red);
      if(a){ assist = a; playerStatsOf(s, side, a.p).assists++; }
    }
    let entry = s.scorers[side].find(e=>e.playerId===scorer.p.id);
    if(!entry){ entry = {playerId:scorer.p.id, name:scorer.p.name, minutes:[]}; s.scorers[side].push(entry); }
    entry.minutes.push(s.minute<=90?String(s.minute):'90+'+(s.minute-90));
    s.maxLead[side] = Math.max(s.maxLead[side], s.score[side]-s.score[other]);
    s.lastGoalSide = side;
    const txt = opts.penalty ? fill(P(TXT.penOK),{p:scorer.p.name}) : fill(P(TXT.goal),{p:scorer.p.name});
    out.push(ev(s,{kind:'goal', goal:true, side, slot:scorer.idx, player:scorer.p.name, assist:assist?assist.p.name:null,
      text:`${txt} (${team.name})${assist?` — assistência de ${assist.p.name}`:''}`, scoreA:s.score.A, scoreB:s.score.B}));
    return out;
  }

  function attack(s, side){
    const other = side==='A'?'B':'A';
    const team = s.teams[side], oteam = s.teams[other];
    const out = [];
    const att = eff(s, side, 'att'), def = eff(s, other, 'def');
    const r = clamp(att/Math.max(def,10), 0.35, 2.2);
    const roll = Math.random();
    const shooter = pickWeighted(team, POS_ATT, null, p=>!(playerStatsOf(s,side,p)||{}).red);
    if(!shooter) return out;
    const gkSlot = oteam.players.findIndex(p=>p && p.pos==='GOL' && !(playerStatsOf(s,other,p)||{}).red);
    const gk = gkSlot>=0 ? oteam.players[gkSlot] : null;
    const gkName = gk ? gk.name : 'O goleiro';

    if(roll < 0.57){
      // finalização
      const st = s.stats[side];
      st.shots++; playerStatsOf(s, side, shooter.p).shots++;
      const q = clamp(0.07*Math.pow(r,0.8), 0.02, 0.4);        // qualidade da chance (xG)
      st.xg += q;
      const sotP = clamp(0.40 + (r-1)*0.07, 0.22, 0.68);
      if(Math.random() < sotP){
        st.sot++;
        const gkF = clamp(Math.pow(60/Math.max(eff(s, other, 'gk'),12), 0.45), 0.55, 1.5);
        const gP = clamp(0.285*Math.pow(r,0.85)*gkF, 0.05, 0.62);
        if(Math.random() < gP){
          out.push(...goalScored(s, side, shooter));
        } else {
          s.stats[other].saves++;
          if(gk){ const g = playerStatsOf(s, other, gk); if(g) g.saves++; }
          out.push(ev(s,{kind:'save', side:other, text:fill(P(TXT.save),{p:shooter.p.name, g:gkName})}));
          if(Math.random()<0.28){ s.stats[side].corners++; }
        }
      } else if(Math.random()<0.5){
        out.push(ev(s,{kind:'miss', side, text:fill(P(TXT.off),{p:shooter.p.name})}));
      }
    } else if(roll < 0.72){
      s.stats[side].corners++;
      if(Math.random()<0.5) out.push(ev(s,{kind:'corner', side, text:fill(P(TXT.corner),{t:team.name})}));
      if(Math.random()<0.07*Math.pow(r,0.7)){
        const sc = pickWeighted(team, {ZAG:3,ATA:3,PON:1.5,MEI:1.5,VOL:1,LAT:0.6,GOL:0.01}, null, p=>!(playerStatsOf(s,side,p)||{}).red);
        if(sc){ s.stats[side].shots++; s.stats[side].sot++; s.stats[side].xg+=0.08; out.push(...goalScored(s, side, sc)); }
      }
    } else if(roll < 0.87){
      // falta sofrida pelo atacante: defensor pode levar cartão; chance de pênalti
      foul(s, other, out, Math.random()<0.055 ? side : null);
    }
    return out;
  }

  function foul(s, side, out, penaltyFor){
    const team = s.teams[side];
    const fouler = pickWeighted(team, POS_FOUL, null, p=>!(playerStatsOf(s,side,p)||{}).red);
    if(!fouler) return;
    const ps = playerStatsOf(s, side, fouler.p);
    s.stats[side].fouls++;
    const direct = Math.random() < 0.012;
    const yellow = Math.random() < 0.20;
    if(direct || yellow){
      if(direct || ps.yellow>=1){
        ps.red++; if(!direct) ps.yellow = 2;
        s.stats[side].red++; s.reds[side]++;
        s.mod[side] *= 0.82;
        out.push(ev(s,{kind:'red', side, slot:fouler.idx, text:fill(P(TXT.red),{p:fouler.p.name,t:team.name})}));
      } else {
        ps.yellow++; s.stats[side].yellow++;
        out.push(ev(s,{kind:'yellow', side, slot:fouler.idx, text:fill(P(TXT.yellow),{p:fouler.p.name,t:team.name})}));
      }
    } else if(Math.random()<0.45){
      out.push(ev(s,{kind:'foul', side, text:fill(P(TXT.foul),{p:fouler.p.name})}));
    }
    if(penaltyFor){
      const o = penaltyFor;
      const oteam = s.teams[o];
      out.push(ev(s,{kind:'pen', side:o, text:fill(P(TXT.pen),{t:oteam.name})}));
      const taker = pickWeighted(oteam, {ATA:5,PON:3,MEI:3,VOL:1,LAT:0.6,ZAG:0.4,GOL:0.01}, null, p=>!(playerStatsOf(s,o,p)||{}).red);
      if(taker){
        const rr = clamp(eff(s,o,'att')/Math.max(eff(s,side,'gk'),10),0.4,3);
        s.stats[o].shots++; s.stats[o].xg += 0.76;
        const gk = team.players.find(p=>p && p.pos==='GOL');
        if(Math.random() < clamp(0.74 + (rr-1)*0.05, 0.55, 0.9)){
          s.stats[o].sot++;
          out.push(...goalScored(s, o, taker, {penalty:true}));
        } else {
          if(gk){ const g = playerStatsOf(s, side, gk); if(g && Math.random()<0.6){ g.saves++; s.stats[side].saves++; } }
          out.push(ev(s,{kind:'miss', side:o, text:fill(P(TXT.penNO),{p:taker.p.name, g:gk?gk.name:'O goleiro'})}));
        }
      }
    }
  }

  /* Avança 1 minuto. Retorna os eventos novos (para a interface tocar sons/animações). */
  function step(s){
    if(s.phase==='done') return [];
    if(s.minute>=totalMinutes(s)){ s.phase='done'; finalizeRatings(s); return []; }
    const before = s.events.length;
    s.minute++;
    const out = [];
    // posse de bola (meio-campo + inércia)
    const mA = eff(s,'A','mid'), mB = eff(s,'B','mid');
    let pA = clamp(mA/(mA+mB), 0.2, 0.8);
    pA = pA*0.7 + (s.poss.A/100)*0.3;                      // suaviza
    const hasA = Math.random() < pA;
    s.possTicks[hasA?'A':'B']++;
    s.poss.A = Math.round(100*s.possTicks.A/(s.possTicks.A+s.possTicks.B));
    s.poss.B = 100 - s.poss.A;
    s.momentum = clamp(s.momentum*0.8 + (hasA?0.2:-0.2), -1, 1);

    // ataque: quem tem a bola ataca com mais frequência, mas ataque × defesa decide quem cria perigo
    const aTot = eff(s,'A','att')*(0.6+pA), bTot = eff(s,'B','att')*(0.6+(1-pA));
    const pAttack = 0.42;
    if(Math.random() < pAttack){
      const sideAtk = Math.random() < aTot/(aTot+bTot) ? 'A' : 'B';
      if(s.control===sideAtk && Math.random()<0.6){ s.pending={stage:1, side:sideAtk}; out.push(ev(s,{kind:'play', side:sideAtk, text:`🎮 ${s.teams[sideAtk].name} avança com a bola! O que fazer?`})); }
      else out.push(...attack(s, sideAtk));
    } else if(Math.random() < 0.10){
      foul(s, Math.random()<0.5?'A':'B', out, null);
    }
    // lesão
    ['A','B'].forEach(side=>{
      if(s.subs[side]<3 && Math.random()<0.0016){
        const pl = pickWeighted(s.teams[side], {ATA:1,PON:1,MEI:1,VOL:1,LAT:1,ZAG:1,GOL:0.1}, null, p=>{ const st=playerStatsOf(s,side,p); return st && !st.red && !st.injured; });
        if(pl){
          const st = playerStatsOf(s, side, pl.p); st.injured = true; s.subs[side]++;
          s.mod[side] *= 0.975;
          out.push(ev(s,{kind:'inj', side, slot:pl.idx, text:fill(P(TXT.inj),{p:pl.p.name,t:s.teams[side].name})}));
        }
      }
    });
    // intervalo
    if(s.minute===45 && !s.htDone){
      s.htDone = true;
      out.push(ev(s,{kind:'info', text:`Fim do primeiro tempo — ${s.teams.A.name} ${s.score.A} x ${s.score.B} ${s.teams.B.name}.`}));
    }
    if(s.minute===90){
      out.push(ev(s,{kind:'info', text:`O árbitro indica ${s.stoppage} minuto${s.stoppage>1?'s':''} de acréscimo.`}));
    }
    if(s.minute>=totalMinutes(s) && !s.pending){
      s.phase='done';
      finalizeRatings(s);
    }
    return s.events.slice(before);
  }

  function finalizeRatings(s){
    const res = s.score.A===s.score.B ? 0 : (s.score.A>s.score.B ? 1 : -1);
    ['A','B'].forEach(side=>{
      const other = side==='A'?'B':'A';
      const won = (side==='A' ? res===1 : res===-1);
      const conceded = s.score[other];
      Object.values(s.pstats[side]).forEach(p=>{
        let r = 6.0 + p.goals*1.3 + p.assists*0.8 + p.saves*0.28 + p.shots*0.04;
        if(['GOL','ZAG','LAT'].includes(p.pos)){ r += (conceded===0 ? 0.7 : 0) - conceded*0.22; }
        r += won ? 0.4 : 0;
        r -= p.yellow*0.35 + p.red*2.0;
        r += (Math.random()-0.5)*0.7;
        p.rating = clamp(r, 3, 10);
      });
    });
    const all = [...Object.values(s.pstats.A), ...Object.values(s.pstats.B)];
    all.sort((a,b)=>b.rating-a.rating);
    s.mvp = all[0] || null;
  }

  /* ---------- disputa de pênaltis ---------- */
  function createShootout(s){
    const order = side=>{
      const pl = s.teams[side].players.map((p,i)=>p&&!(s.pstats[side][p.id]||{}).red?{p,i}:null).filter(Boolean);
      const out = pl.filter(x=>x.p.pos!=='GOL').sort((a,b)=>b.p.ovr-a.p.ovr);
      const gk = pl.filter(x=>x.p.pos==='GOL');
      return out.concat(gk);
    };
    return {kicks:{A:[],B:[]}, order:{A:order('A'),B:order('B')}, next:'A', over:false, winner:null, round:0};
  }
  function shootoutDecided(so){
    const a = so.kicks.A, b = so.kicks.B;
    const sa = a.filter(k=>k.goal).length, sb = b.filter(k=>k.goal).length;
    if(a.length<=5 && b.length<=5){
      const remA = 5-a.length, remB = 5-b.length;
      if(sa>sb+remB) return 'A';
      if(sb>sa+remA) return 'B';
      return null;
    }
    if(a.length===b.length && a.length>=5 && sa!==sb) return sa>sb?'A':'B';
    return null;
  }
  function shootoutKick(s, so, forced){
    const side = so.next, other = side==='A'?'B':'A';
    const idx = so.kicks[side].length;
    const ord = so.order[side];
    const taker = ord.length ? ord[idx % ord.length] : null;
    const gkRec = s.teams[other].players.find(p=>p&&p.pos==='GOL');
    const rr = clamp(comp(taker?taker.p.ovr:40)/Math.max(s.base[other].gk,12), 0.4, 3);
    const goal = (forced===undefined||forced===null) ? Math.random() < clamp(0.74 + (rr-1)*0.06, 0.5, 0.92) : !!forced;
    const k = {goal, name:taker?taker.p.name:'Cobrador', gk:gkRec?gkRec.name:'O goleiro'};
    so.kicks[side].push(k);
    const d = shootoutDecided(so);
    if(d){ so.over = true; so.winner = d; }
    so.next = other;
    const sa = so.kicks.A.filter(x=>x.goal).length, sb = so.kicks.B.filter(x=>x.goal).length;
    return {side, kick:k, text: k.goal ? `⚽ ${k.name} (${s.teams[side].name}) converte! ${sa} x ${sb}` : `❌ ${P([`${k.gk} defende a cobrança de ${k.name}!`,`${k.name} chuta para fora!`,`${k.name} acerta a trave!`])} (${s.teams[side].name}) ${sa} x ${sb}`, sa, sb};
  }

  function userShot(s, side, o){
    const other = side==='A'?'B':'A', team = s.teams[side], oteam = s.teams[other], out = [];
    const shooter = pickWeighted(team, POS_ATT, null, p=>!(playerStatsOf(s,side,p)||{}).red);
    if(!shooter) return out;
    const gk = oteam.players.find(p=>p && p.pos==='GOL' && !(playerStatsOf(s,other,p)||{}).red);
    s.stats[side].shots++; playerStatsOf(s,side,shooter.p).shots++; s.stats[side].xg += o.q;
    if(Math.random() < o.sotP){
      s.stats[side].sot++;
      if(Math.random() < clamp(o.gP*1.12,0.04,0.88)) out.push(...goalScored(s, side, shooter));
      else {
        s.stats[other].saves++; if(gk){ const g = playerStatsOf(s,other,gk); if(g) g.saves++; }
        out.push(ev(s,{kind:'save', side:other, text:fill(P(TXT.save),{p:shooter.p.name, g:gk?gk.name:'O goleiro'})}));
      }
    } else out.push(ev(s,{kind:'miss', side, text:fill(P(TXT.off),{p:shooter.p.name})}));
    return out;
  }
  function resolveChoice(s, choice){
    const p = s.pending; if(!p) return [];
    const side = p.side, other = side==='A'?'B':'A', out = [];
    const r = clamp(eff(s,side,'att')/Math.max(eff(s,other,'def'),10), 0.35, 2.2);
    const gkF = clamp(Math.pow(60/Math.max(eff(s,other,'gk'),12),0.45), 0.55, 1.5);
    if(p.stage===1){
      if(choice==='long'){ s.pending=null; out.push(...userShot(s,side,{sotP:.34,gP:.17*Math.pow(r,.85)*gkF,q:.04})); }
      else if(choice==='cross'){ s.pending=null; out.push(...userShot(s,side,{sotP:.5,gP:.25*Math.pow(r,.85)*gkF,q:.07})); }
      else {
        const through = choice==='through';
        const ok = Math.random() < (through ? clamp(.5*Math.pow(r,.7),.18,.85) : clamp(.42*Math.pow(r,.6),.15,.75));
        if(ok){ s.pending={stage:2, side}; out.push(ev(s,{kind:'play', side, text: through?'🎯 Passe açucarado! Você está na cara do gol — finalize!':'🤸 Drible desconcertante! De frente pro goleiro!'})); }
        else {
          s.pending=null;
          out.push(ev(s,{kind:'miss', side, text: through?'Passe interceptado pela zaga.':'O zagueiro desarma na hora certa.'}));
          if(Math.random()<0.3) foul(s, other, out, Math.random()<0.1?side:null);
        }
      }
    } else {
      s.pending=null;
      if(choice==='corner') out.push(...userShot(s,side,{sotP:.82,gP:.5*Math.pow(r,.7)*gkF,q:.3}));
      else if(choice==='chip') out.push(...userShot(s,side,{sotP:.7,gP:.46*Math.pow(r,.7),q:.3}));
      else if(Math.random()<.78) out.push(...userShot(s,side,{sotP:.95,gP:.66*Math.pow(r,.6)*Math.sqrt(gkF),q:.4}));
      else out.push(ev(s,{kind:'miss', side, text:'O passe para o companheiro sai forte demais — a defesa afasta.'}));
    }
    return out;
  }
  function setTactic(s, side, t){ s.tac[side]=t; }
  return {finish:finalizeRatings, resolveChoice, setTactic, create, step, totalMinutes, clockLabel, createShootout, shootoutKick, comp, teamRatings};
})();

function matchLabel(src){

function playPanelKey(c){ const s=c.sim; return c.finished?'x':(s.pending?('p'+s.pending.stage+s.pending.side):(c.pk?'k'+c.pk.mode:(c.control?'t'+c.tacPick:'n'))); }

  }
  if(c.matchTab==='ratings'){
    const rows = side=>Object.values(s.pstats[side]).sort((a,b)=>b.rating-a.rating).map(p=>`<div class="rate-row"><span>${p.pos} · ${escHtml(p.name)} ${p.goals?'⚽'.repeat(Math.min(p.goals,5)):''}${p.assists?'🅰️'.repeat(Math.min(p.assists,3)):''}${p.yellow&&!p.red?'🟨':''}${p.red?'🟥':''}</span><b class="r">${p.rating.toFixed(1)}</b></div>`).join('');
    return `<div class="panel"><h4 class="settings-panel-title">${escHtml(c.teamA.name)}</h4>${rows('A')}</div><div class="panel"><h4 class="settings-panel-title">${escHtml(c.teamB.name)}</h4>${rows('B')}</div>`;
  }
  return `<div class="ticker" id="tickerEl">${renderTickerEvents(c)}</div>`;
}
function renderTickerEvents(c){
  const ICON = {goal:'⚽ ',miss:'💨 ',save:'🧤 ',corner:'🚩 ',foul:'✋ ',pen:'', var:'', info:'⏱️ ', yellow:'', red:'', inj:''};
  return c.events.slice(-90).reverse().map(e=>`<div class="ev ${e.kind||''} ${e.goal?'goal':''}">${e.label||e.min}' — ${ICON[e.kind]||''}${e.goal?'<b>GOL!</b> ':''}${escHtml(e.text)}</div>`).join('');
}
function scorerLineHTML(entry){ return `<div class="scorer-line"><b>${escHtml(entry.name)}</b> ${entry.minutes.map(m=>m+'’').join(' ')}</div>`; }
function penDotsHTML(so, side){
  const arr = so.kicks[side]; const n = Math.max(5, arr.length);
  let h=''; for(let i=0;i<n;i++){ const k = arr[i]; h += `<i class="${k?(k.goal?'ok':'no'):''}"></i>`; }
  return `<div class="pen-dots">${h}</div>`;
}
function matchFinishPanelHTML(c){
  const s = c.sim, m = s.mvp;
  let mvpCard = '';
  if(m){ const team = m.side==='A'?c.teamA:c.teamB; const pl = team.players.find(p=>p&&p.id===m.id); if(pl) mvpCard = `<div class="mvp-box"><div style="width:150px">${playerCardHTML(pl)}</div><div><div class="hint">⭐ CRAQUE DO JOGO</div><h3 style="margin:4px 0;">${escHtml(m.name)}</h3><div class="hint">Nota <b style="color:var(--gold)">${m.rating.toFixed(1)}</b> · ${m.goals} gol(s) · ${m.assists} assist.</div></div></div>`; }
  const r = computeMatchReward(c);
  const won = c.played && ((c.scoreA!==c.scoreB ? (c.scoreA>c.scoreB?'A':'B') : (c.penA>c.penB?'A':'B'))===c.control);
  const res = c.played ? `<h3 style="margin:0 0 8px;color:${won?'var(--emerald)':'var(--red)'}">${won?'🏆 Você venceu!':'Você perdeu...'}</h3>` : '';
  return `<div class="panel" style="margin-top:14px;"><h4 class="settings-panel-title">Resumo da partida</h4>${res}${mvpCard}<p class="hint" style="margin-top:10px;">Recompensa ao confirmar: <b style="color:var(--gold)">+${r} 🪙</b></p></div>`;
}
function matchView(){

  const pitchB = slotsB.map((sl,i)=>matchSlotHTML(c.teamB.players[i], sl,'B',i)).join('');

  <div class="speed-row">
    <span class="hint">Velocidade:</span>

    ${c.finished?'':`<button class="ctl-btn" onclick="toggleMatchPause()">${c.paused?'▶ Continuar':'⏸ Pausar'}</button><button class="ctl-btn" onclick="skipMatch()">⏭ Pular</button>`}
  </div>
  <div class="pitch match-pitch2" id="pitchEl">

    <div class="goal-banner" id="goalBanner"></div>${pitchB}${pitchA}
  </div>

  <div id="penPanel">${c.so?penPanelHTML(c):''}</div>
  <div class="tabs-mini">${tabs.map(([k,l])=>`<button class="${c.matchTab===k?'active':''}" onclick="state.matchCtx.matchTab='${k}';render();">${l}</button>`).join('')}</div>
  <div id="matchTabBody">${matchTabBodyHTML(c)}</div>
  <div id="matchFinish">${c.finished?matchFinishPanelHTML(c):''}</div>
  <div class="btn-row" id="matchBtnRow" style="margin-top:14px;justify-content:center;">
    ${c.finished ? `<button class="btn gold" onclick="finishMatch()">Confirmar resultado e voltar</button>` : `<span class="hint">Simulando... (Espaço pausa · S pula)</span>`}
  </div>`;
}
function penPanelHTML(c){
  const so = c.so;
  return `<div class="panel" style="margin:12px 0;"><h4 class="settings-panel-title">Disputa de pênaltis</h4>
    <div style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><div><div class="hint">${escHtml(c.teamA.name)}</div>${penDotsHTML(so,'A')}</div><div><div class="hint">${escHtml(c.teamB.name)}</div>${penDotsHTML(so,'B')}</div></div></div>`;
}
function startMatchTimer(c){
  if(c.timerId) clearInterval(c.timerId);
  c.timerId = setInterval(()=>matchTick(c), (c.phase==='pens'?650:110)/c.speed);
}
function changeSpeed(spd){ const c = state.matchCtx; if(!c) return; c.speed = spd; if(!c.finished && !c.paused) startMatchTimer(c); render(); }
function toggleMatchPause(){
  const c = state.matchCtx; if(!c||c.finished||c.phase==='prematch') return;
  c.paused = !c.paused;
  if(c.paused){ clearInterval(c.timerId); } else startMatchTimer(c);
  render();
}
function syncCtx(c){ c.scoreA = c.sim.score.A; c.scoreB = c.sim.score.B; c.minute = c.sim.minute; }
function handleSimEvents(c, evs){
  evs.forEach(e=>{
    if(e.goal){
      SFX.play('goal'); c.freeze = 7;
      flashGoalPlayer(e.side, e.slot, (e.side==='A'?c.teamA:c.teamB).name, e.player);
    } else if(e.kind==='yellow'||e.kind==='red'){ SFX.play('card'); }
    else if(e.kind==='save'||e.kind==='miss'){ SFX.play('near'); }
    else if(e.kind==='pen'){ c.freeze = 4; SFX.play('whistle'); }
    else if(e.kind==='info'){ SFX.play('whistle'); }
    if(e.slot!==undefined && e.slot!==null && (e.kind==='yellow'||e.kind==='red'||e.kind==='inj')){
      const el = document.getElementById(`ms-${e.side}-${e.slot}`);
      if(el) el.classList.add(e.kind==='red'?'sent':(e.kind==='inj'?'inj':'carded'));
    }
  });
}
function updateMatchUI(c){
  const q = id=>document.getElementById(id), s = c.sim;
  const ck = q('clockDisplay'); if(ck) ck.textContent = c.phase==='pens' ? 'PÊNALTIS' : MatchEngine.clockLabel(s)+"'";
  const sb = document.querySelector('.score-big'); if(sb) sb.textContent = `${c.scoreA} - ${c.scoreB}`;
  const pa=q('possA'); if(pa){ pa.textContent=s.poss.A+'%'; q('possB').textContent=s.poss.B+'%'; q('possBarA').style.width=s.poss.A+'%'; q('possBarB').style.width=s.poss.B+'%'; }
  const body = q('matchTabBody'); if(body) body.innerHTML = matchTabBodyHTML(c);
  const pp = q('penPanel'); if(pp) pp.innerHTML = c.so ? penPanelHTML(c) : '';
  const key = playPanelKey(c);
  if(c._ppKey!==key){ c._ppKey=key; const pl=q('playPanel'); if(pl) pl.innerHTML=playPanelHTML(c); }
}
function matchTick(c){
  if(state.matchCtx!==c){ clearInterval(c.timerId); return; }
  if(c.phase==='prematch' || c.phase==='arcade' || c.sim.pending || c.pk) return;
  if(c.freeze>0){ c.freeze--; return; }
  if(c.phase==='play'){
    const evs = MatchEngine.step(c.sim);
    syncCtx(c); handleSimEvents(c, evs); updateMatchUI(c);
    if(c.sim.phase==='done') endRegularTime(c);
  } else if(c.phase==='pens'){
    if(c.sim.control){ c.pk = {mode: c.so.next===c.sim.control ? 'kick' : 'dive'}; updateMatchUI(c); return; }
    penTick(c);
  }
}
function endRegularTime(c){
  clearInterval(c.timerId);
  c.sim.events.push({min:90,label:'90',kind:'info',text:'Apito final!'});
  SFX.play('whistle');
  if(c.scoreA===c.scoreB){
    c.sim.events.push({min:90,label:'90',kind:'pen',text:'Empate! Vai para os pênaltis.'});
    c.phase='pens'; c.so = MatchEngine.createShootout(c.sim);
    updateMatchUI(c);
    c.timerId = setTimeout(()=>{ if(state.matchCtx===c){ startMatchTimer(c); } }, 900/c.speed);
  } else { concludeMatch(c); }
}
function penTick(c, forced){
  const so = c.so, r = MatchEngine.shootoutKick(c.sim, so, forced);
  c.sim.events.push({min:'PEN',label:'PEN',kind:r.kick.goal?'goal':'miss',goal:false,text:r.text});
  SFX.play(r.kick.goal?'coin':'near');
  updateMatchUI(c);
  if(so.over){
    clearInterval(c.timerId);
    c.penA = so.kicks.A.filter(k=>k.goal).length; c.penB = so.kicks.B.filter(k=>k.goal).length;
    c.sim.events.push({min:'PEN',label:'PEN',kind:'info',text:`Fim dos pênaltis: ${c.penA} x ${c.penB}.`});
    concludeMatch(c);
  }
}
function concludeMatch(c){
  clearInterval(c.timerId);
  c.finished = true; c.phase='done';
  syncCtx(c); render();
  SFX.play('whistle');
}
function skipMatch(){
  const c = state.matchCtx; if(!c||c.finished||c.phase==='prematch') return;
  clearInterval(c.timerId);
  c.freeze = 0; c.sim.control = null; c.sim.pending = null; c.pk = null;
  while(c.sim.phase!=='done') MatchEngine.step(c.sim);
  syncCtx(c);
  c.sim.events.push({min:90,label:'90',kind:'info',text:'Apito final!'});
  if(c.scoreA===c.scoreB){
    c.so = MatchEngine.createShootout(c.sim);
    while(!c.so.over){ const r = MatchEngine.shootoutKick(c.sim, c.so); c.sim.events.push({min:'PEN',label:'PEN',kind:r.kick.goal?'goal':'miss',text:r.text}); }
    c.penA = c.so.kicks.A.filter(k=>k.goal).length; c.penB = c.so.kicks.B.filter(k=>k.goal).length;
  }
  concludeMatch(c);
}
function flashGoalPlayer(side, slotIdx, teamName, playerName){
  if(slotIdx!==null && slotIdx!==undefined){
    const el = document.getElementById(`ms-${side}-${slotIdx}`);
    if(el){ el.classList.add('scored'); setTimeout(()=>el.classList.remove('scored'), 1000); }
  }
  const banner = document.getElementById('goalBanner');
  if(banner){ banner.textContent = `⚽ GOL! ${playerName} (${teamName})`; banner.classList.add('show'); setTimeout(()=>banner.classList.remove('show'), 1300); }
}

function finishMatch(){
  const c = state.matchCtx;
  if(!c || !c.finished) return;
  const src = c.source;
  let winnerId;
  if(c.scoreA!==c.scoreB) winnerId = c.scoreA>c.scoreB ? c.teamA.id : c.teamB.id;
  else winnerId = (c.penA>c.penB) ? c.teamA.id : c.teamB.id;
  onMatchConfirmed(c, winnerId);

  // amistoso (não afeta nenhuma copa, é só um jogo avulso entre dois times)
  if(src.friendly){
    if(!state.friendly) state.friendly = {teamA:null, teamB:null};
    state.friendly.lastResult = {
      teamA: c.teamA.id, teamB: c.teamB.id,
      scoreA: c.scoreA, scoreB: c.scoreB,
      draw: c.scoreA===c.scoreB,
      penA: c.penA, penB: c.penB,
    };
    state.matchCtx = null;
    setView('friendly');
    return;
  }

  // partida de pontos corridos da liga
  if(src.leagueMatchId){
    const lg = state.league;
    const m = lg.matches.find(x=>x.id===src.leagueMatchId);
    m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true;
    state.matchCtx = null;
    saveState();
    setView('league');
    return;
  }

  // mata-mata da liga
  if(src.leagueRoundIdx !== undefined){
    const lg = state.league;
    const m = lg.knockoutRounds[src.leagueRoundIdx][src.leagueMatchIdx];
    m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true; m.winner = winnerId;
    if(src.leagueRoundIdx === lg.knockoutRounds.length-1){
      lg.champion = winnerId; onTitle('league', winnerId);
      lg.phase = 'done';
    } else {
      const nextRound = lg.knockoutRounds[src.leagueRoundIdx+1];
      const pairIdx = Math.floor(src.leagueMatchIdx/2);
      const slot = src.leagueMatchIdx%2===0 ? 'a' : 'b';
      nextRound[pairIdx][slot] = winnerId;
    }
    state.matchCtx = null;
    saveState();
    setView('league');
    return;
  }

  const wc = state.worldCup;

  // partida da fase de grupos
  if(src.groupId){
    const g = wc.groups.find(x=>x.id===src.groupId);
    const m = g.matches.find(x=>x.id===src.matchId);
    m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true;
    state.matchCtx = null;
    saveState();
    setView('worldcup');
    return;
  }

  // disputa de 3º lugar
  if(src.thirdPlace){
    const m = wc.thirdPlaceMatch;
    m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true; m.winner = winnerId;
    state.matchCtx = null;
    saveState();
    setView('worldcup');
    return;
  }

  // chaveamento normal (mata-mata)
  const m = wc.rounds[src.roundIdx][src.matchIdx];
  m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true; m.winner = winnerId;

  if(src.roundIdx === wc.rounds.length-1){
    wc.champion = winnerId; onTitle('wc', winnerId);
  } else {
    const nextRound = wc.rounds[src.roundIdx+1];
    const pairIdx = Math.floor(src.matchIdx/2);
    const slot = src.matchIdx%2===0 ? 'a' : 'b';
    nextRound[pairIdx][slot] = winnerId;

    // a disputa de 3º lugar nasce assim que a semifinal (penúltima rodada) termina
    if(wc.thirdPlace && !wc.thirdPlaceMatch && src.roundIdx === wc.rounds.length-2){
      const semis = wc.rounds[src.roundIdx];
      if(semis.every(x=>x.played)){
        const loserOf = (mm)=> mm.winner===mm.a ? mm.b : mm.a;
        wc.thirdPlaceMatch = { a: loserOf(semis[0]), b: loserOf(semis[1]), scoreA:null, scoreB:null, played:false, winner:null };
      }
    }
  }
  state.matchCtx = null;
  saveState();
  setView('worldcup');

/* ---- toasts ---- */
function toast(msg, sub, cls){
  let box = $id('toastBox'); if(!box){ box = document.createElement('div'); box.id='toastBox'; document.body.appendChild(box); }
  const t = document.createElement('div'); t.className='toast '+(cls||''); t.setAttribute('role','status');
  t.innerHTML = `<div>${msg}${sub?`<small>${sub}</small>`:''}</div>`;
  box.appendChild(t); setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .4s'; setTimeout(()=>t.remove(),450); }, 3600);
}

/* ---- efeitos sonoros (Web Audio, sem arquivos) ---- */
const SFX = {
  ctx:null, master:null,
  on(){ const s=state.settings||{}; return s.sfx!==false; },
  vol(){ const v=(state.settings||{}).sfxVolume; return v==='low'?0.12:v==='high'?0.5:0.28; },
  ensure(){
    if(this.ctx) return true;
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false; this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.connect(this.ctx.destination); return true; }catch(e){ return false; }
  },
  tone(f,d,type,v,slide,t0){
    const c=this.ctx, t=c.currentTime+(t0||0), o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+d+0.05);
  },
  noise(d,v,freq,t0){
    const c=this.ctx, t=c.currentTime+(t0||0), n=Math.floor(c.sampleRate*d), b=c.createBuffer(1,n,c.sampleRate), a=b.getChannelData(0);
    for(let i=0;i<n;i++) a[i]=(Math.random()*2-1);
    const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||900; f.Q.value=0.7;
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v,t+d*0.3); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  play(name, arg){
    try{
      if(!this.on() || !this.ensure()) return;
      if(this.ctx.state==='suspended') this.ctx.resume();
      this.master.gain.value=this.vol();
      switch(name){
        case 'click': this.tone(720,0.05,'square',0.04,520); break;
        case 'whistle': this.tone(2900,0.16,'sine',0.18); this.tone(3100,0.22,'sine',0.18,null,0.2); break;
        case 'goal': this.noise(1.6,0.5,700); [523,659,784,1047].forEach((f,i)=>this.tone(f,0.35,'triangle',0.16,null,i*0.09)); break;
        case 'near': this.noise(0.35,0.18,500); break;
        case 'card': this.tone(1800,0.07,'square',0.08); break;
        case 'coin': this.tone(988,0.08,'triangle',0.14); this.tone(1319,0.18,'triangle',0.14,null,0.08); break;
        case 'flip': this.noise(0.18,0.2,2500); break;
        case 'ach': [523,659,784,1047].forEach((f,i)=>this.tone(f,0.3,'sine',0.16,null,i*0.12)); break;
        case 'level': [392,523,659,784,1047].forEach((f,i)=>this.tone(f,0.28,'triangle',0.17,null,i*0.1)); break;
        case 'rare': { const n=3+(arg||0); for(let i=0;i<n;i++) this.tone(440*Math.pow(1.19,i),0.3,'triangle',0.15,null,i*0.08); this.noise(0.8,0.25,1500); break; }
        case 'kick': this.tone(190,0.08,'triangle',0.2,80); this.noise(0.05,0.1,1800); break;
        case 'err': this.tone(160,0.2,'sawtooth',0.1); break;
      }
    }catch(e){}
  }
};
document.addEventListener('click', e=>{ if(e.target.closest && e.target.closest('button')) SFX.play('click'); }, true);

/* ---- confete ---- */
const Confetti = {
  parts:[], raf:null, cv:null,
  burst(n, opts){
    const st = state.settings||{}; if(st.confetti===false || st.performanceMode) return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if(!this.cv){ this.cv=document.createElement('canvas'); this.cv.id='confettiCv'; document.body.appendChild(this.cv); }
    const cv=this.cv; cv.width=innerWidth; cv.height=innerHeight;
    const cols = (opts&&opts.colors)||['#e8b34a','#29d398','#a25bff','#ff5c5c','#4ea1ff','#fff'];
    for(let i=0;i<(n||160);i++) this.parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*0.35,vx:(Math.random()-.5)*14,vy:-Math.random()*13-3,r:Math.random()*6+3,c:cols[i%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:1});
    if(!this.raf) this.loop();
  },
  loop(){
    const cv=this.cv, ctx=cv.getContext('2d'); ctx.clearRect(0,0,cv.width,cv.height);
    this.parts=this.parts.filter(p=>p.life>0 && p.y<cv.height+20);
    this.parts.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.vx*=0.99; p.rot+=p.vr; p.life-=0.006; ctx.save(); ctx.globalAlpha=Math.max(p.life,0); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); });
    if(this.parts.length) this.raf=requestAnimationFrame(()=>this.loop()); else { this.raf=null; ctx.clearRect(0,0,cv.width,cv.height); }
  }
};

/* ---- estado estendido (moedas, XP, estatísticas, conquistas) ---- */
function normExt(e){
  e = e||{};
  const d = {coins:200, totalEarned:200, xp:0, ach:{}, history:[], scorers:{}, teamStats:{}, titles:{wc:{},league:{}}, daily:{last:null,streak:0},
    stats:{matches:0,goals:0,yellow:0,red:0,shootouts:0,hat:0,cleanSheets:0,comebacks:0,bigWin:0,wcTitles:0,leagueTitles:0,packs:0,bestPull:0,claims:0,created:0,teamsCreated:0,sold:0,played:0,playedWins:0}};

function ex(){ if(!state.ext) state.ext = normExt(); return state.ext; }
const levelOf = xp=>1+Math.floor(Math.sqrt(xp/60));
const LVL_TITLES = ['Estagiário','Olheiro','Auxiliar','Treinador','Técnico','Manager','Diretor','Lenda'];
function grantCoins(n){ const e=ex(); e.coins+=n; if(n>0) e.totalEarned+=n; }
function addXp(n){
  const e=ex(), l0=levelOf(e.xp); e.xp+=n; const l1=levelOf(e.xp);
  if(l1>l0){ grantCoins(100*l1); toast(`⭐ Nível ${l1}!`, `${LVL_TITLES[Math.min(l1-1,LVL_TITLES.length-1)]} · +${100*l1} 🪙`, 'ach'); SFX.play('level'); Confetti.burst(90); }
}
function spendCoins(n){ const e=ex(); if(e.coins<n){ SFX.play('err'); toast('Moedas insuficientes','Jogue partidas para ganhar mais 🪙'); return false; } e.coins-=n; return true; }

function matchWinnerSide(c){ return c.scoreA!==c.scoreB ? (c.scoreA>c.scoreB?'A':'B') : (c.penA>c.penB?'A':'B'); }
function computeMatchReward(c){ return 20 + 4*(c.scoreA+c.scoreB) + (c.source.friendly?0:15) + (c.penA!==undefined?10:0) + (c.played?20:0) + (c.played&&matchWinnerSide(c)===c.control?30:0); }
function pushHist(h){ const e=ex(); e.history.unshift(h); if(e.history.length>80) e.history.length=80; }
function tsOf(id){ const e=ex(); return e.teamStats[id] || (e.teamStats[id]={p:0,w:0,d:0,l:0,gf:0,ga:0,form:[]}); }
function onMatchConfirmed(c, winnerId){
  const e=ex(), s=c.sim, st=e.stats;
  st.matches++; st.goals+=c.scoreA+c.scoreB; st.yellow+=s.stats.A.yellow+s.stats.B.yellow; st.red+=s.stats.A.red+s.stats.B.red;
  if(c.penA!==undefined) st.shootouts++;
  if(c.played){ st.played++; if(matchWinnerSide(c)===c.control) st.playedWins++; }
  const margin = Math.abs(c.scoreA-c.scoreB); st.bigWin=Math.max(st.bigWin, margin);
  if(c.scoreA===0 || c.scoreB===0) st.cleanSheets += (c.scoreA===0&&c.scoreB===0)?2:1;
  ['A','B'].forEach(side=>{
    const t = side==='A'?c.teamA:c.teamB, gf=side==='A'?c.scoreA:c.scoreB, ga=side==='A'?c.scoreB:c.scoreA, other=side==='A'?'B':'A';
    const r = tsOf(t.id); r.p++; r.gf+=gf; r.ga+=ga;
    const res = gf>ga?'W':gf<ga?'L':'D'; if(res==='W')r.w++; else if(res==='L')r.l++; else r.d++;
    r.form.unshift(res); r.form.length=Math.min(r.form.length,5);
    if(winnerId===t.id && s.maxLead[other]>=2 && s.maxLead[side]<=0 ) {}
    if(winnerId===t.id && s.maxLead[other]-0>=2 && gf>=ga) st.comebacks++;
    Object.values(s.pstats[side]).forEach(p=>{
      if(p.goals){ const real=(side==='A'?c.teamA:c.teamB).players.find(x=>x&&x.id===p.id); if(real) real.goals=(real.goals||0)+p.goals; const k=p.id; const o=e.scorers[k]||(e.scorers[k]={name:p.name,team:t.name,goals:0}); o.goals+=p.goals; o.team=t.name; }
      if(p.goals>=3) st.hat++;
    });
  });
  pushHist({t:Date.now(), a:c.teamA.id, b:c.teamB.id, an:c.teamA.name, bn:c.teamB.name, sa:c.scoreA, sb:c.scoreB, pa:c.penA, pb:c.penB, comp:matchLabel(c.source), mvp:s.mvp?s.mvp.name:''});
  const ks=Object.keys(e.scorers); if(ks.length>300){ ks.sort((x,y)=>e.scorers[x].goals-e.scorers[y].goals).slice(0,ks.length-250).forEach(k=>delete e.scorers[k]); }
  const rew = computeMatchReward(c); grantCoins(rew); addXp(20+(c.scoreA+c.scoreB)*2+(c.source.friendly?0:15));
  toast(`+${rew} 🪙`, 'Recompensa da partida'); SFX.play('coin');
}

}

function quickRandomMatch(){
  if(state.teams.length<2){ toast('Crie pelo menos 2 times'); return; }
  const a=pick(state.teams); let b=pick(state.teams); let g=0; while(b===a&&g++<20) b=pick(state.teams);
  if(!state.friendly) state.friendly={teamA:null,teamB:null};
  state.friendly.teamA=a.id; state.friendly.teamB=b.id; openMatchGeneric(a.id,b.id,{friendly:true});
}
function starVsStar(){
  const s=state.teams.slice().sort((x,y)=>teamStrength(y)-teamStrength(x)); if(s.length<2) return;
  if(!state.friendly) state.friendly={teamA:null,teamB:null};
  state.friendly.teamA=s[0].id; state.friendly.teamB=s[1].id; openMatchGeneric(s[0].id,s[1].id,{friendly:true});
}

async function applyImported(txt){

let palSel = 0, palItems = [];
function palSource(q){
  q=q.trim().toLowerCase(); const out=[];
  NAV_ITEMS.concat([['home','Início','🏠']]).forEach(([k,l,i])=>out.push({t:`${i} ${l}`,s:'página',f:()=>setView(k)}));

    state.teams.forEach(t=>out.push({t:'⚽ '+t.name,s:'time',f:()=>openTeam(t.id)}));

function openPalette(){
  closePalette(); const bg=document.createElement('div'); bg.className='pal-bg'; bg.id='palBg';
  bg.innerHTML=`<div class="pal"><input id="palIn" placeholder="Buscar página, time, jogador ou ação..." autocomplete="off"><div class="pal-list" id="palList"></div></div>`;
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) closePalette(); }); document.body.appendChild(bg);

function renderPal(q){
  palItems=palSource(q); const l=$id('palList'); if(!l) return;
  l.innerHTML=palItems.map((x,i)=>`<div class="pal-item ${i===palSel?'sel':''}" data-i="${i}">${escHtml(x.t)}<small>${escHtml(x.s)}</small></div>`).join('')||'<div class="pal-item">Nada encontrado</div>';
  l.querySelectorAll('.pal-item[data-i]').forEach(el=>el.addEventListener('click',()=>runPal(+el.dataset.i)));
}

/* ---- teclado ---- */
document.addEventListener('keydown', e=>{
  if(window.__arcadeActive) return;
  const tag=(e.target&&e.target.tagName)||'';
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $id('palBg')?closePalette():openPalette(); return; }
  if($id('palBg')){
    if(e.key==='Escape') closePalette();
    else if(e.key==='ArrowDown'){ e.preventDefault(); palSel=Math.min(palSel+1,palItems.length-1); renderPal($id('palIn').value); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); palSel=Math.max(palSel-1,0); renderPal($id('palIn').value); }
    else if(e.key==='Enter'){ e.preventDefault(); runPal(palSel); }
    return;
  }
  if(e.key==='Escape'){ if(state.modal) closeModal(); else if(state.sidebarOpen) closeSidebar(); return; }
  if(/INPUT|TEXTAREA|SELECT/.test(tag)) return;
  if((e.key==='Enter'||e.key===' ') && e.target && e.target.getAttribute && e.target.getAttribute('role')==='button'){ e.preventDefault(); e.target.click(); return; }
  const c=state.matchCtx;
  if(state.view==='match' && c){
    if(e.key===' '){ e.preventDefault(); toggleMatchPause(); }
    else if(e.key==='1') changeSpeed(0.5); else if(e.key==='2') changeSpeed(1); else if(e.key==='3') changeSpeed(2); else if(e.key==='4') changeSpeed(4);
    else if(e.key.toLowerCase()==='s') skipMatch();
    else if(e.key==='Enter' && c.finished) finishMatch();
  }
});

/* ---- cronologia de Copas e Ligas (nas Estatísticas) ---- */
function ordPt(n){ return n+'ª'; }
function joinPt(a){ return a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+' e '+a[a.length-1]; }
function chronoList(kind){
  const e=ex(), list=(e.chrono[kind]||[]).map(x=>({...x}));
  const counted={}; list.forEach(x=>counted[x.teamId]=(counted[x.teamId]||0)+1);
  const legacy=[];
  Object.entries(e.titles[kind]||{}).forEach(([id,n])=>{ const miss=n-(counted[id]||0); const t=findTeam(id)||{}; for(let i=0;i<miss;i++) legacy.push({teamId:id,name:t.name||'?',color:t.color||'#888',legacy:true}); });
  return legacy.concat(list);
}
function chronoHTML(kind){
  const label = kind==='wc' ? {one:'Copa',many:'Copas',art:'a'} : {one:'Liga',many:'Ligas',art:'a'};
  const items=chronoList(kind), n=items.length;
  const head = `<h4 class="settings-panel-title">${kind==='wc'?'🏆':'📊'} Cronologia das ${label.many}</h4>`;
  if(!n) return `<div class="panel">${head}<p class="hint">Nenhuma ${label.one} concluída ainda. Quando alguém for campeão, aparece aqui.</p></div>`;
  const by={}; const order=[];
  items.forEach((x,i)=>{ const k=x.teamId; if(!by[k]){ by[k]={name:x.name,color:x.color,nums:[]}; order.push(k); } by[k].nums.push(i+1); if(findTeam(k)) by[k].name=findTeam(k).name; });
  const summary = order.map(k=>`<b>${escHtml(by[k].name)}</b> ganhou ${joinPt(by[k].nums.map(ordPt))}`).join('; ');
  const rows = items.map((x,i)=>{ const t=findTeam(x.teamId); const nm=t?t.name:x.name; const d=x.ts?new Date(x.ts).toLocaleDateString('pt-BR'):'ordem desconhecida';
    return `<div class="rate-row"><span><b>${i+1}ª ${label.one}</b> — <span style="color:${x.color}">●</span> ${escHtml(nm)} 🏆</span><small class="hint">${d}</small></div>`; }).join('');
  return `<div class="panel">${head}<p>Teve <b>${n}</b> ${n===1?label.one.toLowerCase():label.many.toLowerCase()}. ${summary}.</p>${rows}</div>`;
}

/* ============================= JOGAR DE VERDADE (estilo FIFA, vista de cima) ============================= */
const ArcadeGame = (function(){

    n:{spd:1,user:1,think:.38,tk:1,acc:1,gk:1,press:2,mark:false,smart:false},                // normal
    h:{spd:1.06,user:1,think:.16,tk:1.5,acc:1.4,gk:1.15,press:3,mark:true,smart:true}          // difícil: mais rápidos, marcam e jogam melhor

  const $ = id=>document.getElementById(id);

  /* ---------- montagem ---------- */
  function mkTeam(team, side, attackDir, colorOverride){

      let p = team.players[i];
