<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planifa 1</title>
<meta name="description" content="Planifa 1 — sandbox de cartas de futebol: monte times, crie jogadores e dispute copas.">
<meta name="theme-color" content="#081310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planifa 1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#081310;
  --panel:#0f1c17;
  --panel2:#132720;
  --line:#1e352b;
  --text:#eaf2ec;
  --sub:#8fa89c;
  --gold:#e8b34a;
  --emerald:#29d398;
  --violet:#a25bff;
  --red:#e2544a;
  --tier-brown-a:#2b1c12; --tier-brown-b:#4a2f1a;
  --tier-bronze-a:#7a4a22; --tier-bronze-b:#a66a34;
  --tier-silver-a:#9aa4ab; --tier-silver-b:#e3e9ec;
  --tier-gold-a:#c98f22; --tier-gold-b:#ffd776;
  --tier-diamond-a:#1fa8c9; --tier-diamond-b:#a6f3ff;
  --tier-purple-a:#5a189a; --tier-purple-b:#c48bff;
  --tier-white-a:#c7cdd3; --tier-white-b:#ffffff;
  --tier-wine-a:#2b060c; --tier-wine-b:#7d1f30;
  --tier-neon-a:#ff2079; --tier-neon-b:#18f7ff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 20% -10%, rgba(41,211,152,.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(232,179,74,.08), transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 80px;}

/* ---- topbar ---- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;margin-bottom:22px;border-radius:14px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);flex-wrap:wrap;gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--emerald);box-shadow:0 0 12px var(--emerald);}
.brand h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;letter-spacing:.5px;margin:0;text-transform:uppercase;}
.brand h1 span{color:var(--gold);}
.brand small{display:block;color:var(--sub);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:-2px;}
nav{display:flex;gap:6px;flex-wrap:wrap;}
nav button{
  background:transparent;border:1px solid var(--line);color:var(--sub);
  padding:8px 14px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;
  letter-spacing:.3px;transition:.15s;
}
nav button:hover{color:var(--text);border-color:var(--emerald);}
nav button.active{background:var(--emerald);color:#052018;border-color:var(--emerald);}

h2.section-title{
  font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:30px;
  text-transform:uppercase;letter-spacing:.5px;margin:6px 0 16px;
}
p.section-sub{color:var(--sub);margin:-10px 0 20px;font-size:14px;}

.grid{display:grid;gap:14px;}
.grid.teams{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
.grid.players{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}

/* ---- team tile ---- */
.team-tile{
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;
  transition:.15s;position:relative;overflow:hidden;
}
.team-tile:hover{border-color:var(--gold);transform:translateY(-2px);}
.team-tile .crest{
  width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:18px;color:#04140f;margin-bottom:10px;
}
.team-tile h3{margin:0 0 4px;font-size:16px;}
.team-tile .meta{color:var(--sub);font-size:12px;}
.team-tile .custom-badge{position:absolute;top:12px;right:12px;font-size:10px;background:var(--violet);color:#fff;padding:2px 8px;border-radius:999px;letter-spacing:.5px;}

/* ---- player card (grids / catalog / modals) ---- */
.card{
  position:relative;border-radius:14px;padding:12px 10px 10px;text-align:center;
  min-height:190px;display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid rgba(255,255,255,.15);cursor:pointer;transition:.15s;
  box-shadow:0 6px 16px rgba(0,0,0,.35);
}
.card:hover{transform:translateY(-4px) scale(1.02);}
.card .ovr{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;line-height:1;}
.card .pos{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;opacity:.85;}
.card .name{font-weight:700;font-size:13px;margin-top:6px;line-height:1.2;min-height:32px;}
.card .tier-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;opacity:.75;margin-top:2px;}
.card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:4px;}
.card .rm{background:rgba(0,0,0,.35);border:none;color:inherit;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;flex-shrink:0;}

.tier-brown{background:linear-gradient(160deg,var(--tier-brown-b),var(--tier-brown-a));color:#e7d8c9;}
.tier-bronze{background:linear-gradient(160deg,var(--tier-bronze-b),var(--tier-bronze-a));color:#2c1806;}
.tier-silver{background:linear-gradient(160deg,var(--tier-silver-b),var(--tier-silver-a));color:#1a2226;}
.tier-gold{background:linear-gradient(160deg,var(--tier-gold-b),var(--tier-gold-a));color:#2c1c00;}
.tier-diamond{background:linear-gradient(160deg,var(--tier-diamond-b),var(--tier-diamond-a));color:#022430;}
.tier-purple{background:linear-gradient(160deg,var(--tier-purple-b),var(--tier-purple-a));color:#fff;box-shadow:0 0 22px rgba(162,91,255,.55);}
.tier-purple::after{content:"";position:absolute;inset:0;border-radius:14px;border:1px solid rgba(255,255,255,.5);pointer-events:none;}
.tier-white{background:linear-gradient(160deg,var(--tier-white-b),var(--tier-white-a));color:#1a2226;box-shadow:0 0 16px rgba(255,255,255,.5);}
.tier-white::after{content:"";position:absolute;inset:0;border-radius:14px;border:1px solid rgba(0,0,0,.15);pointer-events:none;}
.tier-wine{background:linear-gradient(160deg,var(--tier-wine-b),var(--tier-wine-a));color:#f3dbe0;box-shadow:0 0 18px rgba(125,31,48,.6);}
.tier-neon{background:linear-gradient(135deg,var(--tier-neon-a),var(--tier-neon-b));color:#051014;
  animation:neon-pulse 1.8s ease-in-out infinite;}
.tier-rainbow{background:linear-gradient(135deg,#ff004c,#ff8c00,#ffee00,#2bff00,#00e5ff,#7a00ff,#ff00c8);
  background-size:220% 220%;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);
  animation:rainbow-shift 5s linear infinite;box-shadow:0 0 24px rgba(255,255,255,.4);}
@keyframes neon-pulse{
  0%,100%{box-shadow:0 0 12px rgba(255,32,121,.65),0 0 12px rgba(24,247,255,.45);}
  50%{box-shadow:0 0 24px rgba(255,32,121,.95),0 0 24px rgba(24,247,255,.75);}
}
@keyframes rainbow-shift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.legend .chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);}
.legend .sw{width:14px;height:14px;border-radius:4px;}

/* ---- forms / panels ---- */
.panel{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.field input[type=text],.field select,.field input[type=number]{
  width:100%;background:var(--ink);border:1px solid var(--line);color:var(--text);
  padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit;
}
.field input[type=range]{width:100%;accent-color:var(--gold);}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row .field{flex:1;min-width:160px;}
.btn{
  background:var(--emerald);color:#052018;border:none;padding:10px 18px;border-radius:8px;
  font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.3px;
}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn.gold{background:var(--gold);color:#2c1c00;}
.btn.danger{background:var(--red);color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.color-swatches{display:flex;gap:8px;flex-wrap:wrap;}
.color-swatches div{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.color-swatches div.sel{border-color:#fff;}

.modal-bg{position:fixed;inset:0;background:rgba(3,8,6,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;}
.modal h3{margin-top:0;font-family:'Big Shoulders Display',sans-serif;text-transform:uppercase;font-size:22px;}

/* ---- pitch (shared base) ---- */
.pitch{
  position:relative;border-radius:14px;overflow:hidden;margin-bottom:16px;
  background:
   repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 60px),
   linear-gradient(180deg,#0e3d27,#0a2a1b);
  border:1px solid var(--line);
}
.pitch.match-pitch{height:270px;}
.pitch.lineup{height:500px;}
.midline{position:absolute;left:50%;top:0;bottom:0;width:2px;background:rgba(255,255,255,.25);}
.circle{position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;border:2px solid rgba(255,255,255,.25);border-radius:50%;}
.goal-net{position:absolute;top:22%;bottom:22%;width:9px;background:repeating-linear-gradient(0deg, rgba(255,255,255,.55) 0 4px, transparent 4px 9px);}
.goal-net.left{left:0;}
.goal-net.right{right:0;}
.ball{position:absolute;width:12px;height:12px;background:#fff;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 8px rgba(255,255,255,.8);z-index:3;
  transition:left .9s ease-in-out, top .9s ease-in-out;}
.dot{position:absolute;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 5px rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.5);z-index:2;
  transition:left .9s ease-in-out, top .9s ease-in-out;}
.flash{position:absolute;top:0;bottom:0;width:32%;opacity:0;pointer-events:none;transition:opacity .3s;}
.flash.side-left{left:0;background:radial-gradient(ellipse at left, rgba(232,179,74,.55), transparent 70%);}
.flash.side-right{right:0;background:radial-gradient(ellipse at right, rgba(232,179,74,.55), transparent 70%);}
.flash.on{opacity:1;}
.goal-banner{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
  font-family:'Big Shoulders Display',sans-serif;font-size:38px;font-weight:800;color:var(--gold);
  text-shadow:0 0 20px rgba(232,179,74,.9);opacity:0;pointer-events:none;letter-spacing:1px;
  transition:opacity .25s, transform .25s;text-align:center;z-index:4;text-transform:uppercase;
}
.goal-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ---- lineup slots ---- */
.pitch-slot{position:absolute;transform:translate(-50%,-50%);width:70px;padding:6px 4px;border-radius:10px;
  text-align:center;cursor:pointer;font-size:11px;transition:transform .15s;z-index:2;}
.pitch-slot:hover{transform:translate(-50%,-50%) scale(1.08);}
.pitch-slot.empty{border:1.5px dashed rgba(255,255,255,.4);background:rgba(255,255,255,.06);color:#dce8e2;}
.pitch-slot.empty .slot-plus{font-size:20px;line-height:1;}
.pitch-slot.filled{border:1px solid rgba(255,255,255,.3);box-shadow:0 4px 10px rgba(0,0,0,.45);}
.pitch-slot .slot-ovr{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15px;line-height:1.15;}
.pitch-slot .slot-name{font-weight:700;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pitch-slot .slot-pos{font-size:8px;letter-spacing:1px;opacity:.85;text-transform:uppercase;margin-top:1px;}

.empty-slot{
  border:1.5px dashed var(--line);border-radius:14px;min-height:190px;
  display:flex;align-items:center;justify-content:center;color:var(--sub);
  cursor:pointer;font-size:28px;transition:.15s;
}
.empty-slot:hover{border-color:var(--emerald);color:var(--emerald);}

/* ---- world cup ---- */
.bracket-round{margin-bottom:22px;}
.bracket-round h4{font-family:'Big Shoulders Display',sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-size:16px;margin-bottom:10px;}
.match-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;
}
.match-row .side{display:flex;align-items:center;gap:8px;flex:1;font-weight:600;font-size:14px;}
.match-row .side.right{justify-content:flex-end;}
.match-row .crest-mini{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#04140f;flex-shrink:0;}
.match-row .score{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;min-width:60px;text-align:center;color:var(--gold);}
.match-row .vs{color:var(--sub);font-size:11px;}

/* ---- match viewer ---- */
.scoreboard{
  display:flex;align-items:center;justify-content:space-between;background:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:18px 24px;margin-bottom:14px;
}
.scoreboard .team-name{font-family:'Big Shoulders Display',sans-serif;font-size:20px;text-transform:uppercase;font-weight:800;flex:1;}
.scoreboard .team-name.right{text-align:right;}
.scoreboard .score-big{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:var(--gold);letter-spacing:4px;padding:0 22px;}
.scoreboard .clock{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--emerald);text-align:center;display:block;margin-top:4px;}

.speed-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.speed-btn{background:transparent;border:1px solid var(--line);color:var(--sub);padding:6px 14px;border-radius:8px;
  cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;}
.speed-btn.active{background:var(--gold);color:#2c1c00;border-color:var(--gold);}

.ticker{
  background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;
  height:190px;overflow-y:auto;display:flex;flex-direction:column-reverse;font-size:13px;
}
.ticker .ev{padding:5px 0;border-bottom:1px dashed var(--line);color:var(--sub);}
.ticker .ev b{color:var(--text);}
.ticker .ev.goal{color:var(--gold);}
.ticker .ev.goal b{color:var(--gold);}

.tabs-mini{display:flex;gap:8px;margin-bottom:14px;}
.tabs-mini button{background:transparent;border:1px solid var(--line);color:var(--sub);padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;}
.tabs-mini button.active{background:var(--panel2);color:var(--text);border-color:var(--gold);}

.hint{color:var(--sub);font-size:12.5px;line-height:1.5;}
.checkbox-team{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;}
.checkbox-team.sel{border-color:var(--emerald);}
.checkbox-team .crest-mini{width:20px;height:20px;border-radius:5px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#04140f;flex-shrink:0;}

.champion-banner{
  text-align:center;padding:40px 20px;background:linear-gradient(160deg,var(--tier-purple-b),var(--tier-purple-a));
  border-radius:16px;color:#fff;box-shadow:0 0 40px rgba(162,91,255,.5);
}
.champion-banner h2{font-family:'Big Shoulders Display',sans-serif;font-size:40px;text-transform:uppercase;margin:6px 0;}
.champion-banner .trophy{font-size:52px;}

.size-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.catalog-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.catalog-controls .field{margin-bottom:0;min-width:150px;}
.catalog-controls .field.search{flex:2;min-width:200px;}
.catalog-count{color:var(--sub);font-size:12.5px;margin-bottom:14px;}

/* ---- team selection mode ---- */
.team-tile.tile-selected{border-color:var(--emerald);box-shadow:0 0 0 2px var(--emerald);}
.sel-check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--line);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--emerald);font-weight:800;}

/* ---- real bracket tree ---- */
.bracket-scroll{overflow-x:auto;overflow-y:hidden;padding:36px 4px 16px;margin-bottom:10px;}
.bracket-canvas{position:relative;}
.bracket-roundlabel{position:absolute;top:-28px;font-family:'Big Shoulders Display',sans-serif;
  text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-size:14px;text-align:center;}
.bracket-match{position:absolute;transform:translateY(-50%);background:var(--ink);border:1px solid var(--line);
  border-radius:8px;overflow:hidden;z-index:2;}
.bracket-match.playable{cursor:pointer;border-color:var(--gold);}
.bracket-match.playable:hover{box-shadow:0 0 0 2px var(--gold);}
.row-team{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11.5px;font-weight:600;height:50%;}
.row-team:first-child{border-bottom:1px solid var(--line);}
.row-team.tbd{color:var(--sub);font-style:italic;font-weight:400;justify-content:center;}
.row-team.winner{background:rgba(41,211,152,.14);color:var(--emerald);}
.crest-tiny{width:16px;height:16px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#04140f;}
.row-team .rt-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.row-team .sc{font-family:'JetBrains Mono',monospace;font-weight:700;}
.play-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);
  color:var(--gold);font-size:11px;font-weight:700;opacity:0;transition:opacity .15s;}
.bracket-match.playable:hover .play-hint{opacity:1;}
.conn-h{position:absolute;height:2px;background:var(--line);}
.conn-v{position:absolute;width:2px;background:var(--line);}

.save-toast{position:fixed;bottom:16px;right:16px;background:var(--panel2);border:1px solid var(--emerald);color:var(--emerald);
  padding:8px 14px;border-radius:8px;font-size:12px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;}
.save-toast.show{opacity:1;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="save-toast" id="saveToast">Progresso salvo</div>

<script>
/* ============================= DATA / CONSTANTS ============================= */
const MAX_OVR = 500;
const TIERS = [
  {max:29,  key:'brown',   label:'Marrom Escuro'},
  {max:69,  key:'bronze',  label:'Bronze'},
  {max:80,  key:'silver',  label:'Prata'},
  {max:89,  key:'gold',    label:'Ouro'},
  {max:95,  key:'diamond', label:'Diamante'},
  {max:250, key:'purple',  label:'Roxo'},
  {max:300, key:'white',   label:'Branco'},
  {max:400, key:'wine',    label:'Vinho'},
  {max:450, key:'neon',    label:'Neon'},
  {max:500, key:'rainbow', label:'Arco-Íris'},
];
function getTier(ovr){
  ovr = Math.max(0, Math.min(MAX_OVR, ovr));
  for(const t of TIERS){ if(ovr<=t.max) return t; }
  return TIERS[TIERS.length-1];
}

const POSITIONS = ['GOL','ZAG','LAT','VOL','MEI','PON','ATA'];
const TEAM_COLORS = [
  '#e8b34a','#29d398','#a25bff','#e2544a','#4a90e2','#f2a65a','#5ad1c9','#d65fa0','#c9d15a','#7b8cff',
  '#ff6b6b','#1fbf75','#3f51b5','#ff9f43','#2ec4b6','#c0392b','#8e44ad','#16a085','#e67e22','#34495e',

const FORMATIONS = {
  '4-4-2':   [{p:'GK',n:1},{p:'DEF',n:4},{p:'MID',n:4},{p:'FWD',n:2}],
  '4-3-3':   [{p:'GK',n:1},{p:'DEF',n:4},{p:'MID',n:3},{p:'FWD',n:3}],
  '3-5-2':   [{p:'GK',n:1},{p:'DEF',n:3},{p:'MID',n:5},{p:'FWD',n:2}],
  '4-2-3-1': [{p:'GK',n:1},{p:'DEF',n:4},{p:'DM',n:2},{p:'MID',n:3},{p:'FWD',n:1}],
  '5-3-2':   [{p:'GK',n:1},{p:'DEF',n:5},{p:'MID',n:3},{p:'FWD',n:2}],
  '3-4-3':   [{p:'GK',n:1},{p:'DEF',n:3},{p:'MID',n:4},{p:'FWD',n:3}],
};
function labelForRow(purpose,count,i){
  if(purpose==='GK') return 'GOL';
  if(purpose==='DEF'){ if(count>=4 && (i===0||i===count-1)) return 'LAT'; return 'ZAG'; }
  if(purpose==='DM') return 'VOL';
  if(purpose==='MID') return 'MEI';
  if(purpose==='FWD'){ if(count===3 && (i===0||i===count-1)) return 'PON'; return 'ATA'; }
  return 'MEI';
}
function buildFormationSlots(key){
  const rows = FORMATIONS[key] || FORMATIONS['4-3-3'];
  const n = rows.length;
  const slots = [];
  rows.forEach((row,ri)=>{
    const y = n===1 ? 50 : 92 - (ri*(82/(n-1)));
    for(let i=0;i<row.n;i++){
      const x = row.n===1 ? 50 : 12 + i*((88-12)/(row.n-1));
      slots.push({label:labelForRow(row.p,row.n,i), x, y});
    }
  });
  return slots;
}

const FIRST_NAMES = ['Lucas','Thiago','Gabriel','Rafael','Bruno','Diego','Enzo','Kaique','Matheus','Vitor','André','Caio','Igor','Leo','Rian','Yuri','Davi','Nicolas','Pedro','Otávio',
  'Marco','Luca','Milan','Kevin','Sven','Jonas','Erik','Ivo','Adrian','Nikola','Mateo','Iker','Xavi','Rui','Tiago','Amir','Karim','Sadio','Kwame','Femi','Chidi','Yusuf'];
const LAST_NAMES = ['Silva','Souza','Costa','Pereira','Oliveira','Ramos','Nascimento','Barbosa','Cardoso','Teixeira','Moraes','Farias','Aguiar','Rocha','Vidal','Novak','Keller','Petrov',
  'Ferrara','Moretti','Dubois','Lefevre','Fischer','Bauer','Van Dijk','De Boer','Almeida','Santana','Reyes','Herrera','Diallo','Traoré','Mensah','Okafor','Haddad','Nasser'];
function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function pick(arr){return arr[rnd(0,arr.length-1)];}
function randomName(){return pick(FIRST_NAMES)+' '+pick(LAST_NAMES);}
function uid(){return 'p'+Math.random().toString(36).slice(2,10);}

function makePlayer(name,pos,ovr){
  return {id:uid(), name, pos, ovr:Math.max(0,Math.min(MAX_OVR,Math.round(ovr)))};
}
function randomPlayer(qualityBias){
  let base = 45 + qualityBias*40;
  let ovr = base + rnd(-10,10);
  let roll = Math.random();
  if(roll>0.998) ovr = rnd(251,500);     // card lendária raríssima (Branco a Arco-Íris)
  else if(roll>0.985) ovr = rnd(96,130); // Roxo
  else if(roll>0.93) ovr = rnd(90,95);   // Diamante
  else if(roll>0.75) ovr = rnd(81,89);   // Ouro
  return makePlayer(randomName(), pick(POSITIONS), ovr);
}

const CLUB_PREFIXES = ['Tigres','Águias','Leões','Furacão','Estrela','União','Atlético','Real','Dragões','Panteras','Falcões','Titãs','Vulcão','Fênix','Lobos','Trovão','Cometas','Guerreiros','Corsários','Vikings'];

function generateRandomTeamObject(){
  const fKeys = Object.keys(FORMATIONS);
  const formation = pick(fKeys);
  const total = buildFormationSlots(formation).length;
  const bias = Math.random();
  const players = [];
  for(let i=0;i<total;i++) players.push(randomPlayer(bias));
  return {id:uid(), name:randomTeamName(), color:pick(TEAM_COLORS), custom:true, formation, players};
}

function seedData(){
  const fKeys = Object.keys(FORMATIONS);
  state.teams = CATALOG_TEAM_NAMES.map((name,i)=>{
    const bias = 0.5 + (i%3)*0.2;
    const formation = fKeys[i % fKeys.length];
    const total = buildFormationSlots(formation).length;
    const players = [];
    for(let k=0;k<total;k++) players.push(randomPlayer(bias));
    players[Math.floor(total/2)] = makePlayer(randomName(), 'ATA', rnd(84,97));
    return {id:'t'+i, name, color:TEAM_COLORS[i%TEAM_COLORS.length], custom:false, formation, players};
  });
  state.freeAgents = [];
  for(let i=0;i<60;i++){ state.freeAgents.push(randomPlayer(Math.random())); }
  state.categories = [];
}

/* ============================= PERSISTENCE ============================= */
/* Camada de armazenamento dupla:
   - Dentro do preview de artefatos da Claude, usa window.storage (por usuário, entre sessões).
   - Rodando como PWA instalado/hospedado fora da Claude (onde window.storage não existe),
     usa localStorage do navegador — que é o que de fato persiste num PWA. */
const STORAGE_KEY = 'planifa1-data';
const AppStorage = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      try{
        const r = await window.storage.get(key, false);
        if(r && typeof r.value === 'string') return r.value;
      }catch(e){ /* cai para localStorage */ }
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  async set(key, value){
    let ok = false;
    if(window.storage && typeof window.storage.set === 'function'){
      try{ await window.storage.set(key, value, false); ok = true; }catch(e){ /* cai para localStorage */ }
    }
    try{ localStorage.setItem(key, value); ok = true; }catch(e){ /* localStorage pode falhar em modo privado */ }
    return ok;
  }
};
async function loadState(){
  try{
    const raw = await AppStorage.get(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      state.teams = Array.isArray(data.teams) ? data.teams : [];
      state.freeAgents = Array.isArray(data.freeAgents) ? data.freeAgents : [];
      state.categories = Array.isArray(data.categories) ? data.categories : [];
      state.worldCup = data.worldCup || null;
      if(!state.teams.length && !state.freeAgents.length) seedData();
    } else {
      seedData();
    }
  } catch(e){
    seedData();
  }
  state.view='home';
  render();
}
let saveTimer=null;
async function saveState(){
  const toast = document.getElementById('saveToast');
  try{
    const payload = {
      teams: state.teams,
      freeAgents: state.freeAgents,
      categories: state.categories,
      worldCup: (state.worldCup && state.worldCup.rounds) ? state.worldCup : null,
    };
    await AppStorage.set(STORAGE_KEY, JSON.stringify(payload));
    if(toast){
      toast.classList.add('show');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=>toast.classList.remove('show'), 1200);
    }
  } catch(e){ console.error('Falha ao salvar progresso', e); }
}

}

function bulkDeleteTeams(){
  if(!state.selectedTeamIds.length) return;
  const count = state.selectedTeamIds.length;
  showConfirm(`Remover ${count} time(s) selecionado(s)? Os jogadores voltam ao catálogo de agentes livres.`, ()=>{
    const removedSet = new Set(state.selectedTeamIds);
    state.selectedTeamIds.forEach(id=>{
      const t = findTeam(id);
      if(t) state.freeAgents.push(...teamFilled(t));
    });
    state.teams = state.teams.filter(t=>!removedSet.has(t.id));
    state.categories.forEach(cat=>{ cat.teamIds = cat.teamIds.filter(id=>!removedSet.has(id)); });
    if(state.worldCup && state.worldCup.selected){ state.worldCup.selected = state.worldCup.selected.filter(id=>!removedSet.has(id)); }
    state.selectedTeamIds = [];
    state.teamSelectMode = false;
    saveState();
    setView('teams');
  });
}

function modalHTML(){
  const m = state.modal;
  if(m.type==='slot') return modalSlotHTML();
  if(m.type==='assign') return modalAssignHTML();
  if(m.type==='editPlayer') return modalEditPlayerHTML();
  if(m.type==='confirm') return modalConfirmHTML();
  if(m.type==='alertbox') return modalAlertHTML();
  return '';
}
/* ---- confirm/alert próprios do app (diálogos nativos do navegador podem ser bloqueados
   em visualizações embutidas/sandboxed, então não dependemos de confirm()/alert()) ---- */
let pendingConfirmAction = null;
function showConfirm(message, onYes){
  pendingConfirmAction = onYes;
  state.modal = {type:'confirm', message};
  render();
}
function confirmYes(){
  const action = pendingConfirmAction;
  pendingConfirmAction = null;
  state.modal = null;
  if(action) action();
  render();
}
function confirmNo(){
  pendingConfirmAction = null;
  closeModal();
}
function modalConfirmHTML(){
  const m = state.modal;
  return `<div class="modal-bg">
    <div class="modal" style="max-width:420px;">
      <h3>Confirmar ação</h3>
      <p style="font-size:14px;color:var(--text);line-height:1.5;">${m.message}</p>
      <div class="btn-row" style="justify-content:flex-end;margin-top:10px;">
        <button class="btn secondary" onclick="confirmNo()">Cancelar</button>
        <button class="btn danger" onclick="confirmYes()">Confirmar</button>
      </div>
    </div>
  </div>`;
}
function showAlert(message){
  state.modal = {type:'alertbox', message};
  render();
}
function modalAlertHTML(){
  const m = state.modal;
  return `<div class="modal-bg">
    <div class="modal" style="max-width:420px;">

function assignAgentToSlot(teamId, idx, playerId){
  const t = findTeam(teamId);
  const ai = state.freeAgents.findIndex(p=>p.id===playerId);
  if(ai<0) return;
  const removed = t.players[idx];
  t.players[idx] = state.freeAgents[ai];
  state.freeAgents.splice(ai,1);
  if(removed) state.freeAgents.push(removed);
  saveState();
  closeModal();
}
function createAndAddToSlot(teamId, idx){
  if(!modalDraftPlayer.name.trim()){ showAlert('Dê um nome ao jogador.'); return; }
  const t = findTeam(teamId);
  const removed = t.players[idx];
  t.players[idx] = makePlayer(modalDraftPlayer.name.trim(), modalDraftPlayer.pos, modalDraftPlayer.ovr);
  if(removed) state.freeAgents.push(removed);
  modalDraftPlayer = {name:'', pos:'ATA', ovr:75};
  saveState();
  closeModal();
}
function removeFromSlot(teamId, idx){
  const t = findTeam(teamId);
  const p = t.players[idx];
  if(p) state.freeAgents.push(p);
  t.players[idx] = null;
  saveState();
  closeModal();
}

function roundName(numMatches){
  if(numMatches===1) return 'Final';
  if(numMatches===2) return 'Semifinal';
  if(numMatches===4) return 'Quartas de Final';
  if(numMatches===8) return 'Oitavas de Final';

  return numMatches*2+'ª de Final';
}

/* ============================= WORLD CUP ============================= */
const WC_SIZES = [2,4,8,16,32,64];
function worldCupView(){
  if(state.worldCup && state.worldCup.rounds) return worldCupBracketView();
  if(!state.worldCup) state.worldCup = {selected:[], size:null};
  const wc = state.worldCup;
  const selected = wc.selected;
  return `
  <h2 class="section-title">Copa do Mundo</h2>
  <p class="section-sub">Escolha o tamanho da copa e selecione exatamente essa quantidade de times participantes.</p>
  <div class="size-row">
    <span class="hint">Tamanho da copa:</span>
    ${WC_SIZES.map(s=>`<button class="speed-btn ${wc.size===s?'active':''}" onclick="setWCSize(${s})">${s}</button>`).join('')}
  </div>
  <div class="grid teams">
    ${state.teams.map(t=>checkboxTeamHTML(t, selected.includes(t.id), `toggleWCTeam('${t.id}')`)).join('')}
  </div>
  <div class="btn-row" style="margin-top:18px;">
    <button class="btn gold" ${(!wc.size || selected.length!==wc.size)?'disabled':''} onclick="startWorldCup()">Iniciar Copa (${selected.length}/${wc.size||'?'})</button>
  </div>
  ${wc.size && selected.length<wc.size ? `<p class="hint">Faltam ${wc.size-selected.length} vaga(s). Selecione mais times da lista acima (ou crie novos em "Times").</p>` : ''}
  ${wc.size && selected.length>wc.size ? `<p class="hint" style="color:var(--red);">Você selecionou mais times do que o tamanho escolhido. Desmarque alguns ou aumente o tamanho.</p>` : ''}`;
}
function setWCSize(size){
  if(!state.worldCup || state.worldCup.rounds) state.worldCup = {selected:[], size:null};
  state.worldCup.size = size;
  render();
}
function toggleWCTeam(id){
  if(!state.worldCup || state.worldCup.rounds) state.worldCup = {selected:[], size:null};
  if(!state.worldCup.selected) state.worldCup.selected=[];
  const s = state.worldCup.selected;
  const i = s.indexOf(id);
  if(i>-1) s.splice(i,1); else s.push(id);
  render();
}
function startWorldCup(){
  const wc = state.worldCup;
  const size = wc.size;
  if(!size) return;
  let ids = [...wc.selected];
  if(ids.length !== size){
    showAlert(`Selecione exatamente ${size} time(s) para iniciar esta copa (você tem ${ids.length}).`);
    return;
  }
  for(let i=ids.length-1;i>0;i--){ const j=rnd(0,i); [ids[i],ids[j]]=[ids[j],ids[i]]; }

  // monta o chaveamento inteiro de uma vez (rodadas futuras ficam "a definir" até os jogos anteriores serem simulados)
  const rounds = [];
  let count = ids.length;
  let current = ids;
  while(count>=2){
    const matches = [];
    for(let i=0;i<count;i+=2){
      matches.push({
        a: current ? current[i] : null,
        b: current ? current[i+1] : null,
        scoreA:null, scoreB:null, played:false, winner:null
      });
    }
    rounds.push(matches);
    count = count/2;
    current = null;
  }
  state.worldCup = {selected:ids, size, rounds, champion:null};
  saveState();
  setView('worldcup');
}
function worldCupBracketView(){
  const wc = state.worldCup;
  let html = `<h2 class="section-title">Copa do Mundo</h2>`;
  if(wc.champion){
    const champ = findTeam(wc.champion);
    html += `<div class="champion-banner">
      <div class="trophy">🏆</div>
      <div>CAMPEÃO</div>
      <h2>${champ.name}</h2>
      <div class="hint" style="color:#fff;opacity:.85;">Parabéns! Time invicto na Planifa 1.</div>
    </div>
    <div class="btn-row" style="margin-top:18px;justify-content:center;"><button class="btn secondary" onclick="resetWorldCup()">Nova Copa</button></div>`;
    return html;
  }
  html += `<p class="hint" style="margin-bottom:10px;">Arraste para o lado para ver todas as fases. Clique numa partida destacada para simular.</p>`;
  html += renderBracketTree(wc.rounds);
  return html;
}
function renderBracketTree(rounds){
  const BASE_UNIT=96, MATCH_H=64, COL_W=210, COL_GAP=44;
  const positions = [];
  const n0 = rounds[0].length;
  positions[0] = rounds[0].map((_,i)=> i*BASE_UNIT + BASE_UNIT/2);
  for(let r=1;r<rounds.length;r++){
    positions[r] = rounds[r].map((_,i)=>{
      const c1 = positions[r-1][2*i], c2 = positions[r-1][2*i+1];
      return (c1+c2)/2;
    });
  }
  const totalHeight = n0*BASE_UNIT;
  const totalWidth = rounds.length*COL_W + (rounds.length-1)*COL_GAP;

  let labels='', boxes='', connectors='';
  rounds.forEach((round,ri)=>{
    const left = ri*(COL_W+COL_GAP);
    labels += `<div class="bracket-roundlabel" style="left:${left}px;width:${COL_W}px;">${roundName(round.length)}</div>`;
    round.forEach((m,mi)=>{
      boxes += matchBoxHTML(m, ri, mi, left, positions[ri][mi], COL_W, MATCH_H);
    });
  });
  for(let r=0;r<rounds.length-1;r++){
    const colRight = r*(COL_W+COL_GAP)+COL_W;
    const midX = colRight + COL_GAP/2;
    const pairs = rounds[r].length/2;
    for(let p=0;p<pairs;p++){
      const y1 = positions[r][2*p], y2 = positions[r][2*p+1];
      const yTop = Math.min(y1,y2), yBot = Math.max(y1,y2);
      connectors += `<div class="conn-h" style="left:${colRight}px; top:${y1}px; width:${COL_GAP/2}px;"></div>`;
      connectors += `<div class="conn-h" style="left:${colRight}px; top:${y2}px; width:${COL_GAP/2}px;"></div>`;
      connectors += `<div class="conn-v" style="left:${midX}px; top:${yTop}px; height:${yBot-yTop}px;"></div>`;
      connectors += `<div class="conn-h" style="left:${midX}px; top:${(y1+y2)/2}px; width:${COL_GAP/2}px;"></div>`;
    }
  }
  return `<div class="bracket-scroll"><div class="bracket-canvas" style="width:${totalWidth}px;height:${totalHeight+20}px;">
    ${connectors}${boxes}${labels}
  </div></div>`;
}
function matchBoxHTML(m, ri, mi, left, y, colW, matchH){
  const ta = m.a ? findTeam(m.a) : null;
  const tb = m.b ? findTeam(m.b) : null;
  const canPlay = ta && tb && !m.played;
  const rowTeam = (t, score, isWinner)=>{
    if(!t) return `<div class="row-team tbd">A definir</div>`;
    return `<div class="row-team ${isWinner?'winner':''}">
      <div class="crest-tiny" style="background:${t.color};">${crestLetters(t.name)}</div>
      <span class="rt-name">${t.name}</span>
      ${score!==null ? `<span class="sc">${score}</span>` : ''}
    </div>`;
  };
  const winnerA = m.played && m.winner===m.a;
  const winnerB = m.played && m.winner===m.b;
  return `<div class="bracket-match ${canPlay?'playable':''}" style="left:${left}px; top:${y}px; width:${colW}px; height:${matchH}px;" ${canPlay?`onclick="openMatch(${ri},${mi})"`:''}>
    ${rowTeam(ta, m.played?m.scoreA:null, winnerA)}
    ${rowTeam(tb, m.played?m.scoreB:null, winnerB)}
    ${canPlay?`<div class="play-hint">▶ Simular</div>`:''}
  </div>`;
}
function resetWorldCup(){ state.worldCup=null; saveState(); setView('worldcup'); }
function openMatch(roundIdx, matchIdx){
  const wc = state.worldCup;
  const m = wc.rounds[roundIdx][matchIdx];
  openMatchGeneric(m.a, m.b, {roundIdx, matchIdx});
}

/* ============================= MATCH SIMULATION ============================= */
function openMatchGeneric(aId, bId, source){
  const ta = findTeam(aId), tb = findTeam(bId);
  state.matchCtx = {
    source, teamA:ta, teamB:tb,
    scoreA:0, scoreB:0, minute:0, events:[], finished:false,
    ballX:50, ballY:50, speed:1, timerId:null, tickFn:null, tickBaseMs:220,
    dotsA:Array.from({length:5},()=>({x:rnd(6,58),y:rnd(10,90)})),
    dotsB:Array.from({length:5},()=>({x:rnd(42,94),y:rnd(10,90)})),
    strA: teamStrength(ta), strB: teamStrength(tb),
  };
  setView('match');
  runMatchSimulation();
}
function matchView(){
  const c = state.matchCtx;
  if(!c) return '';
  const speeds = [0.5,1,2,4];
  return `
  <h2 class="section-title">Simulação de Partida</h2>
  <div class="scoreboard">
    <div class="team-name">${c.teamA.name}</div>
    <div style="text-align:center;">
      <span class="score-big">${c.scoreA} - ${c.scoreB}</span>
      <span class="clock" id="clockDisplay">${c.minute}'</span>
    </div>
    <div class="team-name right">${c.teamB.name}</div>
  </div>
  <div class="speed-row">
    <span class="hint">Velocidade da simulação:</span>
    ${speeds.map(s=>`<button class="speed-btn ${c.speed===s?'active':''}" onclick="changeSpeed(${s})">${s}x</button>`).join('')}
  </div>
  <div class="pitch match-pitch" id="pitchEl">
    <div class="midline"></div><div class="circle"></div>
    <div class="goal-net left"></div><div class="goal-net right"></div>
    <div class="flash side-left" id="flashLeft"></div>
    <div class="flash side-right" id="flashRight"></div>
    <div class="goal-banner" id="goalBanner"></div>
    ${c.dotsA.map((d,i)=>`<div class="dot" id="dotA${i}" style="left:${d.x}%;top:${d.y}%;background:${c.teamA.color};"></div>`).join('')}
    ${c.dotsB.map((d,i)=>`<div class="dot" id="dotB${i}" style="left:${d.x}%;top:${d.y}%;background:${c.teamB.color};"></div>`).join('')}
    <div class="ball" id="ballEl" style="left:${c.ballX}%; top:${c.ballY}%;"></div>
  </div>
  <div class="ticker" id="tickerEl">${renderTickerEvents(c)}</div>
  <div class="btn-row" id="matchBtnRow" style="margin-top:14px;justify-content:center;">
    ${c.finished ? `<button class="btn gold" onclick="finishMatch()">Confirmar resultado e voltar</button>` : `<span class="hint">Simulando... aguarde o apito final.</span>`}
  </div>`;
}
function renderTickerEvents(c){
  return c.events.slice().reverse().map(e=>`<div class="ev ${e.goal?'goal':''}">${e.min}' — ${e.goal?'⚽ <b>GOL!</b> ':''}${e.text}</div>`).join('');
}
function scheduleTicker(c, fn, baseMs){
  c.tickFn = fn; c.tickBaseMs = baseMs;
  if(c.timerId) clearInterval(c.timerId);
  c.timerId = setInterval(fn, baseMs / c.speed);
}
function changeSpeed(spd){
  const c = state.matchCtx; if(!c) return;
  c.speed = spd;
  if(c.timerId && c.tickFn){ clearInterval(c.timerId); c.timerId = setInterval(c.tickFn, c.tickBaseMs / c.speed); }
  render();
}
function updateDom(c){
  const ballEl = document.getElementById('ballEl');
  if(ballEl){ ballEl.style.left=c.ballX+'%'; ballEl.style.top=c.ballY+'%'; }
  c.dotsA.forEach((d,i)=>{ const el=document.getElementById('dotA'+i); if(el){el.style.left=d.x+'%';el.style.top=d.y+'%';} });
  c.dotsB.forEach((d,i)=>{ const el=document.getElementById('dotB'+i); if(el){el.style.left=d.x+'%';el.style.top=d.y+'%';} });
  const clockEl = document.getElementById('clockDisplay');
  if(clockEl) clockEl.textContent = c.minute+"'";
  const sb = document.querySelector('.score-big');
  if(sb) sb.textContent = `${c.scoreA} - ${c.scoreB}`;
  updateTicker(c);
}
function updateTicker(c){
  const t = document.getElementById('tickerEl');
  if(t) t.innerHTML = renderTickerEvents(c);
}
function showFinishButton(){
  const holder = document.getElementById('matchBtnRow');
  if(holder) holder.innerHTML = `<button class="btn gold" onclick="finishMatch()">Confirmar resultado e voltar</button>`;
}
function flashGoal(side, text){
  const el = document.getElementById(side==='A' ? 'flashRight' : 'flashLeft');
  if(el){ el.classList.add('on'); setTimeout(()=>el.classList.remove('on'), 550); }
  const banner = document.getElementById('goalBanner');
  if(banner){
    banner.textContent = text;
    banner.classList.add('show');
    setTimeout(()=>banner.classList.remove('show'), 1300);
  }
}
function runMatchSimulation(){
  const c = state.matchCtx;
  const total = 90;
  const diff = c.strA - c.strB;
  const tick = ()=>{
    if(!state.matchCtx || state.matchCtx!==c){ clearInterval(c.timerId); return; }
    c.minute += 2;
    c.ballX = rnd(8,92); c.ballY = rnd(12,88);
    c.dotsA = c.dotsA.map(()=>({x:rnd(5,60),y:rnd(8,92)}));
    c.dotsB = c.dotsB.map(()=>({x:rnd(40,95),y:rnd(8,92)}));
    updateDom(c);

    const baseChance = 0.05;
    const chanceA = baseChance + Math.max(0, diff)/900 + (c.strA/4000);
    const chanceB = baseChance + Math.max(0, -diff)/900 + (c.strB/4000);
    const roll = Math.random();
    let scored = null;
    if(roll < chanceA) scored='A';
    else if(roll < chanceA+chanceB) scored='B';

    if(scored){
      const scorerTeam = scored==='A' ? c.teamA : c.teamB;
      const roster = teamFilled(scorerTeam);
      const scorer = roster.length ? roster[rnd(0,roster.length-1)] : {name:'Artilheiro'};
      if(scored==='A') c.scoreA++; else c.scoreB++;
      c.events.push({min:c.minute, goal:true, text:`${scorer.name} (${scorerTeam.name}) balança as redes!`});
      c.ballX = scored==='A' ? 96 : 4; c.ballY = 50;
      updateDom(c);
      flashGoal(scored, `⚽ GOL DE ${scorerTeam.name.toUpperCase()}!`);
    } else if(Math.random() < 0.12){
      const msgs = ['chute para fora','boa defesa do goleiro','cartão amarelo aplicado','cobrança de escanteio','falta perigosa perto da área','substituição tática'];
      c.events.push({min:c.minute, goal:false, text:pick(msgs)});
      updateTicker(c);
    }
    if(c.minute===45 && !c._ht){ c._ht=true; c.events.push({min:45,goal:false,text:'Fim do primeiro tempo — intervalo.'}); updateTicker(c); }

    if(c.minute>=total){
      clearInterval(c.timerId);
      if(c.scoreA===c.scoreB){
        c.events.push({min:90,goal:false,text:'Empate! Vai para os pênaltis.'});
        updateTicker(c);
        setTimeout(()=>runPenalties(c), 500/c.speed);
      } else {
        c.finished = true;
        c.events.push({min:90,goal:false,text:'Apito final!'});
        updateTicker(c);
        showFinishButton();
      }
    }
  };
  scheduleTicker(c, tick, 220);
}
function runPenalties(c){
  c.events.push({min:'PEN', goal:false, text:'Início da disputa de pênaltis.'});
  updateTicker(c);
  let pa=0, pb=0, round=0;
  const tick = ()=>{
    round++;
    const scoreProbA = 0.65 + (c.strA-c.strB)/500;
    const scoreProbB = 0.65 + (c.strB-c.strA)/500;
    const inA = Math.random() < Math.max(0.3, Math.min(0.9, scoreProbA));
    const inB = Math.random() < Math.max(0.3, Math.min(0.9, scoreProbB));
    if(inA) pa++; if(inB) pb++;
    c.events.push({min:'PEN', goal:inA, text:`${c.teamA.name} ${inA?'converte':'perde'} a cobrança (${pa})`});
    c.events.push({min:'PEN', goal:inB, text:`${c.teamB.name} ${inB?'converte':'perde'} a cobrança (${pb})`});
    updateTicker(c);
    if(round>=5 && pa!==pb){
      clearInterval(c.timerId);
      c.penA=pa; c.penB=pb; c.finished=true;
      c.events.push({min:'PEN', goal:false, text:`Fim dos pênaltis: ${pa} x ${pb}.`});
      updateTicker(c);
      showFinishButton();
    }
  };
  scheduleTicker(c, tick, 550);
}
function finishMatch(){
  const c = state.matchCtx;
  const src = c.source;
  let winnerId;
  if(c.scoreA!==c.scoreB) winnerId = c.scoreA>c.scoreB ? c.teamA.id : c.teamB.id;
  else winnerId = (c.penA>c.penB) ? c.teamA.id : c.teamB.id;

  const wc = state.worldCup;
  const m = wc.rounds[src.roundIdx][src.matchIdx];
  m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true; m.winner = winnerId;

  if(src.roundIdx === wc.rounds.length-1){
    wc.champion = winnerId;
  } else {
    const nextRound = wc.rounds[src.roundIdx+1];
    const pairIdx = Math.floor(src.matchIdx/2);
    const slot = src.matchIdx%2===0 ? 'a' : 'b';
    nextRound[pairIdx][slot] = winnerId;
  }
  state.matchCtx = null;
  saveState();
  setView('worldcup');
}

/* ============================= INIT ============================= */
render();
loadState();

   http(s) (GitHub Pages, Netlify, Vercel, etc.). Em file:// ou dentro do preview da

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* sem suporte neste ambiente, ignora */ });
  });
}
