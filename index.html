      ball:{x:L/2,y:CY,vx:0,vy:0,owner:null,lastTeam:'U',lastPlayer:null,passFrom:null,passT:-9,saveT:0},
      ctrl:null, t:0, halfNo:1, state:'ready', stateT:0, score:{U:0,O:0}, goals:[], clock:0, switchT:0, manualT:-9,
      stats:{U:{shots:0,sot:0,saves:0,corners:0},O:{shots:0,sot:0,saves:0,corners:0}}, poss:{U:0,O:0}, charge:0, charging:false, lastLead:{U:0,O:0},
      cam:{x:L/2,y:CY}, uiKey:'', kickTeam:rnd1()<.5?'U':'O', dbg:{tk:0,tks:0,chg:0,passes:0,maxX:{U:0,O:0}}, msg:'', msgT:0, over:false, tickT:0};

  }
  function kickoff(team, first){
    G.all.forEach(p=>{

  function doPass(p, hint, target){

    const lx=t.pos.x+t.v.x*0.38, ly=t.pos.y+t.v.y*0.38, dx=lx-b.x, dy=ly-b.y, d=hyp(dx,dy)||1;

  /* ---------- IA ---------- */
  function steer(p, tx, ty, speedMul, dt){

  function gkAI(p, dt){

    G[opp(p.side)].players.forEach(o=>{ const dx=p.pos.x-o.pos.x, dy=p.pos.y-o.pos.y, d=hyp(dx,dy); if(d<5.5&&d>0.01){ const w=(1-d/5.5)*1.5; gx+=dx/d*w; gy+=dy/d*w; } });

  /* ---------- física / regras ---------- */

  function scoreGoal(team, scorerTeam){
    const b=G.ball; const sc = (b.lastTeam===team)? b.lastPlayer : (G[team].players.find(p=>!p.isGK && p.dpt>.5)||G[team].players[1]);
    let as=null; if(b.passFrom && b.passFrom.side===team && b.passFrom!==sc && G.clock-b.passT<6) as=b.passFrom;
    G.score[team]++;
    const minute = curMinute();
    G.goals.push({team, scorer:sc, assist:as, minute, ownGoal: b.lastTeam!==team});
    G.lastLead = G.lastLead;
    G.state='goal'; G.stateT=2.3; b.owner=null; b.vx=b.vy=0;
    G.msg = `⚽ GOL! ${sc.p.name}`; G.msgT=2.2;
    SFX.play('goal'); G.kickTeam=opp(team);
  }
  function curMinute(){ const half=G.half; return Math.min(90, Math.max(1, Math.round((G.halfNo===1?0:45)+G.t/half*45))); }
  function ballUpdate(dt){
    const b=G.ball;
    if(b.owner){
      const o=b.owner, f=o.face, tx=o.pos.x+f.x*0.85, ty=o.pos.y+f.y*0.85;
      b.x=lerp(b.x,tx,clamp(dt*22,0,1)); b.y=lerp(b.y,ty,clamp(dt*22,0,1)); b.vx=o.v.x; b.vy=o.v.y;
    } else {
      b.x+=b.vx*dt; b.y+=b.vy*dt;
      const fr=Math.exp(-(hyp(b.vx,b.vy)>12?0.4:0.95)*dt); b.vx*=fr; b.vy*=fr; if(hyp(b.vx,b.vy)<0.15){ b.vx=b.vy=0; }
    }
    // goleiros: defesas
    if(!b.owner){
      const sp=hyp(b.vx,b.vy);
      for(const side of ['U','O']){
        const gk=G[side].players.find(p=>p.isGK); if(!gk) continue;
        gk.saveCd=Math.max(0,gk.saveCd-dt);
        const d=hyp(gk.pos.x-b.x,gk.pos.y-b.y);
        if(b.lastTeam!==side && sp>8 && d<1.9+1.5*gk.sk && gk.saveCd<=0){
          gk.saveCd=.6;
          const shooter=b.lastPlayer, shs=shooter?shooter.sk:.3;
          const p=clamp(0.6-(sp-16)*0.022+(gk.sk-shs)*0.35+(side==='O'?(G.diff.gk-1)*0.5:0),.2,.94);
          if(rnd1()<p){
            G.stats[side].saves++; SFX.play('near');
            if(rnd1()<.55){ setOwner(gk); } else { const dy=(b.y<CY?-1:1); b.vx=-b.vx*.25; b.vy=dy*(3+rnd1()*4); b.lastTeam=side; b.lastPlayer=gk; }

    }
    // recepção / interceptação
    if(!b.owner){
      const sp=hyp(b.vx,b.vy); let best=null, bd=1e9;

  function playerPhysics(dt){

      const ax=((p.dvx||0)-p.v.x), ay=((p.dvy||0)-p.v.y), k=clamp(dt*9,0,1);

  function step(dt){

    if(G.state==='goal'){ G.stateT-=dt; if(G.stateT<=0){ kickoff(G.kickTeam,false); } return; }
    if(G.state==='ht'){ G.stateT-=dt; if(G.stateT<=0){ G.halfNo=2; G.t=0; kickoff(opp(G.firstKick||'U')); G.msg='2º tempo!'; G.msgT=1.5; SFX.play('whistle'); } return; }

  /* ---------- resultado → partida normal ---------- */
  function buildResult(){
    const c=G.c, sim=c.sim, uS=G.userSide, oS=uS==='A'?'B':'A', map={U:uS,O:oS};
    sim.score={A:0,B:0}; sim.score[uS]=G.score.U; sim.score[oS]=G.score.O;
    const tot=(G.poss.U+G.poss.O)||1; sim.poss={A:0,B:0}; sim.poss[uS]=Math.round(100*G.poss.U/tot); sim.poss[oS]=100-sim.poss[uS];
    ['U','O'].forEach(k=>{ const s=sim.stats[map[k]]; const g=G.stats[k]; s.shots=g.shots; s.sot=g.sot; s.saves=g.saves; s.corners=g.corners; s.xg=g.sot*0.28+ (g.shots-g.sot)*0.05; });

      if(gl.assist){ const pa=sim.pstats[side][gl.assist.p.id]; if(pa) pa.assists++; }

      if(!entry){ entry={playerId:gl.scorer.p.id,name:gl.scorer.p.name,minutes:[]}; sim.scorers[side].push(entry); }
      entry.minutes.push(String(gl.minute));
      sim.events.push({min:gl.minute,label:String(gl.minute),kind:'goal',goal:true,side,slot:gl.scorer.idx,player:gl.scorer.p.name,assist:gl.assist?gl.assist.p.name:null,
        text:`${gl.scorer.p.name} marca para o ${(side==='A'?c.teamA:c.teamB).name}!${gl.assist?` — assistência de ${gl.assist.p.name}`:''}`,scoreA:run.A,scoreB:run.B});
    });

  /* ---------- desenho ---------- */

    if(visH>=W+6) cam.y=CY; if(visW>=L+8) cam.x=L/2;

  }

    const ov=$('arcOv'); if(!ov) return; ov.style.display='flex';
    ov.innerHTML=`<div class="arc-card"><h2>Fim de jogo</h2><div class="arc-final">${escHtml(G.U.team.name)} <b>${G.score.U} - ${G.score.O}</b> ${escHtml(G.O.team.name)}</div>
      <p class="arc-sub">Finalizações: ${G.stats.U.shots} x ${G.stats.O.shots} · Defesas: ${G.stats.U.saves} x ${G.stats.O.saves}</p>
      ${G.score.U===G.score.O?'<p>Empate! Vai para os pênaltis.</p>':''}
      <div class="arc-row"><button class="btn gold" id="arcFin">Continuar</button></div></div>`;
    $('arcFin').onclick=finishAndClose;
  }
  function onKey(e){
    if(!G) return; const k=e.key.toLowerCase(); let used=true;
    if(k==='arrowleft'||k==='a') keys.left=true; else if(k==='arrowright'||k==='d') keys.right=true;
    else if(k==='arrowup'||k==='w') keys.up=true; else if(k==='arrowdown'||k==='s') keys.down=true;
    else if(k==='shift') keys.sprint=true;
    else if(k===' '){ if(G.state==='ready'){ $('arcGo')&&$('arcGo').click(); } else if(!e.repeat) edge.pass=true; }
    else if(k==='f'||k==='j'){ if(!e.repeat&&!keys.shoot){ keys.shoot=true; edge.shootDown=true; } }
    else if(k==='escape'||k==='p'){ togglePause(); }
    else if(k==='enter'){ if(G.state==='ready'){ $('arcGo')&&$('arcGo').click(); } else if(G.state==='end'){ finishAndClose(); } else used=false; }
    else used=false;
    if(used){ e.preventDefault(); e.stopPropagation(); }
  }
  function onKeyUp(e){
    if(!G) return; const k=e.key.toLowerCase();
    if(k==='arrowleft'||k==='a') keys.left=false; else if(k==='arrowright'||k==='d') keys.right=false;
    else if(k==='arrowup'||k==='w') keys.up=false; else if(k==='arrowdown'||k==='s') keys.down=false;
    else if(k==='shift') keys.sprint=false;
    else if(k==='f'||k==='j'){ keys.shoot=false; edge.shootUp=true; }
  }
  function bindInputs(el){
    window.addEventListener('keydown',onKey,true); window.addEventListener('keyup',onKeyUp,true); window.addEventListener('resize',resize);
    const joyEl=$('arcJoy'), knob=$('arcKnob');
    joyEl.addEventListener('pointerdown',e=>{ if(joy.id!==null) return; joy.id=e.pointerId; joyEl.setPointerCapture(e.pointerId); const r=joyEl.getBoundingClientRect(); joy.ox=e.clientX; joy.oy=e.clientY; knob.style.display='block'; knob.style.left=(e.clientX-r.left-30)+'px'; knob.style.top=(e.clientY-r.top-30)+'px'; knob.style.transform='translate(0,0)'; e.preventDefault(); });
    joyEl.addEventListener('pointermove',e=>{ if(e.pointerId!==joy.id) return; let dx=e.clientX-joy.ox, dy=e.clientY-joy.oy; const m=hyp(dx,dy), max=48; if(m>max){ dx=dx/m*max; dy=dy/m*max; } joy.x=Math.abs(dx)<6&&Math.abs(dy)<6?0:dx/max; joy.y=Math.abs(dx)<6&&Math.abs(dy)<6?0:dy/max; knob.style.transform=`translate(${dx}px,${dy}px)`; });
    const endJoy=e=>{ if(e.pointerId!==joy.id) return; joy.id=null; joy.x=joy.y=0; knob.style.display='none'; };
    joyEl.addEventListener('pointerup',endJoy); joyEl.addEventListener('pointercancel',endJoy);
    const hold=(id,down,up)=>{ const b=$(id); b.addEventListener('pointerdown',e=>{ b.setPointerCapture(e.pointerId); b.classList.add('on'); down(); e.preventDefault(); }); const u=e=>{ b.classList.remove('on'); up(); }; b.addEventListener('pointerup',u); b.addEventListener('pointercancel',u); };
    hold('bPass',()=>{ edge.pass=true; },()=>{});
    hold('bShoot',()=>{ edge.shootDown=true; },()=>{ edge.shootUp=true; });
    hold('bSprint',()=>{ touchBtn.sprint=true; },()=>{ touchBtn.sprint=false; });
    if(!window.__arcVis){ window.__arcVis=true; document.addEventListener('visibilitychange',()=>{ if(document.hidden && G && G.state==='play') togglePause(); }); }
  }
  return {start, dbg:()=>G&&G.dbg, step:(dt)=>step(dt), get G(){return G;}, buildResult, abandon, finishAndClose, kickoff, active:()=>!!G};
})();

/* ============================= INIT ============================= */
render();
initCardTilt();
loadState();

/* Registro do Service Worker (PWA) — só funciona quando os arquivos são hospedados via
   http(s) (GitHub Pages, Netlify, Vercel, etc.). Em file:// ou dentro do preview da
   Claude, o navegador bloqueia Service Workers; o try/catch evita que isso quebre o app. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* sem suporte neste ambiente, ignora */ });
  });
}
