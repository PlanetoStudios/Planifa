/* ============================= MATCH SIMULATION ============================= */
function openMatchGeneric(aId, bId, source){
  const ta = findTeam(aId), tb = findTeam(bId);
  state.matchCtx = {
    source, teamA:ta, teamB:tb,
    scoreA:0, scoreB:0, minute:0, events:[], finished:false,
    speed:(state.settings && state.settings.defaultSpeed) || 1, timerId:null, tickFn:null, tickBaseMs:220,
    strA: teamStrength(ta), strB: teamStrength(tb),
    scorers:{A:[], B:[]}, matchTab:'events',
  };
  setView('match');
  runMatchSimulation();
}
/* Posições da escalação de cada time na partida: time A fica embaixo (goleiro na base,
   atacantes perto do meio), time B fica em cima espelhado — as duas equipes de frente
   uma pra outra num único campo, sem bolinha nem jogadores se movendo sozinhos. */
function matchFormationSlots(team, side){
  const base = buildFormationSlots(team.formation);
  return base.map(sl => side==='A' ? {...sl, y: 50 + sl.y*0.46} : {...sl, y: 50 - sl.y*0.46});
}
function matchSlotHTML(p, slot, side, idx){
  if(!p){
    return `<div class="m-slot" style="left:${slot.x}%; top:${slot.y}%;"><div class="ms-empty"></div><span class="ms-pos">${slot.label}</span></div>`;
  }
  const tier = getTier(p.ovr);
  return `<div class="m-slot" style="left:${slot.x}%; top:${slot.y}%;">
    <div class="ms-card tier-${tier.key}" id="ms-${side}-${idx}"><span class="ms-ovr">${p.ovr}</span></div>
    <span class="ms-name">${escHtml(p.name.split(' ')[0])}</span>
  </div>`;
}
function matchView(){
  const c = state.matchCtx;
  if(!c) return '';
  const speeds = [0.5,1,2,4];
  const slotsA = matchFormationSlots(c.teamA, 'A');
  const slotsB = matchFormationSlots(c.teamB, 'B');
  const pitchA = slotsA.map((sl,i)=>matchSlotHTML(c.teamA.players[i], sl, 'A', i)).join('');
  const pitchB = slotsB.map((sl,i)=>matchSlotHTML(c.teamB.players[i], sl, 'B', i)).join('');
  return `
  <h2 class="section-title">Simulação de Partida</h2>
  <div class="scoreboard">
    <div class="team-name">${crestHTML(c.teamA,38,14)}<span>${c.teamA.name}</span></div>
    <div style="text-align:center;">
      <span class="score-big">${c.scoreA} - ${c.scoreB}</span>
      <span class="clock" id="clockDisplay">${c.minute}'</span>
    </div>
    <div class="team-name right">${crestHTML(c.teamB,38,14)}<span>${c.teamB.name}</span></div>
  </div>
  <div class="speed-row">
    <span class="hint">Velocidade da simulação:</span>
    ${speeds.map(sp=>`<button class="speed-btn ${c.speed===sp?'active':''}" onclick="changeSpeed(${sp})">${sp}x</button>`).join('')}
  </div>
  <div class="pitch match-pitch2" id="pitchEl">
    <div class="pl-out"></div><div class="pl-mid"></div><div class="pl-circle"></div>
    <div class="pl-box top"></div><div class="pl-box bottom"></div><div class="pl-six top"></div><div class="pl-six bottom"></div>
    <div class="goal-banner" id="goalBanner"></div>
    ${pitchB}${pitchA}
  </div>
  <div class="tabs-mini">
    <button class="${c.matchTab==='events'?'active':''}" onclick="state.matchCtx.matchTab='events';render();">📋 Eventos</button>
    <button class="${c.matchTab==='scorers'?'active':''}" onclick="state.matchCtx.matchTab='scorers';render();">⚽ Artilheiros</button>
  </div>
  ${c.matchTab==='events'
    ? `<div class="ticker" id="tickerEl">${renderTickerEvents(c)}</div>`
    : `<div id="scorersEl">${scorersTabHTML(c)}</div>`}
  <div class="btn-row" id="matchBtnRow" style="margin-top:14px;justify-content:center;">
    ${c.finished ? `<button class="btn gold" onclick="finishMatch()">Confirmar resultado e voltar</button>` : `<span class="hint">Simulando... aguarde o apito final.</span>`}
  </div>`;
}
function scorerLineHTML(entry){
  return `<div class="scorer-line"><b>${escHtml(entry.name)}</b> ${entry.minutes.map(m=>m+'’').join(' ')}</div>`;
}
function scorersTabHTML(c){
  const sideHTML = (team, list)=>`<div class="panel" style="margin-bottom:10px;">
    <h4 class="settings-panel-title">${escHtml(team.name)}</h4>
    ${list.length ? list.map(scorerLineHTML).join('') : '<p class="hint" style="margin:0;">Nenhum gol ainda.</p>'}
  </div>`;
  return sideHTML(c.teamA, c.scorers.A) + sideHTML(c.teamB, c.scorers.B);
}
function renderTickerEvents(c){
  return c.events.slice().reverse().map(e=>`<div class="ev ${e.goal?'goal':''}">${e.min}' — ${e.goal?'⚽ <b>GOL!</b> ':''}${e.text}</div>`).join('');
}
function scheduleTicker(c, fn, baseMs){
  c.tickFn = fn; c.tickBaseMs = baseMs;
  if(c.timerId) clearInterval(c.timerId);
  c.timerId = setInterval(fn, baseMs / c.speed);
}
function changeSpeed(spd){
  const c = state.matchCtx; if(!c) return;
  c.speed = spd;
  if(c.timerId && c.tickFn){ clearInterval(c.timerId); c.timerId = setInterval(c.tickFn, c.tickBaseMs / c.speed); }
  render();
}
function updateTicker(c){
  if(c.matchTab!=='events') return;
  const t = document.getElementById('tickerEl');
  if(t) t.innerHTML = renderTickerEvents(c);
}
function updateScorersPanel(c){
  if(c.matchTab!=='scorers') return;
  const el = document.getElementById('scorersEl');
  if(el) el.innerHTML = scorersTabHTML(c);
}
function showFinishButton(){
  const holder = document.getElementById('matchBtnRow');
  if(holder) holder.innerHTML = `<button class="btn gold" onclick="finishMatch()">Confirmar resultado e voltar</button>`;
}
/* Sorteia qual jogador do time marcou, com viés realista: atacantes e pontas
   marcam bem mais que zagueiros e goleiro. */
function pickScorerSlot(team){
  const idxs = [];
  team.players.forEach((p,i)=>{ if(p) idxs.push(i); });
  if(!idxs.length) return null;
  const weightFor = (pos)=>{
    if(pos==='ATA') return 6;
    if(pos==='PON') return 4;
    if(pos==='MEI') return 2;
    if(pos==='VOL') return 1;
    if(pos==='LAT') return 1;
    if(pos==='ZAG') return 0.4;
    if(pos==='GOL') return 0.05;
    return 1;
  };
  const bag = [];
  idxs.forEach(i=>{ const w = Math.max(1, Math.round(weightFor(team.players[i].pos)*3)); for(let k=0;k<w;k++) bag.push(i); });
  return pick(bag);
}
function recordGoal(c, side, player, minute){
  const list = c.scorers[side];
  let entry = list.find(e=>e.playerId===player.id);
  if(!entry){ entry = {playerId:player.id, name:player.name, minutes:[]}; list.push(entry); }
  entry.minutes.push(minute);
}
/* Destaca por 1 segundo o jogador que marcou (sem mover ninguém pelo campo) e mostra
   um aviso rápido de gol — nada de bolinha "chegando" num lugar que não bate com o resultado. */
function flashGoalPlayer(side, slotIdx, teamName, playerName){
  if(slotIdx!==null && slotIdx!==undefined){
    const el = document.getElementById(`ms-${side}-${slotIdx}`);
    if(el){ el.classList.add('scored'); setTimeout(()=>{ el.classList.remove('scored'); }, 1000); }
  }
  const banner = document.getElementById('goalBanner');
  if(banner){
    banner.textContent = `⚽ GOL! ${playerName} (${teamName})`;
    banner.classList.add('show');
    setTimeout(()=>banner.classList.remove('show'), 1300);
  }
}
function runMatchSimulation(){
  const c = state.matchCtx;
  const total = 90;
  const diff = c.strA - c.strB;
  const tick = ()=>{
    if(!state.matchCtx || state.matchCtx!==c){ clearInterval(c.timerId); return; }
    c.minute += 2;
    const clockEl = document.getElementById('clockDisplay');
    if(clockEl) clockEl.textContent = c.minute+"'";

    const baseChance = 0.05;
    const chanceA = baseChance + Math.max(0, diff)/900 + (c.strA/4000);
    const chanceB = baseChance + Math.max(0, -diff)/900 + (c.strB/4000);
    const roll = Math.random();
    let scored = null;
    if(roll < chanceA) scored='A';
    else if(roll < chanceA+chanceB) scored='B';

    if(scored){
      const scorerTeam = scored==='A' ? c.teamA : c.teamB;
      const slotIdx = pickScorerSlot(scorerTeam);
      const scorer = (slotIdx!==null) ? scorerTeam.players[slotIdx] : {id:'anon-'+c.minute, name:'Artilheiro'};
      if(scored==='A') c.scoreA++; else c.scoreB++;
      recordGoal(c, scored, scorer, c.minute);
      c.events.push({min:c.minute, goal:true, text:`${scorer.name} (${scorerTeam.name}) balança as redes!`});
      updateTicker(c);
      updateScorersPanel(c);
      const sb = document.querySelector('.score-big');
      if(sb) sb.textContent = `${c.scoreA} - ${c.scoreB}`;
      flashGoalPlayer(scored, slotIdx, scorerTeam.name, scorer.name);
    } else if(Math.random() < 0.12){
      const msgs = ['chute para fora','boa defesa do goleiro','cartão amarelo aplicado','cobrança de escanteio','falta perigosa perto da área','substituição tática'];
      c.events.push({min:c.minute, goal:false, text:pick(msgs)});
      updateTicker(c);
    }
    if(c.minute===45 && !c._ht){ c._ht=true; c.events.push({min:45,goal:false,text:'Fim do primeiro tempo — intervalo.'}); updateTicker(c); }

    if(c.minute>=total){
      clearInterval(c.timerId);
      if(c.scoreA===c.scoreB){
        c.events.push({min:90,goal:false,text:'Empate! Vai para os pênaltis.'});
        updateTicker(c);
        setTimeout(()=>runPenalties(c), 500/c.speed);
      } else {
        c.finished = true;
        c.events.push({min:90,goal:false,text:'Apito final!'});
        updateTicker(c);
        showFinishButton();
      }
    }
  };
  scheduleTicker(c, tick, 220);
}
function runPenalties(c){
  c.events.push({min:'PEN', goal:false, text:'Início da disputa de pênaltis.'});
  updateTicker(c);
  let pa=0, pb=0, round=0;
  const tick = ()=>{
    round++;
    const scoreProbA = 0.65 + (c.strA-c.strB)/500;
    const scoreProbB = 0.65 + (c.strB-c.strA)/500;
    const inA = Math.random() < Math.max(0.3, Math.min(0.9, scoreProbA));
    const inB = Math.random() < Math.max(0.3, Math.min(0.9, scoreProbB));
    if(inA) pa++; if(inB) pb++;
    c.events.push({min:'PEN', goal:inA, text:`${c.teamA.name} ${inA?'converte':'perde'} a cobrança (${pa})`});
    c.events.push({min:'PEN', goal:inB, text:`${c.teamB.name} ${inB?'converte':'perde'} a cobrança (${pb})`});
    updateTicker(c);
    if(round>=5 && pa!==pb){
      clearInterval(c.timerId);
      c.penA=pa; c.penB=pb; c.finished=true;
      c.events.push({min:'PEN', goal:false, text:`Fim dos pênaltis: ${pa} x ${pb}.`});
      updateTicker(c);
      showFinishButton();
    }
  };
  scheduleTicker(c, tick, 550);
}
function finishMatch(){
  const c = state.matchCtx;
  const src = c.source;
  let winnerId;
  if(c.scoreA!==c.scoreB) winnerId = c.scoreA>c.scoreB ? c.teamA.id : c.teamB.id;
  else winnerId = (c.penA>c.penB) ? c.teamA.id : c.teamB.id;

  // amistoso (não afeta nenhuma copa, é só um jogo avulso entre dois times)
  if(src.friendly){
    if(!state.friendly) state.friendly = {teamA:null, teamB:null};
    state.friendly.lastResult = {
      teamA: c.teamA.id, teamB: c.teamB.id,
      scoreA: c.scoreA, scoreB: c.scoreB,
      draw: c.scoreA===c.scoreB,
      penA: c.penA, penB: c.penB,
    };
    state.matchCtx = null;
    setView('friendly');
    return;
  }

  // partida de pontos corridos da liga
  if(src.leagueMatchId){
    const lg = state.league;
    const m = lg.matches.find(x=>x.id===src.leagueMatchId);
    m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true;
    state.matchCtx = null;
    saveState();
    setView('league');
    return;
  }

  // mata-mata da liga
  if(src.leagueRoundIdx !== undefined){
    const lg = state.league;
    const m = lg.knockoutRounds[src.leagueRoundIdx][src.leagueMatchIdx];
    m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true; m.winner = winnerId;
    if(src.leagueRoundIdx === lg.knockoutRounds.length-1){
      lg.champion = winnerId;
      lg.phase = 'done';
    } else {
      const nextRound = lg.knockoutRounds[src.leagueRoundIdx+1];
      const pairIdx = Math.floor(src.leagueMatchIdx/2);
      const slot = src.leagueMatchIdx%2===0 ? 'a' : 'b';
      nextRound[pairIdx][slot] = winnerId;
    }
    state.matchCtx = null;
    saveState();
    setView('league');
    return;
  }

  const wc = state.worldCup;

  // partida da fase de grupos
  if(src.groupId){
    const g = wc.groups.find(x=>x.id===src.groupId);
    const m = g.matches.find(x=>x.id===src.matchId);
    m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true;
    state.matchCtx = null;
    saveState();
    setView('worldcup');
    return;
  }

  // disputa de 3º lugar
  if(src.thirdPlace){
    const m = wc.thirdPlaceMatch;
    m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true; m.winner = winnerId;
    state.matchCtx = null;
    saveState();
    setView('worldcup');
    return;
  }

  // chaveamento normal (mata-mata)
  const m = wc.rounds[src.roundIdx][src.matchIdx];
  m.scoreA = c.scoreA; m.scoreB = c.scoreB; m.played = true; m.winner = winnerId;

  if(src.roundIdx === wc.rounds.length-1){
    wc.champion = winnerId;
  } else {
    const nextRound = wc.rounds[src.roundIdx+1];
    const pairIdx = Math.floor(src.matchIdx/2);
    const slot = src.matchIdx%2===0 ? 'a' : 'b';
    nextRound[pairIdx][slot] = winnerId;

    // a disputa de 3º lugar nasce assim que a semifinal (penúltima rodada) termina
    if(wc.thirdPlace && !wc.thirdPlaceMatch && src.roundIdx === wc.rounds.length-2){
      const semis = wc.rounds[src.roundIdx];
      if(semis.every(x=>x.played)){
        const loserOf = (mm)=> mm.winner===mm.a ? mm.b : mm.a;
        wc.thirdPlaceMatch = { a: loserOf(semis[0]), b: loserOf(semis[1]), scoreA:null, scoreB:null, played:false, winner:null };
      }
    }
  }
  state.matchCtx = null;
  saveState();
  setView('worldcup');
}

/* ============================= INIT ============================= */
render();
initCardTilt();
loadState();

/* Registro do Service Worker (PWA) — só funciona quando os arquivos são hospedados via
   http(s) (GitHub Pages, Netlify, Vercel, etc.). Em file:// ou dentro do preview da
   Claude, o navegador bloqueia Service Workers; o try/catch evita que isso quebre o app. */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* sem suporte neste ambiente, ignora */ });
  });
}
