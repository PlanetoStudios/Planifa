<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planifa</title>
<meta name="description" content="Planifa 1 — sandbox de cartas de futebol: monte times, crie jogadores e dispute copas.">
<meta name="theme-color" content="#081310">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planifa 1">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#081310;
  --panel:#0f1c17;
  --panel2:#132720;
  --line:#1e352b;
  --text:#eaf2ec;
  --sub:#8fa89c;
  --gold:#e8b34a;
  --accent:#29d398; --accent-r:41; --accent-g:211; --accent-b:152;
  --emerald:var(--accent);
  --violet:#a25bff;
  --red:#e2544a;
  --tier-brown-a:#2b1c12; --tier-brown-b:#4a2f1a;
  --tier-bronze-a:#7a4a22; --tier-bronze-b:#a66a34;
  --tier-silver-a:#9aa4ab; --tier-silver-b:#e3e9ec;
  --tier-gold-a:#c98f22; --tier-gold-b:#ffd776;
  --tier-diamond-a:#1fa8c9; --tier-diamond-b:#a6f3ff;
  --tier-purple-a:#5a189a; --tier-purple-b:#c48bff;
  --surface-grad:linear-gradient(160deg,rgba(26,50,41,.85),rgba(12,24,19,.92));
  --surface-grad-v:linear-gradient(180deg,rgba(26,50,41,.92),rgba(13,27,21,.92));
  --panel-border:rgba(255,255,255,.07);
  --input-bg:rgba(0,0,0,.28);
  --input-border:rgba(255,255,255,.1);
  --overlay-soft:rgba(0,0,0,.25);
  --tier-white-a:#c7cdd3; --tier-white-b:#ffffff;
  --tier-wine-a:#2b060c; --tier-wine-b:#7d1f30;
  --tier-neon-a:#ff2079; --tier-neon-b:#18f7ff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse 900px 500px at 20% -10%, rgba(var(--accent-r),var(--accent-g),var(--accent-b),.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 100% 0%, rgba(232,179,74,.08), transparent 55%),
    var(--ink);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 80px;}

/* ---- topbar ---- */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;margin-bottom:22px;border-radius:14px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);flex-wrap:wrap;gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--emerald);box-shadow:0 0 12px var(--emerald);}
.brand h1{font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:26px;letter-spacing:.5px;margin:0;text-transform:uppercase;}
.brand h1 span{color:var(--gold);}
.brand small{display:block;color:var(--sub);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:-2px;}
/* ---- botão hambúrguer (três barrinhas) ---- */
.hamburger-btn{
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
  width:42px;height:42px;background:transparent;border:1px solid var(--line);
  border-radius:10px;cursor:pointer;flex-shrink:0;transition:.15s;
}
.hamburger-btn span{display:block;width:20px;height:2px;background:var(--text);border-radius:2px;transition:.2s;}
.hamburger-btn:hover{border-color:var(--emerald);}
.hamburger-btn:hover span{background:var(--emerald);}

/* ---- sidebar (menu vertical) ---- */
.sidebar-overlay{
  position:fixed;inset:0;background:rgba(3,8,6,.6);opacity:0;pointer-events:none;
  transition:opacity .2s ease;z-index:40;
}
.sidebar-overlay.show{opacity:1;pointer-events:auto;}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:280px;max-width:82vw;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border-right:1px solid var(--line);
  transform:translateX(-100%);transition:transform .25s ease;
  z-index:50;display:flex;flex-direction:column;
  box-shadow:12px 0 32px rgba(0,0,0,.45);
}
.sidebar.open{transform:translateX(0);}
.sidebar-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:18px 16px 14px;border-bottom:1px solid var(--line);
}
.sidebar-header h1{font-size:20px !important;}
.sidebar-close{
  background:transparent;border:1px solid var(--line);color:var(--sub);
  border-radius:8px;width:32px;height:32px;cursor:pointer;flex-shrink:0;font-size:14px;
}
.sidebar-close:hover{border-color:var(--red);color:var(--red);}
.sidebar-links{display:flex;flex-direction:column;padding:12px;gap:3px;overflow-y:auto;}
.sidebar-links button{
  display:flex;align-items:center;gap:12px;background:transparent;border:none;
  color:var(--sub);padding:13px 14px;border-radius:10px;font-size:14.5px;font-weight:600;
  cursor:pointer;text-align:left;transition:.15s;width:100%;
}
.sidebar-links button .nav-icon{font-size:18px;line-height:1;width:22px;text-align:center;}
.sidebar-links button:hover{background:rgba(255,255,255,.06);color:var(--text);}
.sidebar-links button.active{background:var(--emerald);color:#052018;}
.sidebar-divider{height:1px;background:var(--line);margin:8px 10px;}

/* ---- home stats bar ---- */
.stats-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.stat-chip{
  flex:1;min-width:110px;background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:center;
}
.stat-num{display:block;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:24px;color:var(--gold);}
.stat-label{display:block;font-size:10.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}

/* ---- escolha de dispositivo ---- */
.device-pick{max-width:560px;margin:30px auto;}
.device-options{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:22px;}
.device-card{
  flex:1;min-width:200px;background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1.5px solid var(--line);border-radius:16px;padding:28px 20px;text-align:center;
  cursor:pointer;transition:.15s;
}
.device-card:hover{border-color:var(--gold);transform:translateY(-3px);}
.device-card.sel{border-color:var(--emerald);box-shadow:0 0 0 2px var(--emerald);}
.device-icon{font-size:44px;margin-bottom:10px;}
.device-card h3{margin:0 0 6px;}

/* ---- ajustes por tipo de dispositivo ---- */
body.device-mobile .grid.teams{grid-template-columns:repeat(auto-fill,minmax(145px,1fr));}
body.device-mobile .grid.players{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));}
body.device-mobile .sidebar{width:260px;}
body.device-mobile .btn,
body.device-mobile .btn.secondary,
body.device-mobile .btn.gold,
body.device-mobile .btn.danger{padding:12px 20px;font-size:14px;}
body.device-mobile .wrap{padding:14px 12px 70px;}
body.device-mobile .pitch.lineup{height:560px;}

body.device-desktop .wrap{max-width:1320px;}
body.device-desktop .grid.teams{grid-template-columns:repeat(auto-fill,minmax(235px,1fr));}
body.device-desktop .grid.players{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));}

h2.section-title{
  font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:30px;
  text-transform:uppercase;letter-spacing:.5px;margin:6px 0 16px;
}
p.section-sub{color:var(--sub);margin:-10px 0 20px;font-size:14px;}

.grid{display:grid;gap:14px;}
.grid.teams{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));}
.grid.players{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}

/* ---- team tile ---- */
.team-tile{
  background:linear-gradient(160deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;
  transition:.15s;position:relative;overflow:hidden;
}
.team-tile:hover{border-color:var(--gold);transform:translateY(-2px);}
.team-tile .crest{
  width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:'Big Shoulders Display',sans-serif;font-weight:800;font-size:18px;color:#04140f;margin-bottom:10px;
}
.team-tile h3{margin:0 0 4px;font-size:16px;}
.team-tile .meta{color:var(--sub);font-size:12px;}
.team-tile .custom-badge{position:absolute;top:12px;right:12px;font-size:10px;background:var(--violet);color:#fff;padding:2px 8px;border-radius:999px;letter-spacing:.5px;}

/* ---- player card (grids / catalog / modals) ---- */

.tier-brown{background:linear-gradient(160deg,var(--tier-brown-b),var(--tier-brown-a));color:#e7d8c9;}
.tier-bronze{background:linear-gradient(160deg,var(--tier-bronze-b),var(--tier-bronze-a));color:#2c1806;}
.tier-silver{background:linear-gradient(160deg,var(--tier-silver-b),var(--tier-silver-a));color:#1a2226;}
.tier-gold{background:linear-gradient(160deg,var(--tier-gold-b),var(--tier-gold-a));color:#2c1c00;}
.tier-diamond{background:linear-gradient(160deg,var(--tier-diamond-b),var(--tier-diamond-a));color:#022430;}
.tier-purple{background:linear-gradient(160deg,var(--tier-purple-b),var(--tier-purple-a));color:#fff;box-shadow:0 0 22px rgba(162,91,255,.55);}
.tier-white{background:linear-gradient(160deg,var(--tier-white-b),var(--tier-white-a));color:#1a2226;box-shadow:0 0 16px rgba(255,255,255,.5);}
.tier-wine{background:linear-gradient(160deg,var(--tier-wine-b),var(--tier-wine-a));color:#f3dbe0;box-shadow:0 0 18px rgba(125,31,48,.6);}
.tier-neon{background:linear-gradient(135deg,var(--tier-neon-a),var(--tier-neon-b));color:#051014;
  animation:neon-pulse 1.8s ease-in-out infinite;}
.tier-rainbow{background:linear-gradient(135deg,#ff004c,#ff8c00,#ffee00,#2bff00,#00e5ff,#7a00ff,#ff00c8);
  background-size:220% 220%;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5);
  animation:rainbow-shift 5s linear infinite;box-shadow:0 0 24px rgba(255,255,255,.4);}
@keyframes neon-pulse{
  0%,100%{box-shadow:0 0 12px rgba(255,32,121,.65),0 0 12px rgba(24,247,255,.45);}
  50%{box-shadow:0 0 24px rgba(255,32,121,.95),0 0 24px rgba(24,247,255,.75);}
}
@keyframes rainbow-shift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

/* ---- mercado de transferências ---- */
.tr-row{display:flex;align-items:center;gap:12px;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;}
.tr-badge{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.tr-badge.sign{background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.18);}
.tr-badge.release{background:rgba(226,84,74,.18);}
.tr-badge.new{background:rgba(232,179,74,.18);}
.tr-badge.retire{background:rgba(143,168,156,.18);}
.tr-badge.value{background:rgba(162,91,255,.2);}
.tr-main{flex:1;min-width:0;}
.tr-title{font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.tr-ovr{position:relative;display:inline-block;padding:1px 7px;border-radius:7px;font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:800;}
.tr-ovr::after{border-radius:inherit !important;}
.tr-sub{font-size:12px;color:var(--sub);margin-top:3px;}
.tr-side{text-align:right;flex-shrink:0;}
.tr-value{font-family:'JetBrains Mono',monospace;font-weight:800;color:var(--gold);font-size:14px;}
.tr-time{font-size:10.5px;color:var(--sub);margin-top:2px;}
.market-scroll{overflow-x:auto;}
.market-scroll table.standings{min-width:520px;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;}
.legend .chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--sub);}
.legend .sw{width:14px;height:14px;border-radius:4px;}

/* ---- forms / panels ---- */
.panel{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.field input[type=text],.field select,.field input[type=number]{
  width:100%;background:var(--ink);border:1px solid var(--line);color:var(--text);
  padding:10px 12px;border-radius:8px;font-size:14px;font-family:inherit;
}
.field input[type=range]{width:100%;accent-color:var(--gold);}
.ovr-number-full{width:100%;font-size:16px;font-weight:700;font-family:'JetBrains Mono',monospace;}
.ovr-warning{color:var(--red);font-size:12px;margin:6px 0 0;}
.value-input-row{display:flex;gap:8px;align-items:center;}
.value-input-row input{flex:1;}
.value-input-row .btn{flex-shrink:0;white-space:nowrap;}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row .field{flex:1;min-width:160px;}
.btn{
  background:var(--emerald);color:#052018;border:none;padding:10px 18px;border-radius:8px;
  font-weight:700;font-size:13px;cursor:pointer;letter-spacing:.3px;
}
.btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn.gold{background:var(--gold);color:#2c1c00;}
.btn.danger{background:var(--red);color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;}

.color-swatches{display:flex;gap:8px;flex-wrap:wrap;}
.color-swatches div{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.color-swatches div.sel{border-color:#fff;}

.modal-bg{position:fixed;inset:0;background:rgba(3,8,6,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
.modal{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;}
.modal h3{margin-top:0;font-family:'Big Shoulders Display',sans-serif;text-transform:uppercase;font-size:22px;}

/* ---- pitch (shared base) ---- */
.pitch{
  position:relative;border-radius:14px;overflow:hidden;margin-bottom:16px;
  background:
   repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 60px),
   linear-gradient(180deg,#0e3d27,#0a2a1b);
  border:1px solid var(--line);
}
.pitch.match-pitch{height:270px;}
.pitch.match-pitch2{height:480px;}
.pitch.lineup{height:500px;}
.goal-banner{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
  font-family:'Big Shoulders Display',sans-serif;font-size:26px;font-weight:800;color:var(--gold);
  text-shadow:0 0 20px rgba(232,179,74,.9);opacity:0;pointer-events:none;letter-spacing:.5px;
  transition:opacity .25s, transform .25s;text-align:center;z-index:9;text-transform:uppercase;
  padding:0 16px;white-space:nowrap;
}
.goal-banner.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

/* ---- escalação dos dois times na partida ---- */
.m-slot{position:absolute;transform:translate(-50%,-50%);width:56px;text-align:center;z-index:2;}
.ms-card{width:34px;height:34px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;
  font-family:'JetBrains Mono',monospace;font-weight:800;font-size:11.5px;border:2px solid rgba(255,255,255,.55);
  box-shadow:0 3px 6px rgba(0,0,0,.4);transition:transform .25s ease, box-shadow .25s ease;}
.ms-name{display:block;margin-top:3px;font-size:8.5px;font-weight:700;color:#eef2ee;text-shadow:0 1px 3px rgba(0,0,0,.85);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56px;}
.ms-pos{display:block;font-size:7px;color:rgba(255,255,255,.55);margin-top:1px;}
.ms-empty{width:30px;height:30px;border-radius:50%;margin:0 auto;border:2px dashed rgba(255,255,255,.3);background:rgba(255,255,255,.05);}
.ms-card.scored{transform:scale(1.55);z-index:6;border-color:var(--accent);
  box-shadow:0 0 0 6px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.45), 0 0 22px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.95);}
.scorer-line{padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;color:var(--sub);}
.scorer-line:last-child{border-bottom:none;}
.scorer-line b{color:var(--text);}

.empty-slot{
  border:1.5px dashed var(--line);border-radius:14px;min-height:190px;
  display:flex;align-items:center;justify-content:center;color:var(--sub);
  cursor:pointer;font-size:28px;transition:.15s;
}
.empty-slot:hover{border-color:var(--emerald);color:var(--emerald);}

/* ---- world cup ---- */
.bracket-round{margin-bottom:22px;}
.bracket-round h4{font-family:'Big Shoulders Display',sans-serif;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-size:16px;margin-bottom:10px;}
.match-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;
}
.match-row .side{display:flex;align-items:center;gap:8px;flex:1;font-weight:600;font-size:14px;}
.match-row .side.right{justify-content:flex-end;}
.match-row .crest-mini{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#04140f;flex-shrink:0;}
.match-row .score{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;min-width:60px;text-align:center;color:var(--gold);}
.match-row .vs{color:var(--sub);font-size:11px;}

/* ---- match viewer ---- */
.scoreboard{
  display:flex;align-items:center;justify-content:space-between;background:var(--ink);
  border:1px solid var(--line);border-radius:14px;padding:18px 24px;margin-bottom:14px;
}
.scoreboard .team-name{font-family:'Big Shoulders Display',sans-serif;font-size:20px;text-transform:uppercase;font-weight:800;flex:1;}
.scoreboard .team-name.right{text-align:right;}
.scoreboard .score-big{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:700;color:var(--gold);letter-spacing:4px;padding:0 22px;}
.scoreboard .clock{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--emerald);text-align:center;display:block;margin-top:4px;}

.speed-row{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.speed-btn{background:transparent;border:1px solid var(--line);color:var(--sub);padding:6px 14px;border-radius:8px;
  cursor:pointer;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;}
.speed-btn.active{background:var(--gold);color:#2c1c00;border-color:var(--gold);}

.ticker{
  background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;
  height:190px;overflow-y:auto;display:flex;flex-direction:column-reverse;font-size:13px;
}
.ticker .ev{padding:5px 0;border-bottom:1px dashed var(--line);color:var(--sub);}
.ticker .ev b{color:var(--text);}
.ticker .ev.goal{color:var(--gold);}
.ticker .ev.goal b{color:var(--gold);}

.tabs-mini{display:flex;gap:8px;margin-bottom:14px;}
.tabs-mini button{background:transparent;border:1px solid var(--line);color:var(--sub);padding:6px 14px;border-radius:8px;font-size:12px;cursor:pointer;}
.tabs-mini button.active{background:var(--panel2);color:var(--text);border-color:var(--gold);}

.hint{color:var(--sub);font-size:12.5px;line-height:1.5;}
.checkbox-team{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:13px;}
.checkbox-team.sel{border-color:var(--emerald);}
.checkbox-team .crest-mini{width:20px;height:20px;border-radius:5px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#04140f;flex-shrink:0;}

.champion-banner{
  text-align:center;padding:40px 20px;background:linear-gradient(160deg,var(--tier-purple-b),var(--tier-purple-a));
  border-radius:16px;color:#fff;box-shadow:0 0 40px rgba(162,91,255,.5);
}
.champion-banner h2{font-family:'Big Shoulders Display',sans-serif;font-size:40px;text-transform:uppercase;margin:6px 0;}
.champion-banner .trophy{font-size:52px;}

.size-row{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.catalog-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px;}
.catalog-controls .field{margin-bottom:0;min-width:150px;}
.catalog-controls .field.search{flex:2;min-width:200px;}

/* ---- painel de filtros (catálogo, mercado, escalação) ---- */
.filter-panel{background:var(--surface-grad);border:1px solid var(--panel-border);border-radius:16px;padding:16px 18px;margin-bottom:16px;}
.filter-panel.modal-filter{padding:14px 16px;margin:0 0 12px;}
.filter-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px;flex-wrap:wrap;gap:8px;}
.filter-head a{color:var(--accent);font-size:12.5px;font-weight:700;cursor:pointer;}
.filter-head a:hover{text-decoration:underline;}
.filter-count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 5px;
  border-radius:999px;background:var(--accent);color:#04140f;font-size:11px;font-weight:800;margin-left:6px;vertical-align:middle;}
.filter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.filter-grid .field{margin-bottom:0;}
.filter-grid .field.search{grid-column:span 2;}
body.device-mobile .filter-grid .field.search{grid-column:span 1;}
.catalog-count{color:var(--sub);font-size:12.5px;margin-bottom:14px;}

table.standings{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:4px;}
table.standings th{text-align:left;color:var(--sub);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;font-size:10.5px;letter-spacing:.5px;}
table.standings td{padding:7px 8px;border-bottom:1px dashed var(--line);}
table.standings tr.qualified{background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.08);}
table.standings tr.qualified td:first-child{color:var(--emerald);font-weight:700;}

/* ---- team selection mode ---- */
.team-tile.tile-selected{border-color:var(--emerald);box-shadow:0 0 0 2px var(--emerald);}
.sel-check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;
  border:1.5px solid var(--line);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--emerald);font-weight:800;}

/* ---- real bracket tree ---- */
.bracket-scroll{overflow-x:auto;overflow-y:hidden;padding:36px 4px 16px;margin-bottom:10px;}
.bracket-canvas{position:relative;}
.bracket-roundlabel{position:absolute;top:-28px;font-family:'Big Shoulders Display',sans-serif;
  text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-size:14px;text-align:center;}
.bracket-match{position:absolute;transform:translateY(-50%);background:var(--ink);border:1px solid var(--line);
  border-radius:8px;overflow:hidden;z-index:2;}
.bracket-match.playable{cursor:pointer;border-color:var(--gold);}
.bracket-match.playable:hover{box-shadow:0 0 0 2px var(--gold);}
.row-team{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11.5px;font-weight:600;height:50%;}
.row-team:first-child{border-bottom:1px solid var(--line);}
.row-team.tbd{color:var(--sub);font-style:italic;font-weight:400;justify-content:center;}
.row-team.winner{background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.14);color:var(--emerald);}
.crest-tiny{width:16px;height:16px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#04140f;}
.row-team .rt-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.row-team .sc{font-family:'JetBrains Mono',monospace;font-weight:700;}
.play-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);
  color:var(--gold);font-size:11px;font-weight:700;opacity:0;transition:opacity .15s;}
.bracket-match.playable:hover .play-hint{opacity:1;}
.conn-h{position:absolute;height:2px;background:var(--line);}
.conn-v{position:absolute;width:2px;background:var(--line);}

.save-toast{position:fixed;bottom:16px;right:16px;background:var(--panel2);border:1px solid var(--emerald);color:var(--emerald);
  padding:8px 14px;border-radius:8px;font-size:12px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;}
.save-toast.show{opacity:1;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

/* =====================================================================
   REPAGINAÇÃO v2 — interface, cartas e times
   ===================================================================== */
:root{--shadow-lg:0 18px 40px rgba(0,0,0,.45);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.view-enter{animation:fadeUp .35s ease both;}

body{
  background:
    radial-gradient(ellipse 900px 520px at 15% -10%, rgba(var(--accent-r),var(--accent-g),var(--accent-b),.15), transparent 60%),
    radial-gradient(ellipse 700px 520px at 100% 0%, rgba(232,179,74,.10), transparent 55%),
    radial-gradient(ellipse 600px 420px at 50% 115%, rgba(162,91,255,.09), transparent 60%),
    linear-gradient(rgba(255,255,255,.014) 1px, transparent 1px) 0 0/100% 40px,
    var(--ink);
  background-attachment:fixed;
}

/* ---- topbar ---- */
.topbar{
  background:var(--surface-grad-v);
  border:1px solid rgba(255,255,255,.08);padding:12px 16px;border-radius:18px;
  box-shadow:var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.07);
}
.brand .logo{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
  background:linear-gradient(135deg,#ffd067,#b8741a);box-shadow:0 6px 16px rgba(232,179,74,.4), inset 0 1px 0 rgba(255,255,255,.5);}
.topbar-right{display:flex;align-items:center;gap:10px;}
.page-chip{padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--sub);text-transform:uppercase;}
.hamburger-btn{border-radius:12px;background:rgba(255,255,255,.04);}

/* ---- sidebar ---- */
.sidebar{background:var(--surface-grad-v);width:292px;}
.sb-group{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#5f7a6d;font-weight:700;padding:14px 14px 4px;}
.sidebar-links button.active{background:linear-gradient(90deg,rgba(var(--accent-r),var(--accent-g),var(--accent-b),.28),rgba(var(--accent-r),var(--accent-g),var(--accent-b),.04));color:#fff;box-shadow:inset 3px 0 0 var(--emerald);}
.sidebar-links button:hover{background:rgba(255,255,255,.07);}
.sidebar-footer{margin-top:auto;padding:12px;border-top:1px solid var(--line);}
.sidebar-footer .mini{font-size:11px;color:var(--sub);padding:8px 14px 2px;line-height:1.5;}

/* ---- títulos e texto ---- */
h2.section-title{position:relative;padding-left:16px;font-size:32px;}
h2.section-title::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:5px;border-radius:4px;background:linear-gradient(180deg,var(--gold),var(--emerald));}
p.section-sub{padding-left:16px;}
.device-pick h2.section-title{padding-left:0;}
.device-pick h2.section-title::before{display:none;}
.panel h2.section-title{padding-left:0;}
.panel h2.section-title::before{display:none;}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px;}
.sec-head h3{margin:0;font-family:'Big Shoulders Display',sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.8px;}
.sec-head h3 span{color:var(--gold);}
.sec-head a{color:var(--emerald);font-size:12.5px;font-weight:700;cursor:pointer;}

/* ---- barra de sub-navegação (páginas irmãs do grupo atual) ---- */
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 20px;padding:6px;
  background:var(--overlay-soft);border:1px solid var(--panel-border);border-radius:14px;}
.subnav button{background:transparent;border:none;color:var(--sub);padding:9px 16px;border-radius:10px;
  font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;
  white-space:nowrap;transition:background .15s, color .15s;}
.subnav button:hover{color:var(--text);background:rgba(255,255,255,.05);}
.subnav button.active{background:var(--accent);color:#04140f;}

/* ---- botões ---- */
.btn{
  background:linear-gradient(180deg,#3de3a8,#1fae7a);color:#04251a;border:1px solid rgba(255,255,255,.28);border-radius:11px;
  box-shadow:0 5px 14px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.22), inset 0 1px 0 rgba(255,255,255,.4);
  transition:transform .12s ease, filter .12s ease, box-shadow .12s ease;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08);}
.btn:active{transform:translateY(1px);filter:brightness(.95);}
.btn.secondary{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.15);color:var(--text);box-shadow:none;}
.btn.secondary:hover{background:rgba(255,255,255,.09);}
.btn.gold{background:linear-gradient(180deg,#ffd067,#d9972a);color:#2c1c00;box-shadow:0 5px 16px rgba(232,179,74,.28), inset 0 1px 0 rgba(255,255,255,.5);}
.btn.danger{background:linear-gradient(180deg,#f2695e,#c4403a);color:#fff;box-shadow:0 5px 14px rgba(226,84,74,.25), inset 0 1px 0 rgba(255,255,255,.3);}
.btn:disabled{filter:grayscale(.6);box-shadow:none;}
.btn:disabled:hover{transform:none;}

/* ---- painéis e campos ---- */
.panel{background:var(--surface-grad);border:1px solid var(--panel-border);border-radius:18px;
  box-shadow:0 10px 26px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05);}
.field input[type=text],.field select,.field input[type=number]{background:var(--input-bg);border:1px solid var(--input-border);border-radius:10px;transition:border-color .15s, box-shadow .15s;}
.field input:focus,.field select:focus{outline:none;border-color:var(--emerald);box-shadow:0 0 0 3px rgba(var(--accent-r),var(--accent-g),var(--accent-b),.16);}
.tabs-mini{background:var(--overlay-soft);padding:4px;border-radius:12px;display:inline-flex;gap:4px;border:1px solid var(--panel-border);}
.tabs-mini button{border:none;border-radius:9px;padding:8px 16px;font-weight:700;}
.tabs-mini button.active{background:linear-gradient(180deg,#2a4a3d,#1c352b);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);}
.checkbox-team{border-radius:12px;padding:10px 12px;transition:.15s;background:var(--overlay-soft);}
.checkbox-team:hover{border-color:rgba(255,255,255,.25);}
.checkbox-team.sel{background:rgba(var(--accent-r),var(--accent-g),var(--accent-b),.1);box-shadow:0 0 0 1px var(--emerald);}
.modal-bg{background:rgba(3,8,6,.72);backdrop-filter:blur(6px);animation:fadeIn .15s ease both;}
.modal{background:var(--surface-grad);border:1px solid var(--input-border);border-radius:20px;box-shadow:0 30px 70px rgba(0,0,0,.6);animation:popIn .2s ease both;}

/* ---- escudos (crests) ---- */
.crest,.crest-mini,.crest-tiny,.crest-shield{
  position:relative;isolation:isolate;display:flex;align-items:center;justify-content:center;
  clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);border-radius:0 !important;
  padding-bottom:14%;font-family:'Big Shoulders Display',sans-serif;font-weight:800;flex-shrink:0;
}
.crest::before,.crest-mini::before,.crest-tiny::before,.crest-shield::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,0) 45%,rgba(0,0,0,.3));
}

/* ---- stats bar / home ---- */
.stat-chip{position:relative;overflow:hidden;border-radius:14px;background:var(--surface-grad);border:1px solid var(--panel-border);}
.stat-chip::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--emerald));}
.hero{position:relative;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:30px 30px 26px;border-radius:24px;margin-bottom:20px;overflow:hidden;
  background:radial-gradient(circle at 88% 15%,rgba(162,91,255,.38),transparent 45%),radial-gradient(circle at 8% 95%,rgba(var(--accent-r),var(--accent-g),var(--accent-b),.28),transparent 50%),linear-gradient(135deg,#17392b,#0a1812);
  border:1px solid rgba(255,255,255,.1);box-shadow:var(--shadow-lg);}
.hero::before{content:"";position:absolute;right:-70px;top:-70px;width:300px;height:300px;border:2px solid rgba(255,255,255,.07);border-radius:50%;}
.hero::after{content:"";position:absolute;right:20px;top:-20px;width:170px;height:170px;border:2px solid rgba(255,255,255,.06);border-radius:50%;}
.hero-text{flex:1;min-width:250px;position:relative;z-index:2;}
.hero-kicker{display:inline-block;padding:5px 13px;border-radius:999px;background:rgba(232,179,74,.15);border:1px solid rgba(232,179,74,.35);color:var(--gold);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;}
.hero h2{font-family:'Big Shoulders Display',sans-serif;font-size:46px;line-height:.98;margin:12px 0 10px;text-transform:uppercase;}
.hero h2 span{color:var(--gold);}
.hero p{color:#b9cdc2;max-width:470px;margin:0 0 18px;font-size:14px;line-height:1.6;}
.hero-cards{display:flex;position:relative;z-index:2;padding:16px 26px 0 8px;}
.hero-cards .card-wrap{width:132px;margin-left:-26px;transform:none;}
.hero-cards .card-wrap:nth-child(1){transform:rotate(-9deg) translateY(12px);}
.hero-cards .card-wrap:nth-child(2){transform:translateY(-10px);z-index:3;animation:floaty 4.5s ease-in-out infinite;}
.hero-cards .card-wrap:nth-child(3){transform:rotate(9deg) translateY(12px);}
.qc{position:relative;padding:18px;border-radius:18px;cursor:pointer;overflow:hidden;
  background:var(--surface-grad);border:1px solid var(--panel-border);
  transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;}
.qc::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),transparent);}
.qc::after{content:"";position:absolute;right:-34px;bottom:-34px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 70%);opacity:.2;}
.qc:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 14px 30px rgba(0,0,0,.4);}
.qc-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:12px;
  background:linear-gradient(135deg,var(--accent),rgba(0,0,0,.4));box-shadow:0 6px 14px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.3);}
.qc h3{margin:0 0 5px;font-size:16px;}
.qc .desc{color:var(--sub);font-size:12.5px;line-height:1.45;}
.qc .meta-chip{display:inline-block;margin-top:11px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--accent);font-size:11px;font-weight:800;}

/* ---- cartas de jogador ---- */
.card-wrap{position:relative;width:100%;max-width:200px;filter:drop-shadow(0 10px 12px rgba(0,0,0,.5));
  transform:perspective(800px) translateY(var(--ty,0px)) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .15s ease-out, filter .25s ease;}
.card-wrap:hover{--ty:-6px;}
.glow-gold{filter:drop-shadow(0 0 8px rgba(255,215,118,.4)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
.glow-diamond{filter:drop-shadow(0 0 12px rgba(100,230,255,.55)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
.glow-purple{filter:drop-shadow(0 0 14px rgba(162,91,255,.75)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
.glow-white{filter:drop-shadow(0 0 14px rgba(255,255,255,.65)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
.glow-wine{filter:drop-shadow(0 0 14px rgba(180,40,70,.7)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
.glow-neon{animation:neonGlow 1.8s ease-in-out infinite;}
.glow-rainbow{animation:rainbowGlow 4s linear infinite;}
@keyframes neonGlow{
  0%,100%{filter:drop-shadow(0 0 8px rgba(255,32,121,.8)) drop-shadow(0 0 8px rgba(24,247,255,.5)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
  50%{filter:drop-shadow(0 0 18px rgba(255,32,121,1)) drop-shadow(0 0 18px rgba(24,247,255,.9)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
}
@keyframes rainbowGlow{
  0%{filter:drop-shadow(0 0 14px rgba(255,0,76,.8)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
  25%{filter:drop-shadow(0 0 14px rgba(255,238,0,.8)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
  50%{filter:drop-shadow(0 0 14px rgba(0,229,255,.8)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
  75%{filter:drop-shadow(0 0 14px rgba(122,0,255,.8)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
  100%{filter:drop-shadow(0 0 14px rgba(255,0,76,.8)) drop-shadow(0 10px 12px rgba(0,0,0,.5));}
}
.card{position:relative;width:100%;aspect-ratio:150/218;min-height:200px;cursor:pointer;box-shadow:none !important;animation-name:none;
  clip-path:polygon(0 5%,7% 0,93% 0,100% 5%,100% 89%,50% 100%,0 89%);}
.tier-rainbow.card{animation:rainbow-shift 5s linear infinite;}
.card::before{content:"";position:absolute;inset:0;z-index:0;
  background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.05) 35%,rgba(0,0,0,.22) 60%,rgba(255,255,255,.5));}
.card-face{position:absolute;inset:4px;z-index:1;background:inherit;overflow:hidden;
  clip-path:polygon(0 5%,7% 0,93% 0,100% 5%,100% 89%,50% 100%,0 89%);
  display:flex;flex-direction:column;padding:10px 8px 15%;}
.card-face::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 78% 14%,rgba(255,255,255,.4),transparent 52%),
             repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 10px),
             linear-gradient(180deg,transparent 52%,rgba(0,0,0,.26));}
.card-fx{position:absolute;inset:0;z-index:2;pointer-events:none;
  background-image:
   radial-gradient(circle at 18% 28%,rgba(255,255,255,.95) 0 1.2px,transparent 2.4px),
   radial-gradient(circle at 72% 18%,rgba(255,255,255,.9) 0 1px,transparent 2px),
   radial-gradient(circle at 84% 58%,rgba(255,255,255,.9) 0 1.3px,transparent 2.4px),
   radial-gradient(circle at 28% 66%,rgba(255,255,255,.85) 0 1px,transparent 2px),
   radial-gradient(circle at 56% 40%,rgba(255,255,255,.8) 0 1px,transparent 2px);
  animation:twinkle 2.4s ease-in-out infinite;}
.card-glare{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;transition:opacity .2s;
  background:radial-gradient(circle at var(--mx,30%) var(--my,20%),rgba(255,255,255,.55),transparent 48%);}
.card-wrap:hover .card-glare{opacity:.85;}
.cf-top{position:relative;flex:1;min-height:0;z-index:3;}
.cf-av{position:absolute;right:-6px;bottom:0;width:80%;height:100%;z-index:1;}
.cf-av svg{width:100%;height:100%;display:block;}
.cf-meta{position:absolute;left:2px;top:0;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:3;}
.card .ovr{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:28px;line-height:.92;text-shadow:0 1px 0 rgba(255,255,255,.3);}
.card .pos{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:800;letter-spacing:.8px;border-top:1.5px solid currentColor;width:100%;text-align:center;padding-top:2px;}
.card .flag{font-size:17px;line-height:1;margin-top:3px;}
.card .club-crest{width:22px;height:24px;margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);
  clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);padding-bottom:5px;}
.cf-foot{position:relative;z-index:3;text-align:center;}
.card .name{font-weight:800;font-size:12.5px;line-height:1.1;text-transform:uppercase;letter-spacing:.4px;min-height:27px;
  display:flex;align-items:center;justify-content:center;border-top:1px solid rgba(128,128,128,.45);padding-top:3px;}
.cf-row{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:nowrap;}
.card .tier-label{font-size:7.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;opacity:.85;white-space:nowrap;}
.card .value-tag{padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.34);font-size:9.5px;font-family:'JetBrains Mono',monospace;font-weight:800;white-space:nowrap;margin:0;}
.card.tier-bronze .value-tag,.card.tier-silver .value-tag,.card.tier-gold .value-tag,
.card.tier-diamond .value-tag,.card.tier-white .value-tag,.card.tier-neon .value-tag{background:rgba(255,255,255,.45);}
.card .card-actions{position:absolute;top:12px;right:10px;display:flex;gap:6px;z-index:6;}

<body>
<div class="wrap" id="app"></div>
<div class="save-toast" id="saveToast">Progresso salvo</div>

<script>
/* ============================= DATA / CONSTANTS ============================= */
const MAX_OVR = 500;
const TIERS = [
  {max:29,  key:'brown',   label:'Marrom Escuro'},
  {max:69,  key:'bronze',  label:'Bronze'},
  {max:80,  key:'silver',  label:'Prata'},
  {max:89,  key:'gold',    label:'Ouro'},
  {max:95,  key:'diamond', label:'Diamante'},
  {max:250, key:'purple',  label:'Roxo'},
  {max:300, key:'white',   label:'Branco'},
  {max:400, key:'wine',    label:'Vinho'},
  {max:450, key:'neon',    label:'Neon'},
  {max:500, key:'rainbow', label:'Arco-Íris'},
];
function getTier(ovr){
  ovr = Math.max(0, Math.min(MAX_OVR, ovr));
  for(const t of TIERS){ if(ovr<=t.max) return t; }
  return TIERS[TIERS.length-1];
}
/* Campo numérico de OVR. IMPORTANTE: nunca chama render() aqui — um render() a cada tecla
   digitada recria o <input> inteiro e faz o campo perder o foco (era o bug relatado).
   Em vez disso, atualizamos só os elementos específicos (label, aviso, carta de prévia)
   diretamente pelo id, mantendo o campo de texto intacto e com o foco. */
function updateOvrDraft(rawValue, draftObj, ctxKey){
  let n = parseInt(rawValue, 10);
  if(isNaN(n)) n = 0;
  if(n > MAX_OVR){
    draftObj.ovr = MAX_OVR;
    draftObj.ovrWarning = true;
  } else {
    draftObj.ovr = Math.max(0, n);
    draftObj.ovrWarning = false;
  }
  const valueEl = document.getElementById('ovr-value-'+ctxKey);
  if(valueEl) valueEl.textContent = draftObj.ovr;
  const warnEl = document.getElementById('ovr-warning-'+ctxKey);
  if(warnEl) warnEl.style.display = draftObj.ovrWarning ? '' : 'none';
  patchDraftCard(draftObj, ctxKey);
}
function ovrFieldHTML(draftObj, refExpr, ctxKey){
  return `<label>OVR (0 a ${MAX_OVR}): <b id="ovr-value-${ctxKey}" style="color:var(--gold);">${draftObj.ovr}</b></label>
    <input type="number" min="0" max="${MAX_OVR}" step="1" class="ovr-number-full" value="${draftObj.ovr}"
      oninput="updateOvrDraft(this.value, ${refExpr}, '${ctxKey}')" placeholder="Digite o OVR">
    <p id="ovr-warning-${ctxKey}" class="ovr-warning" style="${draftObj.ovrWarning ? '' : 'display:none;'}">⚠ O limite máximo é ${MAX_OVR} OVR. O valor foi ajustado para ${MAX_OVR}.</p>`;
}
/* Patch genérico da carta de prévia (reusado por OVR, valor e nacionalidade) — nunca usa
   render(), só atualiza o container da carta pelo id, preservando o foco de outros campos. */
function patchDraftCard(draftObj, ctxKey){
  const cardEl = document.getElementById('ovr-card-'+ctxKey);
  if(cardEl) cardEl.innerHTML = playerCardHTML({name: draftObj.name || 'Jogador', pos: draftObj.pos, ovr: draftObj.ovr, value: draftObj.value, nationality: draftObj.nationality});
}
/* Campo de valor de mercado (€) — puramente cosmético, não afeta nada do jogo. */
function updateValueDraft(rawValue, draftObj, ctxKey){
  let n = parseFloat(rawValue);
  if(isNaN(n) || n<0) n = 0;
  draftObj.value = Math.round(n);
  const prevEl = document.getElementById('value-preview-'+ctxKey);
  if(prevEl) prevEl.textContent = formatValue(draftObj.value);
  patchDraftCard(draftObj, ctxKey);
}
function suggestValue(draftObj, ctxKey){
  draftObj.value = computePlayerValue(draftObj.ovr);
  const input = document.getElementById('value-input-'+ctxKey);
  if(input) input.value = draftObj.value;
  const prevEl = document.getElementById('value-preview-'+ctxKey);
  if(prevEl) prevEl.textContent = formatValue(draftObj.value);
  patchDraftCard(draftObj, ctxKey);
}
function valueFieldHTML(draftObj, refExpr, ctxKey){
  return `<label>Valor de Mercado (€)</label>
    <div class="value-input-row">
      <input type="number" id="value-input-${ctxKey}" min="0" step="1000" class="ovr-number-full" value="${draftObj.value}"
        oninput="updateValueDraft(this.value, ${refExpr}, '${ctxKey}')" placeholder="Valor em €">

  '4-2-3-1': [{p:'GK',n:1},{p:'DEF',n:4},{p:'DM',n:2},{p:'MID',n:3},{p:'FWD',n:1}],
  '5-3-2':   [{p:'GK',n:1},{p:'DEF',n:5},{p:'MID',n:3},{p:'FWD',n:2}],
  '3-4-3':   [{p:'GK',n:1},{p:'DEF',n:3},{p:'MID',n:4},{p:'FWD',n:3}],
};
function labelForRow(purpose,count,i){
  if(purpose==='GK') return 'GOL';
  if(purpose==='DEF'){ if(count>=4 && (i===0||i===count-1)) return 'LAT'; return 'ZAG'; }
  if(purpose==='DM') return 'VOL';
  if(purpose==='MID') return 'MEI';
  if(purpose==='FWD'){ if(count===3 && (i===0||i===count-1)) return 'PON'; return 'ATA'; }
  return 'MEI';
}
function buildFormationSlots(key){
  const rows = FORMATIONS[key] || FORMATIONS['4-3-3'];
  const n = rows.length;
  const slots = [];
  rows.forEach((row,ri)=>{
    const y = n===1 ? 50 : 92 - (ri*(82/(n-1)));
    for(let i=0;i<row.n;i++){
      const x = row.n===1 ? 50 : 12 + i*((88-12)/(row.n-1));
      slots.push({label:labelForRow(row.p,row.n,i), x, y});
    }
  });
  return slots;
}

/* ---- Valor de mercado (€) — cosmético, não afeta nada do jogo ---- */
const VALUE_ANCHORS = [
  {ovr:0,   value:300},
  {ovr:29,  value:5000},
  {ovr:69,  value:60000},
  {ovr:80,  value:300000},
  {ovr:89,  value:3000000},
  {ovr:95,  value:18000000},
  {ovr:250, value:600000000},
  {ovr:300, value:3000000000},
  {ovr:400, value:30000000000},
  {ovr:450, value:150000000000},
  {ovr:500, value:1000000000000},
];
function baseValueForOvr(ovr){
  ovr = Math.max(0, Math.min(MAX_OVR, ovr));
  for(let i=0;i<VALUE_ANCHORS.length-1;i++){
    const a = VALUE_ANCHORS[i], b = VALUE_ANCHORS[i+1];
    if(ovr>=a.ovr && ovr<=b.ovr){
      const t = (ovr-a.ovr) / ((b.ovr-a.ovr) || 1);
      const logA = Math.log(a.value), logB = Math.log(b.value);
      return Math.exp(logA + (logB-logA)*t);
    }
  }
  return VALUE_ANCHORS[VALUE_ANCHORS.length-1].value;
}
function computePlayerValue(ovr){
  const base = baseValueForOvr(ovr);
  const variance = 0.85 + Math.random()*0.3; // ±15%, pra não ficar sempre idêntico no mesmo OVR
  return Math.max(100, Math.round(base*variance));
}
function formatValue(v){
  v = Number(v)||0;
  const fmt = (num, suffix, roundThreshold)=>{
    let s = num.toFixed(num>=roundThreshold ? 0 : 1);
    if(s.endsWith('.0')) s = s.slice(0,-2);
    return '€'+s+suffix;
  };
  if(v>=1e12) return fmt(v/1e12, 'tri', 1e13/1e12);
  if(v>=1e9)  return fmt(v/1e9,  'bi',  1e10/1e9);
  if(v>=1e6)  return fmt(v/1e6,  'mi',  1e7/1e6);
  if(v>=1e3)  return fmt(v/1e3,  'mil', 1e4/1e3);
  return '€'+Math.round(v);
}

function makePlayer(name,pos,ovr,opts={}){
  const finalOvr = Math.max(0,Math.min(MAX_OVR,Math.round(ovr)));
  const value = (opts.value!==undefined && opts.value!==null && !isNaN(opts.value)) ? Math.max(0,Math.round(opts.value)) : computePlayerValue(finalOvr);
  const nationality = opts.nationality || pick(NATIONALITIES).name;
  return {id:uid(), name, pos, ovr:finalOvr, value, nationality};
}
/* Preenche value/nationality em jogadores salvos antes dessa funcionalidade existir */
function ensurePlayerExtras(p){
  if(!p) return p;
  if(p.value===undefined || p.value===null || isNaN(p.value)) p.value = computePlayerValue(p.ovr);
  if(!p.nationality) p.nationality = pick(NATIONALITIES).name;
  return p;
}
function randomPlayer(qualityBias){
  let base = 45 + qualityBias*40;
  let ovr = base + rnd(-10,10);
  let roll = Math.random();
  if(roll>0.998) ovr = rnd(251,500);     // card lendária raríssima (Branco a Arco-Íris)
  else if(roll>0.985) ovr = rnd(96,130); // Roxo
  else if(roll>0.93) ovr = rnd(90,95);   // Diamante
  else if(roll>0.75) ovr = rnd(81,89);   // Ouro
  return makePlayer(randomName(), pick(POSITIONS), ovr);
}

/* ============================= PERSISTENCE ============================= */
/* Camada de armazenamento dupla:
   - Dentro do preview de artefatos da Claude, usa window.storage (por usuário, entre sessões).
   - Rodando como PWA instalado/hospedado fora da Claude (onde window.storage não existe),
     usa localStorage do navegador — que é o que de fato persiste num PWA. */
const STORAGE_KEY = 'planifa1-data';
const AppStorage = {
  async get(key){
    if(window.storage && typeof window.storage.get === 'function'){
      try{
        const r = await window.storage.get(key, false);
        if(r && typeof r.value === 'string') return r.value;
      }catch(e){ /* cai para localStorage */ }
    }
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  async set(key, value){
    let ok = false;
    if(window.storage && typeof window.storage.set === 'function'){
      try{ await window.storage.set(key, value, false); ok = true; }catch(e){ /* cai para localStorage */ }
    }
    try{ localStorage.setItem(key, value); ok = true; }catch(e){ /* localStorage pode falhar em modo privado */ }
    return ok;
  }
};
async function loadState(){
  try{
    const raw = await AppStorage.get(STORAGE_KEY);
    if(raw){
      const data = JSON.parse(raw);
      state.teams = Array.isArray(data.teams) ? data.teams : [];
      state.freeAgents = Array.isArray(data.freeAgents) ? data.freeAgents : [];
      state.categories = Array.isArray(data.categories) ? data.categories : [];
      state.worldCup = data.worldCup || null;
      state.league = data.league || null;
      state.device = data.device || null;
      state.transfers = Array.isArray(data.transfers) ? data.transfers : [];
      state.settings = Object.assign(defaultSettings(), data.settings||{});
      if(!state.teams.length && !state.freeAgents.length) seedData();
    } else {
      seedData();
    }
  } catch(e){
    seedData();
  }
  // migração: jogadores salvos antes de value/nacionalidade existirem ganham valores agora
  state.teams.forEach(t=> t.players.forEach(p=>{ if(p) ensurePlayerExtras(p); }));
  state.freeAgents.forEach(p=> ensurePlayerExtras(p));
  state.teams.forEach(t=>{ if(!t.crest) t.crest = defaultCrestFor(t); });
  if(!state.settings) state.settings = defaultSettings();
  applyTheme();
  state.view = state.device ? 'home' : 'devicePick';
  render();
}
let saveTimer=null;
async function saveState(){
  const toast = document.getElementById('saveToast');
  try{
    const payload = {
      teams: state.teams,
      freeAgents: state.freeAgents,
      categories: state.categories,
      worldCup: (state.worldCup && state.worldCup.rounds) ? state.worldCup : null,
      league: (state.league && state.league.matches) ? state.league : null,
      device: state.device,
      transfers: state.transfers,
      settings: state.settings,
    };
    await AppStorage.set(STORAGE_KEY, JSON.stringify(payload));
    if(toast){
      toast.classList.add('show');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=>toast.classList.remove('show'), 1200);
    }
  } catch(e){ console.error('Falha ao salvar progresso', e); }
}

function hashStr(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function contrastText(hex){
  if(!hex || hex[0]!=='#' || hex.length<7) return '#04140f';
  const n=parseInt(hex.slice(1,7),16),r=n>>16,g=(n>>8)&255,b=n&255;
  return (0.299*r+0.587*g+0.114*b)>150 ? '#04140f' : '#ffffff';
}

/* Monta o SVG do escudo a partir da configuração (usado tanto na prévia do editor quanto nas telas do jogo). */
function crestSVGFromConfig(cfg, size, idSeed){
  size = size || 48;
  const shape = cfg.shape || 'shield';
  const pattern = cfg.pattern || 'solid';
  const base = cfg.base || '#29d398';
  const accent = cfg.accent || shade(base,-42);
  const clip = crestShapeClip(shape);
  let defsExtra = '';
  let fill = `<rect width="100" height="110" fill="${base}"/>`;
  if(pattern==='split'){
    fill = `<rect width="100" height="110" fill="${base}"/><polygon points="0,110 100,0 100,110" fill="${accent}"/>`;
  } else if(pattern==='gradient'){
    defsExtra += `<linearGradient id="gr${idSeed}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${base}"/><stop offset="1" stop-color="${accent}"/></linearGradient>`;
    fill = `<rect width="100" height="110" fill="url(#gr${idSeed})"/>`;
  } else if(pattern==='stripes'){
    let st=''; const n=5, w=100/n;
    for(let i=0;i<n;i++) st += `<rect x="${i*w}" y="0" width="${w}" height="110" fill="${i%2 ? accent : base}"/>`;
    fill = st;
  } else if(pattern==='quarters'){
    fill = `<rect x="0" y="0" width="50" height="55" fill="${base}"/><rect x="50" y="0" width="50" height="55" fill="${accent}"/>`+
           `<rect x="0" y="55" width="50" height="55" fill="${accent}"/><rect x="50" y="55" width="50" height="55" fill="${base}"/>`;
  } else if(pattern==='cross'){
    fill = `<rect width="100" height="110" fill="${base}"/><rect x="40" y="0" width="20" height="110" fill="${accent}"/><rect x="0" y="45" width="100" height="20" fill="${accent}"/>`;
  } else if(pattern==='dots'){
    defsExtra += `<pattern id="dp${idSeed}" width="22" height="22" patternUnits="userSpaceOnUse"><rect width="22" height="22" fill="${base}"/><circle cx="11" cy="11" r="5.5" fill="${accent}"/></pattern>`;
    fill = `<rect width="100" height="110" fill="url(#dp${idSeed})"/>`;
  } else if(pattern==='chevron'){
    fill = `<rect width="100" height="110" fill="${base}"/><polygon points="0,0 50,52 100,0 100,22 50,74 0,22" fill="${accent}"/>`;
  }
  const symbolMeta = CREST_SYMBOLS.find(sy=>sy.key===cfg.symbol) || CREST_SYMBOLS[0];
  const hasSymbol = symbolMeta.key!=='none';
  const hasText = !!(cfg.text && String(cfg.text).trim());
  const textOnTop = cfg.textPos==='top';
  let symbolY, textY;
  if(hasSymbol && hasText){ symbolY = textOnTop ? 80 : 50; textY = textOnTop ? 28 : 90; }
  else { symbolY = 58; textY = 58; }
  const symbolEl = hasSymbol ? `<text x="50" y="${symbolY}" font-size="38" text-anchor="middle" dominant-baseline="central">${symbolMeta.emoji}</text>` : '';
  const textColor = contrastText(base);
  const textEl = hasText ? `<text x="50" y="${textY}" font-family="'Big Shoulders Display',sans-serif" font-weight="800" font-size="${hasSymbol?17:27}" letter-spacing="1" fill="${textColor}" text-anchor="middle" dominant-baseline="central">${escHtml(String(cfg.text).toUpperCase().slice(0,5))}</text>` : '';
  const borderEl = pattern==='border' ? `<g fill="none" stroke="${accent}" stroke-width="7">${clip}</g>` : '';
  const starsN = Math.max(0, Math.min(5, cfg.stars||0));
  let starsEl = '';
  if(starsN>0){
    const startX = 50 - (starsN-1)*7;
    for(let i=0;i<starsN;i++) starsEl += `<text x="${startX+i*14}" y="-2" font-size="13" text-anchor="middle">⭐</text>`;
  }
  return `<svg viewBox="0 -16 100 126" width="${size}" height="${Math.round(size*1.26)}" style="display:block;overflow:visible;filter:drop-shadow(0 4px 6px rgba(0,0,0,.45));">
    <defs><clipPath id="cc${idSeed}">${clip}</clipPath>${defsExtra}</defs>
    ${starsEl}
    <g clip-path="url(#cc${idSeed})">
      ${fill}
      <rect width="100" height="55" fill="rgba(255,255,255,.16)"/>
      <rect y="55" width="100" height="55" fill="rgba(0,0,0,.1)"/>
    </g>
    ${borderEl}
    <g fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2.5">${clip}</g>
    ${symbolEl}
    ${textEl}
  </svg>`;
}

/* inclinação 3D + brilho que acompanha o mouse nas cartas */
function initCardTilt(){
  if(!document.addEventListener) return;
  document.addEventListener('mousemove', e=>{
    const w = e.target && e.target.closest ? e.target.closest('.card-wrap') : null;
    if(!w) return;
    const r = w.getBoundingClientRect();
    const px = (e.clientX-r.left)/r.width, py = (e.clientY-r.top)/r.height;
    w.style.setProperty('--ry', ((px-.5)*16)+'deg');
    w.style.setProperty('--rx', ((.5-py)*16)+'deg');
    w.style.setProperty('--mx', (px*100)+'%');
    w.style.setProperty('--my', (py*100)+'%');
  });
  document.addEventListener('mouseout', e=>{
    const w = e.target && e.target.closest ? e.target.closest('.card-wrap') : null;
    if(w && !w.contains(e.relatedTarget)){ w.style.setProperty('--rx','0deg'); w.style.setProperty('--ry','0deg'); }
  });
}

function legendHTML(){

function teamTileHTML(t){
  const filled = teamFilled(t);
  const avgOvr = filled.length ? Math.round(filled.reduce((a,p)=>a+p.ovr,0)/filled.length) : 0;
  const sumValue = filled.reduce((a,p)=>a+(p.value||0),0);
  const best = filled.slice().sort((a,b)=>b.ovr-a.ovr)[0];
  const selMode = state.teamSelectMode;
  const isSel = state.selectedTeamIds.includes(t.id);
  return `<div class="team-tile tt ${isSel?'tile-selected':''}" style="--tc:${t.color};" onclick="${selMode ? `toggleTeamSelected('${t.id}')` : `openTeam('${t.id}')`}">

    <h3>${t.name}</h3>
    <div class="tt-chips"><span>${t.formation}</span><span>${filled.length}/11</span></div>
    <div class="tt-stats">

function generateRandomTeam(){
  const t = generateRandomTeamObject();
  state.teams.push(t);
  saveState();
  setView('teamDetail',{currentTeamId:t.id});
}
function openTeam(id){ setView('teamDetail', {currentTeamId:id}); }
function toggleTeamSelectMode(){ state.teamSelectMode=!state.teamSelectMode; state.selectedTeamIds=[]; render(); }
function toggleTeamSelected(id){
  const idx = state.selectedTeamIds.indexOf(id);
  if(idx>-1) state.selectedTeamIds.splice(idx,1); else state.selectedTeamIds.push(id);
  render();
}
function bulkDeleteTeams(){
  if(!state.selectedTeamIds.length) return;
  const count = state.selectedTeamIds.length;
  showConfirm(`Remover ${count} time(s) selecionado(s)? Os jogadores voltam ao catálogo de agentes livres.`, ()=>{
    const removedSet = new Set(state.selectedTeamIds);
    state.selectedTeamIds.forEach(id=>{
      const t = findTeam(id);
      if(t){ teamFilled(t).forEach(p=>logTransfer('release', p, t.name, FREE_LABEL)); state.freeAgents.push(...teamFilled(t)); }
    });
    state.teams = state.teams.filter(t=>!removedSet.has(t.id));
    state.categories.forEach(cat=>{ cat.teamIds = cat.teamIds.filter(id=>!removedSet.has(id)); });
    if(state.worldCup && state.worldCup.selected){ state.worldCup.selected = state.worldCup.selected.filter(id=>!removedSet.has(id)); }
    state.selectedTeamIds = [];
    state.teamSelectMode = false;
    saveState();
    setView('teams');
  });
}

function deleteTeam(id){
  const t = findTeam(id);
  if(!t) return;
  showConfirm(`Excluir o time "${t.name}"? Os jogadores voltarão ao catálogo de agentes livres.`, ()=>{
    teamFilled(t).forEach(p=>logTransfer('release', p, t.name, FREE_LABEL));
    state.freeAgents.push(...teamFilled(t));
    state.teams = state.teams.filter(x=>x.id!==id);
    saveState();
    setView('teams');
  });
}
function changeFormation(teamId, newKey){
  const t = findTeam(teamId);
  const current = teamFilled(t);
  t.formation = newKey;
  const total = buildFormationSlots(newKey).length;
  t.players = Array(total).fill(null);
  current.slice(0,total).forEach((p,i)=>{ t.players[i]=p; });
  if(current.length>total) state.freeAgents.push(...current.slice(total));
  saveState();
  render();
}
function openSlotModal(teamId, idx){
  const t = findTeam(teamId);
  state.modal = {type:'slot', teamId, slotIndex:idx, tab: t.players[idx] ? 'view' : 'agents', posFilter:'ALL', tierFilter:'ALL', natFilter:'ALL'};
  render();
}

/* ============================= CATALOG (free agents) ============================= */
function filteredAgents(){
  let list = [...state.freeAgents];
  const f = state.catalogFilter;
  if(f.search.trim()) list = list.filter(p=>p.name.toLowerCase().includes(f.search.trim().toLowerCase()));
  if(f.pos!=='ALL') list = list.filter(p=>p.pos===f.pos);
  if(f.tier!=='ALL') list = list.filter(p=>getTier(p.ovr).key===f.tier);
  if(f.nat && f.nat!=='ALL') list = list.filter(p=>p.nationality===f.nat);

function assignAgentToSlot(teamId, idx, playerId){
  const t = findTeam(teamId);
  const ai = state.freeAgents.findIndex(p=>p.id===playerId);
  if(ai<0) return;
  const removed = t.players[idx];
  t.players[idx] = state.freeAgents[ai];
  state.freeAgents.splice(ai,1);
  logTransfer('signing', t.players[idx], FREE_LABEL, t.name);
  if(removed){ state.freeAgents.push(removed); logTransfer('release', removed, t.name, FREE_LABEL); }
  saveState();
  closeModal();
}
function createAndAddToSlot(teamId, idx){
  if(!modalDraftPlayer.name.trim()){ showAlert('Dê um nome ao jogador.'); return; }
  const t = findTeam(teamId);
  const removed = t.players[idx];
  t.players[idx] = makePlayer(modalDraftPlayer.name.trim(), modalDraftPlayer.pos, modalDraftPlayer.ovr, {value:modalDraftPlayer.value, nationality:modalDraftPlayer.nationality});
  logTransfer('new', t.players[idx], 'Criado por você', t.name);
  if(removed){ state.freeAgents.push(removed); logTransfer('release', removed, t.name, FREE_LABEL); }
  modalDraftPlayer = defaultDraftPlayer(75);
  saveState();
  closeModal();
}
function removeFromSlot(teamId, idx){
  const t = findTeam(teamId);
  const p = t.players[idx];
  if(p){ state.freeAgents.push(p); logTransfer('release', p, t.name, FREE_LABEL); }
  t.players[idx] = null;
  saveState();
  closeModal();
}

function saveEditPlayer(){
  const m = state.modal;
  if(!m.draft.name.trim()){ showAlert('Dê um nome ao jogador.'); return; }
  let p;
  if(m.source==='team'){ p = findTeam(m.a).players[m.b]; } else { p = state.freeAgents.find(x=>x.id===m.a); }
  const oldValue = p.value;
  p.name = m.draft.name.trim(); p.pos = m.draft.pos; p.ovr = Math.max(0,Math.min(MAX_OVR, m.draft.ovr));
  p.value = Math.max(0, Math.round(m.draft.value)||0);
  p.nationality = m.draft.nationality;
  if(oldValue!==p.value){
    const where = m.source==='team' ? findTeam(m.a).name : FREE_LABEL;
    logTransfer('valuechange', p, where, where, {oldValue});
  }
  saveState();
  closeModal();
}
function deleteEditingPlayer(){
  const m = state.modal;
  showConfirm('Excluir este jogador definitivamente?', ()=>{
    let dp, from;
    if(m.source==='team'){ const t=findTeam(m.a); dp=t.players[m.b]; from=t.name; t.players[m.b]=null; }
    else { dp=state.freeAgents.find(x=>x.id===m.a); from=FREE_LABEL; state.freeAgents=state.freeAgents.filter(x=>x.id!==m.a); }
    if(dp) logTransfer('retire', dp, from, 'Aposentado');
    saveState();
  });
}

function setWCSize(size){
  if(!state.worldCup || state.worldCup.rounds || state.worldCup.phase) state.worldCup = {selected:[], size:null, groupStage:false, thirdPlace:false};
  state.worldCup.size = size;

function toggleWCTeam(id){

  if(!state.worldCup.selected) state.worldCup.selected=[];

  if(i>-1) s.splice(i,1); else s.push(id);

function toggleWCGroupStage(){
  if(!state.worldCup) return;
  state.worldCup.groupStage = !state.worldCup.groupStage;
  sanitizeWCOptions();
  render();

function toggleWCThirdPlace(){
  if(!state.worldCup) return;
  state.worldCup.thirdPlace = !state.worldCup.thirdPlace;
  sanitizeWCOptions();
  render();
}
function sanitizeWCOptions(){
  const wc = state.worldCup;
  if(!wc) return;
  if(!wc.size || wc.size<4) wc.groupStage = false;
  const knockoutSize = wc.groupStage ? (wc.size?wc.size/2:0) : (wc.size||0);
  if(knockoutSize<4) wc.thirdPlace = false;
}
function startWorldCup(){
  const wc = state.worldCup;
  const size = wc.size;
  if(!size) return;
  let ids = [...wc.selected];
  if(ids.length !== size){
    showAlert(`Selecione exatamente ${size} time(s) para iniciar esta copa (você tem ${ids.length}).`);
    return;
  }
  for(let i=ids.length-1;i>0;i--){ const j=rnd(0,i); [ids[i],ids[j]]=[ids[j],ids[i]]; }

  const groupStage = !!wc.groupStage;
  const thirdPlace = !!wc.thirdPlace;

  if(groupStage){
    const groups = [];
    for(let i=0;i<ids.length;i+=4){
      const teamIds = ids.slice(i,i+4);
      groups.push({ id:'g'+groups.length, teamIds, matches: generateGroupMatches(teamIds) });
    }
    state.worldCup = { selected:ids, size, groupStage, thirdPlace, phase:'groups', groups, rounds:null, thirdPlaceMatch:null, champion:null };
  } else {
    const rounds = buildKnockoutRounds(ids);
    state.worldCup = { selected:ids, size, groupStage, thirdPlace, phase:'knockout', groups:null, rounds, thirdPlaceMatch:null, champion:null };
  }
  saveState();
  setView('worldcup');
}
function buildKnockoutRounds(flatIds){
  const rounds = [];
  let count = flatIds.length;
  let current = flatIds;
  while(count>=2){
    const matches = [];
    for(let i=0;i<count;i+=2){
      matches.push({
        a: current ? current[i] : null,
        b: current ? current[i+1] : null,
        scoreA:null, scoreB:null, played:false, winner:null
      });
    }
    rounds.push(matches);
    count = count/2;
    current = null;
  }
  return rounds;
}
function generateGroupMatches(teamIds){
  const matches = [];
  for(let i=0;i<teamIds.length;i++){
    for(let j=i+1;j<teamIds.length;j++){
      matches.push({ id:uid(), a:teamIds[i], b:teamIds[j], scoreA:null, scoreB:null, played:false });
    }
  }
  return matches;
}
function computeGroupStandings(group){
  const stats = {};
  group.teamIds.forEach(id=>{ stats[id] = {id, played:0, wins:0, draws:0, losses:0, gf:0, ga:0, pts:0}; });
  group.matches.forEach(m=>{
    if(!m.played) return;
    const sa=stats[m.a], sb=stats[m.b];
    sa.played++; sb.played++;
    sa.gf+=m.scoreA; sa.ga+=m.scoreB;
    sb.gf+=m.scoreB; sb.ga+=m.scoreA;
    if(m.scoreA>m.scoreB){ sa.wins++; sa.pts+=3; sb.losses++; }
    else if(m.scoreA<m.scoreB){ sb.wins++; sb.pts+=3; sa.losses++; }
    else { sa.draws++; sb.draws++; sa.pts++; sb.pts++; }
  });
  return Object.values(stats).sort((x,y)=> y.pts-x.pts || (y.gf-y.ga)-(x.gf-x.ga) || y.gf-x.gf);
}

function advanceFromGroups(){

function renderBracketTree(rounds, openFnName){
  openFnName = openFnName || 'openMatch';
  // No celular, colunas mais estreitas e caixas um pouco mais altas (toque mais fácil);
  // no tablet/PC, colunas mais largas aproveitando o espaço da tela.
  const isMobile = state.device==='mobile';
  const BASE_UNIT = isMobile?84:96, MATCH_H = isMobile?70:64, COL_W = isMobile?168:210, COL_GAP = isMobile?32:44;
  const positions = [];
  const n0 = rounds[0].length;
  positions[0] = rounds[0].map((_,i)=> i*BASE_UNIT + BASE_UNIT/2);
  for(let r=1;r<rounds.length;r++){
    positions[r] = rounds[r].map((_,i)=>{
      const c1 = positions[r-1][2*i], c2 = positions[r-1][2*i+1];
      return (c1+c2)/2;
    });
  }
  const totalHeight = n0*BASE_UNIT;
  const totalWidth = rounds.length*COL_W + (rounds.length-1)*COL_GAP;

  let labels='', boxes='', connectors='';
  rounds.forEach((round,ri)=>{
    const left = ri*(COL_W+COL_GAP);
    labels += `<div class="bracket-roundlabel" style="left:${left}px;width:${COL_W}px;">${roundName(round.length)}</div>`;
    round.forEach((m,mi)=>{
      boxes += matchBoxHTML(m, ri, mi, left, positions[ri][mi], COL_W, MATCH_H, openFnName);
    });
  });
  for(let r=0;r<rounds.length-1;r++){
    const colRight = r*(COL_W+COL_GAP)+COL_W;
    const midX = colRight + COL_GAP/2;
    const pairs = rounds[r].length/2;
    for(let p=0;p<pairs;p++){
      const y1 = positions[r][2*p], y2 = positions[r][2*p+1];
      const yTop = Math.min(y1,y2), yBot = Math.max(y1,y2);
      connectors += `<div class="conn-h" style="left:${colRight}px; top:${y1}px; width:${COL_GAP/2}px;"></div>`;
      connectors += `<div class="conn-h" style="left:${colRight}px; top:${y2}px; width:${COL_GAP/2}px;"></div>`;
      connectors += `<div class="conn-v" style="left:${midX}px; top:${yTop}px; height:${yBot-yTop}px;"></div>`;
      connectors += `<div class="conn-h" style="left:${midX}px; top:${(y1+y2)/2}px; width:${COL_GAP/2}px;"></div>`;
    }
  }
  return `<div class="bracket-scroll"><div class="bracket-canvas" style="width:${totalWidth}px;height:${totalHeight+20}px;">
    ${connectors}${boxes}${labels}
  </div></div>`;
}
function matchBoxHTML(m, ri, mi, left, y, colW, matchH, openFnName){
  const ta = m.a ? findTeam(m.a) : null;
  const tb = m.b ? findTeam(m.b) : null;
  const canPlay = ta && tb && !m.played;
  const rowTeam = (t, score, isWinner)=>{
    if(!t) return `<div class="row-team tbd">A definir</div>`;
    return `<div class="row-team ${isWinner?'winner':''}">
      <div class="crest-tiny" style="background:${t.color};">${crestLetters(t.name)}</div>
      <span class="rt-name">${t.name}</span>
      ${score!==null ? `<span class="sc">${score}</span>` : ''}
    </div>`;
  };
  const winnerA = m.played && m.winner===m.a;
  const winnerB = m.played && m.winner===m.b;
  return `<div class="bracket-match ${canPlay?'playable':''}" style="left:${left}px; top:${y}px; width:${colW}px; height:${matchH}px;" ${canPlay?`onclick="${openFnName}(${ri},${mi})"`:''}>
    ${rowTeam(ta, m.played?m.scoreA:null, winnerA)}
    ${rowTeam(tb, m.played?m.scoreB:null, winnerB)}
    ${canPlay?`<div class="play-hint">▶ Simular</div>`:''}
  </div>`;
}

}
function toggleLeagueTeam(id){
  if(!state.league || state.league.phase) state.league = {selected:[], size:null};
  if(!state.league.selected) state.league.selected = [];

  const i = s.indexOf(id);

function startLeague(){

    showAlert(`Selecione exatamente ${lg.size} time(s) para iniciar a liga (você tem ${ids.length}).`);
    return;
  }

  state.league = { teams:ids, size:lg.size, matches, phase:'group', knockoutRounds:null, champion:null };

function openLeagueKnockoutMatch(roundIdx, matchIdx){

function escHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function logTransfer(kind, p, from, to, extra){

  const m = Math.floor(s/60); if(m<60) return `há ${m} min`;
